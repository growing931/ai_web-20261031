      ? '<img src="' + esc(p.photo) + '" alt="' + esc(p.name) + ' 사진" data-fallback="' + esc(p.initial || (p.name || "").charAt(0)) + '">'
      : initial;
    function webUrl(u) { return /^https?:\/\//i.test(u) ? u : "https://" + u; }
    var contacts = list(p.contacts, function (c) {
      var v;
      if (c.type === "email") v = '<a href="mailto:' + esc(c.value) + '">' + esc(c.value) + "</a>";
      else if (c.type === "tel") v = '<a href="tel:' + esc(String(c.value).replace(/[^\d+]/g, "")) + '">' + esc(c.value) + "</a>";
      else if (c.type === "link") v = '<a href="' + esc(webUrl(c.value)) + '" target="_blank" rel="noopener">' + esc(c.value) + "</a>";
      else if (c.type === "links") v = [].concat(c.value).map(function (u) {
        return '<a href="' + esc(webUrl(u)) + '" target="_blank" rel="noopener">' + esc(u) + '<span class="sr-only"> (새 창)</span></a>';
      }).join(' <span class="dot-sep" aria-hidden="true">/</span> ');
      else v = esc(c.value);
      return "<div><dt>" + esc(c.label) + "</dt><dd>" + v + "</dd></div>";
    });
    var resources = (p.resources || []).length
      ? '<div class="ib-res"><h3>' + esc(p.resourcesTitle || "강의 자료") + "</h3>" +
          '<ul class="ib-res-list">' + list(p.resources, function (r) {
            return '<li><a href="' + esc(webUrl(r.url)) + '" target="_blank" rel="noopener">' +
              '<span class="ib-res-dot" aria-hidden="true"></span><span class="ib-res-label">' + esc(r.label) + "</span>" +
              '<span class="ib-res-go" aria-hidden="true">↗</span><span class="sr-only"> (새 창)</span></a></li>';
          }) + "</ul></div>"
      : "";
    var email = (p.contacts || []).filter(function (c) { return c.type === "email"; })[0];
    return (
      // 참고 디자인의 하단 '안내' 배너 형태로 교수자 소개
      (p.name
        ? '<div class="container"><section class="info-banner reveal" id="instructor" aria-labelledby="ib-title">' +
            '<div class="ib-text">' +
              '<h2 id="ib-title">' + esc(p.title || "교수자 소개") + "</h2>" +
              '<p class="ib-person"><strong>' + esc(p.name) + "</strong>" +
                (p.nameZh ? ' <span class="zh">' + esc(p.nameZh) + "</span>" : "") +
                (p.nameEn ? ' <span class="ib-en">' + esc(p.nameEn) + "</span>" : "") + "</p>" +
              ((p.affiliation || []).length || p.role
                ? '<p class="ib-aff">' + [].concat(p.affiliation || p.role).map(esc).join("<br>") + "</p>" : "") +
              ((p.positions || []).length ? '<ul class="ib-pos">' + list(p.positions, function (x) { return "<li>" + esc(x) + "</li>"; }) + "</ul>" : "") +
              (p.bio ? '<p class="ib-bio">' + esc(p.bio) + "</p>" : "") +
              '<dl class="ib-list">' + contacts + "</dl>" +
              '<div class="ib-actions">' +
                (email ? '<a class="btn btn-brown" href="mailto:' + esc(email.value) + '">이메일 보내기 <span aria-hidden="true">→</span></a>' : "") +
                '<a class="btn btn-brown" href="#apply">수강 신청 <span aria-hidden="true">→</span></a>' +
              "</div>" +
            "</div>" +
            '<div class="ib-visual"><div class="avatar">' + avatar + "</div></div>" +
            resources +
          "</section></div>"
        : "") +
      '<div class="footer-main"><div class="container">' +
        '<div class="footer-top">' +
          '<div class="footer-brand"><span class="logo-mark" aria-hidden="true">🌸</span><strong>' + esc(C.site.courseName) + "</strong>" +
            '<span class="muted small">' + esc((C.site.university || "") + " " + (C.site.department || "")) + "</span></div>" +
          '<nav class="footer-links" aria-label="바닥글 메뉴">' + list(C.nav, function (n2) {
            return '<a href="#' + esc(n2.id) + '">' + esc(n2.label) + "</a>";
          }) + "</nav>" +
        "</div>" +
        '<div class="footer-info">' +
          (f.copyright ? '<p class="copy">' + esc(f.copyright) + "</p>" : "") +
          ((f.links || []).length ? '<p class="footer-sites">' + (f.links || []).map(function (l) {
            return '<span>' + esc(l.label) + ': <a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.text || l.url) +
              '<span class="sr-only"> (새 창)</span></a></span>';
          }).join('<span class="dot-sep" aria-hidden="true"> · </span>') + "</p>" : "") +
          list(f.lines, function (l) { return "<p>" + esc(l) + "</p>"; }) +
        "</div>" +
      "</div></div>"
    );
  }

  /* ---------- 페이지 그리기 ---------- */
  document.title = C.site.title || document.title;
  document.getElementById("logo-text").textContent = C.site.logoText || C.site.courseName;
  document.getElementById("logo-sub").textContent = C.site.logoSub || "";

  // 맨 위 작은 바로가기 줄
  var util = document.getElementById("util");
  if (util) {
    var ub = C.site.utilButton;
    util.innerHTML =
      '<div class="util-links">' + list(C.site.utilLinks, function (l) {
        return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '<span class="sr-only"> (새 창)</span></a>';
      }) + "</div>" +
      '<div class="util-right"><span>' + esc((C.site.department || "") + " · " + (C.site.courseName || "")) + "</span>" +
        (ub ? '<a class="util-btn" href="#' + esc(ub.target) + '">' + esc(ub.label) + ' <span aria-hidden="true">↗</span></a>' : "") +
      "</div>";
  }

  var nav = document.getElementById("nav");
  nav.innerHTML = list(C.nav, function (n) {
    return '<a href="#' + esc(n.id) + '" data-id="' + esc(n.id) + '">' + esc(n.label) + "</a>";
  });

  var order = ["hero", "stats", "notices", "about", "curriculum", "tools", "enroll", "participate", "faq"];
  document.getElementById("main").innerHTML = order
    .filter(function (k) { return C[k]; })
    .map(function (k) { return render[k](C[k]); })
    .join("");
  document.getElementById("footer").innerHTML = renderFooter();
  // 교수자 사진 파일이 없으면 이니셜로 바꾸기
  document.querySelectorAll("img[data-fallback]").forEach(function (img) {
    function fallback() {
      var s = document.createElement("span");
      s.className = "zh";
      s.setAttribute("aria-hidden", "true");
      s.textContent = img.dataset.fallback;
      img.replaceWith(s);
    }
    if (img.complete && !img.naturalWidth) fallback();
    else img.addEventListener("error", fallback);
  });
  if (window.Curriculum) window.Curriculum.init();
  if (window.Participate) window.Participate.init();

  /* ---------- 공지 쪽 번호 내비게이션 ---------- */
  var pagerEl = document.querySelector(".news-pager");
  if (pagerEl) {
    var newsCards = document.querySelectorAll(".news-card[data-page]");
    var lastPage = pagerEl.querySelectorAll(".pg-num").length - 1;
    var curPage = 0;
    var showPage = function (p) {
      curPage = Math.max(0, Math.min(lastPage, p));
      newsCards.forEach(function (c) {
        var on = +c.dataset.page === curPage;
        c.classList.toggle("extra", !on);
        if (on) c.classList.add("in");
        if (!on && c.classList.contains("open")) { // 다른 쪽으로 가면 펼친 공지는 접기
          c.classList.remove("open");
          var b = c.querySelector(".news-more");
          if (b) { b.setAttribute("aria-expanded", "false"); b.textContent = "내용 펼치기"; }
        }
      });
      pagerEl.querySelectorAll(".pg-num").forEach(function (b) {
        var on = +b.dataset.pg === curPage;
        b.classList.toggle("on", on);
        if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
      });
      pagerEl.querySelector(".pg-prev").disabled = curPage === 0;
      pagerEl.querySelector(".pg-next").disabled = curPage === lastPage;
      var now = document.querySelector(".pg-now");
      if (now) now.textContent = curPage + 1;
    };
    pagerEl.addEventListener("click", function (e) {
      var b = e.target.closest("[data-pg]");
      if (!b || b.disabled) return;
      var v = b.dataset.pg;
      showPage(v === "prev" ? curPage - 1 : v === "next" ? curPage + 1 : +v);
    });
  }

  /* ---------- 모바일 메뉴 ---------- */
  var toggle = document.querySelector(".menu-toggle");
  function setMenu(open) {
    nav.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
  }
  toggle.addEventListener("click", function () { setMenu(!nav.classList.contains("open")); });
  nav.addEventListener("click", function (e) { if (e.target.closest("a")) setMenu(false); });
  document.addEventListener("click", function (e) {
    if (nav.classList.contains("open") && !e.target.closest(".header")) setMenu(false);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });

  /* ---------- 헤더 그림자 · 맨 위로 버튼 · 현재 메뉴 표시 ---------- */
  var header = document.querySelector(".header");
  var toTop = document.querySelector(".to-top");
  var links = Array.prototype.slice.call(nav.querySelectorAll("a"));
  var targets = links.map(function (a) { return document.getElementById(a.dataset.id); }).filter(Boolean);

  function pageTop(el) { return el.getBoundingClientRect().top + window.scrollY; }
  function onScroll() {
    var y = window.scrollY;
    header.classList.toggle("scrolled", y > 8);
    toTop.classList.toggle("show", y > 500);

    var current = "";
    var line = y + header.offsetHeight + window.innerHeight * 0.3;
    targets.forEach(function (s) { if (pageTop(s) <= line) current = s.id; });
    if (window.innerHeight + y >= document.documentElement.scrollHeight - 4 && targets.length) {
      current = targets[targets.length - 1].id; // 페이지 끝에서는 마지막 메뉴
    }
    links.forEach(function (a) { a.classList.toggle("active", a.dataset.id === current); });
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  toTop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });

  /* ---------- 장점 슬라이드 ---------- */
  document.querySelectorAll(".slider").forEach(function (slider) {
    var track = slider.querySelector(".slider-track");
    var slides = track.querySelectorAll(".slide");
    var dots = slider.querySelectorAll(".dot");
    var prev = slider.querySelector(".prev");
    var next = slider.querySelector(".next");

    function step() {
      var gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return slides[0] ? slides[0].offsetWidth + gap : track.clientWidth;
    }
    function index() { return Math.round(track.scrollLeft / step()); }
    function goTo(i) {
      var max = slides.length - 1;
      track.scrollTo({ left: Math.max(0, Math.min(max, i)) * step(), behavior: "smooth" });
    }
    function update() {
      var i = index();
      var atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
      if (atEnd) i = slides.length - 1;
      dots.forEach(function (d, k) {
        d.classList.toggle("active", k === i);
        d.setAttribute("aria-current", k === i ? "true" : "false");
      });
      var cnt = slider.querySelector(".band-count b");
      if (cnt) cnt.textContent = i + 1;
      prev.disabled = track.scrollLeft <= 4;
      next.disabled = atEnd;
    }

    prev.addEventListener("click", function () { goTo(index() - 1); });
    next.addEventListener("click", function () { goTo(index() + 1); });
    dots.forEach(function (d, k) { d.addEventListener("click", function () { goTo(k); }); });
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { e.preventDefault(); goTo(index() - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); goTo(index() + 1); }
    });
    var t;
    track.addEventListener("scroll", function () { clearTimeout(t); t = setTimeout(update, 60); }, { passive: true });
    window.addEventListener("resize", update);
    update();
  });

  /* ---------- 공지 카드 펼치기 ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest(".news-more");
    if (!b) return;
    var card = b.closest(".news-card");
    var open = !card.classList.contains("open");
    card.classList.toggle("open", open);
    b.setAttribute("aria-expanded", open ? "true" : "false");
    b.textContent = open ? "접기" : "내용 펼치기";
  });

  /* ---------- 숫자 올라가는 효과 ---------- */
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function countUp(el) {
    var to = parseInt(el.dataset.to, 10);
    if (isNaN(to) || reduce) return;
    var start = null, dur = 1200;
    function tick(ts) {
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    }
    el.textContent = "0";
    requestAnimationFrame(tick);
  }

  /* ---------- 스크롤 등장 효과 ---------- */
  var reveals = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add("in");
        en.target.querySelectorAll(".count").forEach(countUp);
        io.unobserve(en.target);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    reveals.forEach(function (el) { io.observe(el); });
  } else {
    reveals.forEach(function (el) { el.classList.add("in"); });
  }

  /* ---------- 꽃잎 ---------- */
  if (!reduce) {
    var box = document.querySelector(".petals");
    var count = window.innerWidth < 640 ? 8 : 16;
    for (var i = 0; i < count; i++) {
      var p = document.createElement("span");
      p.className = "petal";
      var size = 8 + Math.random() * 10;
      p.style.left = Math.random() * 100 + "%";
      p.style.width = size + "px";
      p.style.height = size * 0.8 + "px";
      p.style.animationDuration = 10 + Math.random() * 12 + "s";
      p.style.animationDelay = -Math.random() * 20 + "s";
      p.style.opacity = (0.35 + Math.random() * 0.45).toFixed(2);
      p.style.setProperty("--drift", (Math.random() * 160 - 60).toFixed(0) + "px");
      box.appendChild(p);
    }
  }
})();

/* ######################################################## welcome */
/* ==========================================================
   첫 방문 환영 효과 · 수강 신청 안내 팝업
   설정은 설정(SITE_CONFIG)의 welcome / popup 에서 고칩니다.
   ========================================================== */
(function () {
  "use strict";

  var C = window.SITE_CONFIG || {};
  var store = window.SiteStore || { get: function (k, d) { return d; }, set: function () {} };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  // 팝업 '오늘 하루 보지 않기'는 실제 날짜 기준
  function realDayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  /* ---------- 폭죽 ---------- */
  var COLORS = ["#9fd07b", "#3f9d2a", "#c4e2ad", "#4fb08f", "#1f7a5c", "#f7d26b", "#f48fb1", "#ffffff"];

  function burst(power) {
    if (reduce) return;
    power = power || 1;
    var cv = document.createElement("canvas");
    cv.className = "confetti";
    cv.setAttribute("aria-hidden", "true");
    document.body.appendChild(cv);
    var ctx = cv.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.scale(dpr, dpr);

    var parts = [];
    var count = Math.round((W < 640 ? 90 : 160) * power);
    // 양쪽 아래에서 위로 쏘아 올리기 + 가운데 위에서 한 번
    function shoot(x, y, angle, spread, n, speed) {
      for (var i = 0; i < n; i++) {
        var a = angle + (Math.random() - 0.5) * spread;
        var v = speed * (0.55 + Math.random() * 0.6);
        parts.push({
          x: x, y: y,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          size: 5 + Math.random() * 7,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          shape: Math.random() < 0.35 ? "petal" : Math.random() < 0.5 ? "circle" : "rect",
          life: 0
        });
      }
    }
    var sp = Math.min(W, H) * 0.028 + 9;
    shoot(0, H * 0.85, -Math.PI / 3, 0.7, count * 0.4, sp);
    shoot(W, H * 0.85, -Math.PI * 2 / 3, 0.7, count * 0.4, sp);
    shoot(W / 2, H * 0.35, -Math.PI / 2, Math.PI * 1.6, count * 0.2, sp * 0.6);

    var start = performance.now();
    function frame(t) {
      var el = t - start;
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.vy += 0.28;
        p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy;
        p.rot += p.vr;
        var alpha = el > 2600 ? Math.max(0, 1 - (el - 2600) / 900) : 1;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.shape === "circle") { ctx.beginPath(); ctx.arc(0, 0, p.size / 2.4, 0, Math.PI * 2); ctx.fill(); }
        else if (p.shape === "petal") {
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 0.7, p.size * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
        } else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      });
      if (el < 3500) requestAnimationFrame(frame);
      else cv.remove();
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 안내 팝업 ---------- */
  var lastFocus = null;

  function openPopup() {
    var p = C.popup;
    if (!p || !p.enabled || document.querySelector(".modal-backdrop")) return;
    lastFocus = document.activeElement;
    var wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">' +
        '<button type="button" class="modal-x" aria-label="닫기">×</button>' +
        '<div class="modal-deco" aria-hidden="true">🌸</div>' +
        (p.badge ? '<span class="eyebrow">' + esc(p.badge) + "</span>" : "") +
        '<h2 id="modal-title">' + esc(p.title) + "</h2>" +
        '<ul class="modal-lines">' + (p.lines || []).map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>" +
        '<a class="btn btn-primary modal-go" href="#' + esc(p.target || "apply") + '">' + esc(p.button || "자세히 보기") + "</a>" +
        '<div class="modal-foot">' +
          '<label class="check small"><input type="checkbox" class="modal-today"><span>오늘 하루 보지 않기</span></label>' +
          '<button type="button" class="link-btn modal-close">닫기</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(wrap);
    document.body.classList.add("modal-open");
    requestAnimationFrame(function () { wrap.classList.add("show"); });
    var modal = wrap.querySelector(".modal");
    modal.focus();

    function close() {
      if (wrap.querySelector(".modal-today").checked) store.set("popup:hideDay", realDayKey());
      wrap.classList.remove("show");
      document.body.classList.remove("modal-open");
      document.removeEventListener("keydown", onKey);
      setTimeout(function () { wrap.remove(); }, 250);
      if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    }
    function onKey(e) {
      if (e.key === "Escape") close();
      if (e.key === "Tab") {
        // 포커스가 팝업 밖으로 나가지 않게
        var f = modal.querySelectorAll("button, a, input");
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === first || document.activeElement === modal)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener("keydown", onKey);
    wrap.addEventListener("click", function (e) {
      if (e.target === wrap || e.target.closest(".modal-x, .modal-close")) close();
      if (e.target.closest(".modal-go")) { lastFocus = null; close(); }
    });
  }

  /* ---------- 시작 ---------- */
  function init() {
    var first = !store.get("visited", false);
    store.set("visited", true);
    var w = C.welcome || {};
    if (first) {
      if (w.confetti !== false) setTimeout(function () { burst(1); }, 400);
      if (w.message && window.showToast) setTimeout(function () { window.showToast(w.message, "ok"); }, 600);
    }
    var p = C.popup;
    var admin = false;
    try { admin = sessionStorage.getItem("kcn:admin") === "1"; } catch (e) { /* 무시 */ }
    if (p && p.enabled && !admin && store.get("popup:hideDay", "") !== realDayKey()) {
      setTimeout(openPopup, (p.delaySec != null ? p.delaySec : 2.5) * 1000);
    }
  }

  window.Welcome = { burst: burst, openPopup: openPopup };
  init();
})();

/* ######################################################## admin */
/* ==========================================================
   관리자 화면

          '\n\n답은 아래 JSON 형식으로만 주세요 (2개):\n{"images":[{"caption":"한국어 설명","svg":"<svg xmlns=\\"http://www.w3.org/2000/svg\\" viewBox=\\"0 0 1280 720\\">…</svg>"}]}';
      },
      onePrompt: function (n, k, avoid) {

          (avoid.length ? "- 이미 그린 장면과 겹치지 않게 다른 장소·상황으로: " + avoid.join(" / ") + "\n" : "") + SVG_RULES + COMMON;
      },
      run: async function (n) {
        var out = [];
        for (var k = 0; k < 2; k++) {
          setMsg("🖼️ 그림 " + (k + 1) + "/2 그리는 중… (그림마다 30초~1분)");

      },
      status: function (n) { var s = ai(n).images; return s && s.length ? s.length + "장" : ""; }

    live: {
      icon: "⚡", label: "실시간 퀴즈", desc: "⚡ 실시간 퀴즈에 「" + "n주차" + "」 세트로 추가 (4지선다 8문제)",
      schema: obj({ questions: { type: "array", items: obj({ q: STR, choices: STRS, answer: { type: "integer" }, explanation: STR }) } }),
      prompt: function (n) {
        return context(n) + "\n\n이 주차 내용으로 Kahoot식 실시간 4지선다 퀴즈 8문제를 만들어 주세요.\n" +
          "- 학생이 휴대폰으로 빠르게 읽을 수 있게 문제는 60자, 선택지는 25자 이내.\n" +

          "- 정답이 둘이거나 애매한 문제는 만들지 않고, explanation에 정답 이유를 한 문장으로 씁니다.\n- 한국어로 씁니다." + COMMON +
          '\n\n답은 아래 JSON 형식으로만 주세요:\n{"questions":[{"q":"문제","choices":["1","2","3","4"],"answer":0,"explanation":"해설"}]}';

        }).map(function (x) {
          return { q: String(x.q).trim(), choices: x.choices.map(function (c) { return String(c).trim(); }), answer: Math.floor(x.answer), time: t, explanation: String(x.explanation || "").trim() };
        });
        if (!qs.length) throw new Error("쓸 수 있는 문제를 받지 못했습니다.");
        C.quiz = C.quiz || {};
        C.quiz.sets = (C.quiz.sets || []).filter(function (s) { return s.id !== "w" + n; });
        C.quiz.sets.push({ id: "w" + n, title: n + "주차: " + wk(n).title, questions: qs });

    practice: {
      icon: "✅", label: "온라인 퀴즈", desc: "객관식 · OX · 빈칸(중국어 2글자) · 순서 맞추기, 각 3문제",

      prompt: function (n) {
        return context(n) + "\n\n이 주차 복습용 온라인 퀴즈 12문제를 만들어 주세요. 유형마다 3문제씩입니다.\n" +
          "- type \"mc\" (객관식): choices에 선택지 4개, answer는 정답 선택지의 글자 그대로. tokens는 [].\n" +
          "- type \"ox\": q는 참/거짓을 가릴 문장, answer는 \"O\" 또는 \"X\". choices·tokens는 [].\n" +
          "- type \"blank\" (빈칸): q는 중국어 문장에서 단어 하나를 ____ 로 비우고 뒤에 괄호로 한국어 뜻을 붙임. 예: \"我____王明。(제 이름은 왕밍입니다.)\". answer는 빈칸에 들어갈 중국어 정확히 2글자. choices·tokens는 [].\n" +
          "- type \"order\" (순서 맞추기): q는 \"다음 뜻이 되도록 순서대로 고르세요: (한국어 뜻)\", tokens는 바른 순서의 중국어 단어 조각 3~6개, answer는 완성 문장. choices는 [].\n" +

          '\n\n답은 아래 JSON 형식으로만 주세요:\n{"questions":[{"type":"mc","q":"문제","choices":["가","나","다","라"],"answer":"가","tokens":[],"explanation":"해설"}]}';
      },
      apply: function (n, d) {
        var ok = [];
        ((d && d.questions) || []).forEach(function (x) {
          if (!x || !String(x.q || "").trim()) return;
          var q = { type: x.type, q: String(x.q).trim(), explanation: String(x.explanation || "").trim() };
          var a = String(x.answer == null ? "" : x.answer).trim();
          if (x.type === "mc") {
            var ch = (x.choices || []).map(function (c) { return String(c).trim(); }).filter(Boolean);
            if (ch.length < 2 || ch.indexOf(a) < 0) return;
            q.choices = ch; q.answer = a;

            a = /^(o|true|참|맞|○|⭕)/i.test(a) ? "O" : /^(x|false|거짓|틀|×|❌)/i.test(a) ? "X" : "";

            q.answer = a;

            if (tk.length < 2) return;
            q.tokens = tk; q.answer = tk.join("");
          } else return;
          ok.push(q);

    setMsg(G.icon + " " + G.label + " 만드는 중… (보통 20초~1분)");
    try {
      var msg = G.run ? await G.run(n) : G.apply(n, await callClaude(G.prompt(n), G.schema, G.maxTokens, n));
      persist();
      renderExtra(n);
      M.busy = ""; M.msg = "✅ " + msg;
      if (M.el) drawPanel();
      return true;
    } catch (e) {
      M.busy = ""; M.msg = "⚠️ " + G.label + ": " + errMsg(e);
      if (M.el) drawPanel();
      return !e.noKey && null;
    }
  }
  async function runAll() {
    var done = [], fail = [];
    for (var i = 0; i < ORDER.length; i++) {
      if (!M.el) return;
      var r = await runGen(ORDER[i]);
      if (r) done.push(GEN[ORDER[i]].label);
      else { fail.push(GEN[ORDER[i]].label); if (r === false) break; } // 키가 없으면 멈춤
    }
    setMsg((done.length ? "✅ 완료: " + done.join(", ") : "") + (fail.length ? (done.length ? " / " : "") + "⚠️ 실패: " + fail.join(", ") + " — 그 항목만 다시 눌러 보세요." : ""));
  }
  // 그림 한 장만 다시 그리기
  async function redraw(k) {
    var n = M.n, imgs = ai(n).images || [];
    M.busy = "images"; drawPanel();
    setMsg("🎨 그림 " + (k + 1) + " 다시 그리는 중… (30초~1분)");
    try {
      var others = imgs.filter(function (x, j) { return j !== k; }).map(function (x) { return x.caption; });
      var d = await callClaude(GEN.images.onePrompt(n, k, others), GEN.images.oneSchema, 16000, n);
      var svg = cleanSvg(d.svg);
      if (!svg) throw new Error("그림(SVG)을 받지 못했습니다.");
      imgs[k] = { caption: String(d.caption || "").trim(), svg: svg, url: "" };
      persist(); renderExtra(n);
      M.msg = "✅ 그림 " + (k + 1) + "을 다시 그렸습니다.";
    } catch (e) { M.msg = "⚠️ 그림: " + errMsg(e); }
    M.busy = "";
    if (M.el) drawPanel();
  }

  function saveLinks() {
    var n = M.n, a = ai(n), err = $(".wa-yt-err", M.el), bad = [];
    ["videos", "songs"].forEach(function (kind) {
      a[kind] = [0, 1].map(function (i) {
        var u = $('[data-yt="' + kind + '"][data-k="' + i + '"]', M.el).value.trim();
        var t = $('[data-yt-title="' + kind + '"][data-k="' + i + '"]', M.el).value.trim();
        if (u && !ytId(u)) bad.push((kind === "videos" ? "영상 " : "노래 ") + (i + 1));
        return { url: u, title: t };
      }).filter(function (v) { return v.url || v.title; });
    });
    if (bad.length) { err.textContent = bad.join(", ") + ": 유튜브 주소를 알아볼 수 없습니다. (youtube.com/watch?v=… 또는 youtu.be/… 형식)"; return; }
    $$("[data-img-url]", M.el).forEach(function (inp) {
      var im = (a.images || [])[+inp.dataset.imgUrl];
      if (im) im.url = /^https?:\/\//.test(inp.value.trim()) ? inp.value.trim() : "";
    });
    err.textContent = "";
    persist();
    renderExtra(n);
    M.msg = "✅ 영상·노래·그림 주소를 저장했습니다.";
    drawPanel();
  }
  function onPanelClick(e) {
    if (e.target === M.el && !M.busy) { closePanel(); return; }
    var b = e.target.closest("[data-wa]");
    if (!b || b.disabled) return;
    var act = b.dataset.wa, g = b.dataset.g;
    if (act === "close") closePanel();
    else if (act === "savekey") {
      var k = $("#wa-key", M.el).value.trim();
      if (!k) { $("#wa-key", M.el).focus(); return; }
      if (window.ApiKeys) window.ApiKeys.set("anthropic", k, { remember: true });
      M.msg = "API 키를 저장했습니다."; drawPanel();
    }
    else if (act === "gen") {
      var st = GEN[g].status(M.n);
      if (st && !window.confirm("이미 만든 " + GEN[g].label + "(" + st + ")이 있습니다. 새로 만들어 바꿀까요?")) return;
      runGen(g);
    }
    else if (act === "all") {
      if (ORDER.some(function (x) { return GEN[x].status(M.n); }) && !window.confirm("이미 만든 항목은 새 내용으로 바뀝니다. 계속할까요?")) return;
      runAll();
    }
    else if (act === "copy") {
      var text = refsBlock(M.n) + GEN[g].prompt(M.n);
      M.pasteType = g;
      var sel = $("#wa-ptype", M.el); if (sel) sel.value = g;
      $(".wa-paste", M.el).open = true;
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () {
        setMsg("📋 「" + GEN[g].label + "」 요청문을 복사했습니다. AI 채팅에 붙여넣고, 받은 답을 아래 칸에 넣어 주세요.");
      }, function () {
        $("#wa-paste", M.el).value = text;
        setMsg("자동 복사가 막혀 아래 칸에 요청문을 넣었습니다. 직접 복사해 쓰세요.");
      });
    }
    else if (act === "paste") {
      var type = $("#wa-ptype", M.el).value;
      M.pasteType = type;
      try {
        var msg = GEN[type].apply(M.n, parseLoose($("#wa-paste", M.el).value));
        persist(); renderExtra(M.n);
        M.msg = "✅ " + msg; drawPanel();
      } catch (err) {
        setMsg("⚠️ 붙여넣은 내용을 읽지 못했습니다. AI 답의 { 부터 } 까지 전부 넣었는지, 항목을 맞게 골랐는지 확인해 주세요." + (err && err.message && !(err instanceof SyntaxError) ? " (" + err.message + ")" : ""));
      }
    }
    else if (act === "reroll") redraw(+b.dataset.k);
    else if (act === "saveyt") saveLinks();
    else if (act === "refdel") {
      var arr = refsOf(b.dataset.scope), r = arr[+b.dataset.k];
      if (!r || !window.confirm("「" + r.name + "」 자료를 지울까요?")) return;
      arr.splice(+b.dataset.k, 1);
      try { saveRefs(b.dataset.scope, arr); } catch (err) { /* 지우기는 실패하지 않음 */ }
      M.msg = "🗑️ " + r.name + " 자료를 지웠습니다."; drawPanel();
    }
    else if (act === "refview") {
      var rv = refsOf(b.dataset.scope)[+b.dataset.k], pre = $(".wa-refpre", M.el);
      if (!rv) return;
      var same = !pre.hidden && pre.dataset.key === b.dataset.scope + b.dataset.k;
      pre.hidden = same;
      pre.dataset.key = b.dataset.scope + b.dataset.k;
      pre.textContent = "[" + rv.name + "] 앞부분 미리보기\n\n" + rv.text.slice(0, 3000) + (rv.text.length > 3000 ? "\n…" : "");
    }
  }

  /* ==========================================================
     연결
     ========================================================== */
  function refresh() {
    document.body.classList.toggle("is-admin", isAdmin());
  }
  function init() {
    refresh();
    $$(".wk-extra[data-wk]").forEach(function (b) { renderExtra(+b.dataset.wk); });
    var sec = document.getElementById("curriculum") || document.body;

    sec.addEventListener("click", function (e) {
      var t = e.target;
      var op = t.closest("[data-wa-open]");
      if (op) { openPanel(+op.dataset.waOpen); return; }
      var box = t.closest(".wk-extra");
      if (!box) return;
      var n = +box.dataset.wk, v = VIEW[n];
      var tb = t.closest("[data-wk-tab]");
      if (tb) { stopAll(); v.tab = tb.dataset.wkTab; renderExtra(n); $('[data-wk-tab="' + v.tab + '"]', box).focus(); return; }
      var f = t.closest("[data-ws-filter]");
      if (f) { stopAll(); v.filter = f.dataset.wsFilter; renderExtra(n); $('[data-ws-filter="' + v.filter + '"]', box).focus(); return; }
      var s = t.closest("[data-say]");
      if (s) { stopAll(); var li = s.closest(".ws-item"); li.classList.add("speaking"); say(ai(n).sentences[+s.dataset.say].zh, function () { li.classList.remove("speaking"); }); return; }
      if (t.closest("[data-ws-all]")) { if (TTS.playing === n) stopAll(); else playAll(n); return; }
      var cs = t.closest("[data-cs]");
      if (cs) {
        var c = cs.closest(".cs"), i = +(c.dataset.i || 0);
        if (cs.dataset.cs === "prev") slideGo(n, i - 1);
        else if (cs.dataset.cs === "next") slideGo(n, i + 1);
        else setPaused(n, !c.classList.contains("paused"));
        return;
      }
      var go = t.closest("[data-cs-go]");
      if (go) { slideGo(n, +go.dataset.csGo); return; }
      var ns = t.closest("[data-note-say]");
      if (ns) { var ij = ns.dataset.noteSay.split("-"); say(ai(n).notes.sections[+ij[0]].examples[+ij[1]].zh); return; }
      if (t.closest("[data-note-print]")) { printNote(n); return; }
      var csay = t.closest("[data-cs-say]");
      if (csay) { say(ai(n).culture[+csay.dataset.csSay].zh); return; }
      // 순서 맞추기
      var tok = t.closest(".pq-tok");
      if (tok) {
        var q = tok.closest(".pq"), built = $(".pq-built", q), pool = $(".pq-tokens", q);
        var ph = $(".pq-ph", built);
        if (tok.parentNode === built) pool.insertBefore(tok, $(".pq-reset", pool));
        else { if (ph) ph.remove(); built.appendChild(tok); }
        if (!$(".pq-tok", built) && !$(".pq-ph", built)) built.innerHTML = '<span class="pq-ph">아래 조각을 순서대로 누르세요</span>';
        return;
      }
      var rs = t.closest(".pq-reset");
      if (rs) {
        var q2 = rs.closest(".pq"), b2 = $(".pq-built", q2), p2 = $(".pq-tokens", q2);
        $$(".pq-tok", b2).forEach(function (x) { p2.insertBefore(x, rs); });
        b2.innerHTML = '<span class="pq-ph">아래 조각을 순서대로 누르세요</span>';
        return;
      }
      if (t.closest(".pq-retry")) { renderExtra(n); var fm = $(".pq-form", box); if (fm) fm.scrollIntoView({ block: "nearest" }); }
    });
    sec.addEventListener("change", function (e) {
      var box = e.target.closest(".wk-extra");
      if (!box) return;
      var n = +box.dataset.wk, v = VIEW[n];
      if (e.target.dataset.wsOpt) {
        v[e.target.dataset.wsOpt] = e.target.checked;
        $(".ws-list", box).classList.toggle("no-" + e.target.dataset.wsOpt, !e.target.checked);
      }
      if (e.target.hasAttribute("data-ws-rate")) TTS.rate = +e.target.value;
    });
    sec.addEventListener("submit", function (e) {
      if (!e.target.classList.contains("pq-form")) return;
      e.preventDefault();
      grade(e.target);
    });
    sec.addEventListener("keydown", function (e) {
      var tb = e.target.closest("[data-wk-tab]");
      if (tb && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
        var all = $$("[data-wk-tab]", tb.parentNode), k = all.indexOf(tb);
        all[(k + (e.key === "ArrowRight" ? 1 : all.length - 1)) % all.length].click();
        e.preventDefault();
        return;
      }
      var cs = e.target.closest(".cs");
      if (cs && e.target === cs && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
        slideGo(+cs.dataset.wk, +(cs.dataset.i || 0) + (e.key === "ArrowRight" ? 1 : -1));
        e.preventDefault();
      }
    });
    // 마우스를 올리거나 초점이 있으면 슬라이드 멈춤
    sec.addEventListener("mouseover", function (e) { var cs = e.target.closest(".cs"); if (cs && TIMERS[+cs.dataset.wk]) clearTimeout(TIMERS[+cs.dataset.wk].t); });
    sec.addEventListener("mouseout", function (e) {
      var cs = e.target.closest(".cs");
      if (cs && !cs.contains(e.relatedTarget) && TIMERS[+cs.dataset.wk] && !cs.classList.contains("paused")) schedule(+cs.dataset.wk);
    });
    // 그림 불러오기 표시
    document.addEventListener("load", function (e) { if (e.target.hasAttribute && e.target.hasAttribute("data-wi")) e.target.closest(".wi-frame").classList.add("loaded"); }, true);
    document.addEventListener("error", function (e) {
      if (e.target.hasAttribute && e.target.hasAttribute("data-wi")) {
        var fr = e.target.closest(".wi-frame");
        fr.classList.add("failed");
        $(".wi-wait", fr).textContent = "그림을 불러오지 못했습니다";
      }
    }, true);
    // 주차를 닫으면 읽기 멈춤
    sec.addEventListener("toggle", function (e) { if (e.target.classList && e.target.classList.contains("week") && !e.target.open) stopAll(); }, true);

    // AI 생성 뒤 새로 고침했으면 그 주차를 다시 엶
    var re = null;
    try { re = sessionStorage.getItem("kcn:wa:reopen"); sessionStorage.removeItem("kcn:wa:reopen"); } catch (e) { /* 무시 */ }
    if (re && isAdmin()) {
      var el = document.getElementById("week-" + re);
      if (el) { el.open = true; setTimeout(function () { el.scrollIntoView({ block: "start" }); openPanel(+re); }, 150); }
    }
  }

  window.WeekAI = { refresh: refresh, open: openPanel, ytId: ytId };
  init();
})();
</script>
</body>
</html>
