<!-- ============================================================
     ② 디자인 (색상은 맨 위 :root 값으로 바꿀 수 있습니다)
     ============================================================ -->
<style>
/* ==========================================================
   교양중국어 — 초록 테마 (공공기관형)
   색은 아래 :root 변수만 바꾸면 사이트 전체에 반영됩니다.
   (변수 이름의 pink = 주 색상(초록), lav = 보조 색상(청록) 입니다)
   ========================================================== */
:root {
  --pink-50:  #f2f8ed;
  --pink-100: #e1f0d6;
  --pink-200: #c4e2ad;
  --pink-300: #9fd07b;
  --pink-500: #3f9d2a;
  --pink-600: #2f7f1e;
  --lav-50:   #eef7f3;
  --lav-100:  #dcefe7;
  --lav-200:  #b9dfd1;
  --lav-400:  #4fb08f;
  --lav-600:  #1f7a5c;
  --plum-900: #1f2620;
  --plum-700: #46504a;
  --plum-500: #727a74;
  --highlight: #e4503f; /* 큰 제목 강조 글씨 */

  --bg: #f6f7f3;
  --card: #ffffff;
  --card-border: #e6eae3;
  --line: #e5e9e2;
  --text: var(--plum-900);
  --muted: var(--plum-500);
  --accent: var(--pink-500);
  --accent-2: var(--lav-600);
  --grad: linear-gradient(135deg, var(--pink-500), var(--lav-400));
  --band: linear-gradient(100deg, #cfe8b4 0%, #93cc6d 45%, #4ea836 100%);
  --beige: #f5eee3;

  --radius: 22px;
  --radius-sm: 14px;
  --shadow: 0 8px 28px -16px rgba(22, 35, 24, 0.22);
  --shadow-hover: 0 16px 36px -16px rgba(22, 35, 24, 0.3);
  --header-h: 76px;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 12px);
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

body {
  margin: 0;
  font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color: var(--text);
  background: var(--bg);
  background-color: var(--pink-50);
  line-height: 1.7;
  word-break: keep-all;
  overflow-x: hidden;
}

img { max-width: 100%; display: block; }
a { color: inherit; }
.zh { font-family: "Noto Serif SC", serif; }

.container {
  width: 100%;
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ---------- 헤더 ---------- */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  height: var(--header-h);
  background: rgba(245, 250, 240, 0.72);
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: box-shadow .25s, border-color .25s, background .25s;
}
.header.scrolled {
  background: rgba(250, 253, 248, 0.9);
  border-bottom-color: var(--card-border);
  box-shadow: 0 6px 20px -14px rgba(40, 70, 40, 0.4);
}
.header-inner {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  min-width: 0;
}
.logo-mark {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  font-size: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100));
  flex-shrink: 0;
}
.logo-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.logo-text strong { font-size: 1.05rem; font-weight: 800; }
.logo-text small { font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.nav { display: flex; gap: 4px; }
.nav a {
  text-decoration: none;
  font-size: .95rem;
  font-weight: 500;
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--plum-700);
  transition: background .2s, color .2s;
}
.nav a:hover { background: var(--pink-100); color: var(--pink-600); }
.nav a.active { background: var(--grad); color: #fff; }

.menu-toggle {
  display: none;
  width: 44px; height: 44px;
  border: 0;
  border-radius: 12px;
  background: var(--pink-100);
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
}
.menu-toggle span {
  position: absolute; left: 12px; right: 12px;
  height: 2px; border-radius: 2px;
  background: var(--pink-600);
  transition: transform .25s, opacity .2s;
}
.menu-toggle span:nth-child(1) { top: 15px; }
.menu-toggle span:nth-child(2) { top: 21px; }
.menu-toggle span:nth-child(3) { top: 27px; }
.menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

/* ---------- 공통 섹션 ---------- */
section { padding: 88px 0; position: relative; }
.section-head { text-align: center; max-width: 680px; margin: 0 auto 44px; }
.eyebrow {
  display: inline-block;
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--pink-100);
  padding: 4px 14px;
  border-radius: 999px;
  margin-bottom: 14px;
}
.section-head h2 {
  font-size: clamp(1.6rem, 4vw, 2.2rem);
  font-weight: 800;
  margin: 0 0 12px;
  line-height: 1.3;
}
.section-head p { color: var(--muted); margin: 0; }

.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
  transition: transform .25s, box-shadow .25s;
}
.card.lift:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

.grid { display: grid; gap: 20px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }

/* 스크롤 시 부드럽게 나타나기 */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
.reveal.in { opacity: 1; transform: none; }

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px;
  padding: 13px 26px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 1rem;
  text-decoration: none;
  transition: transform .2s, box-shadow .2s, background .2s;
}
.btn-primary { background: var(--grad); color: #fff; box-shadow: 0 10px 24px -10px rgba(63, 157, 42, .7); }
.btn-primary:hover { transform: translateY(-2px); }
.btn-ghost { background: #fff; color: var(--pink-600); border: 1.5px solid var(--pink-200); }
.btn-ghost:hover { background: var(--pink-50); }

/* ---------- 히어로 ---------- */
.hero { padding: 72px 0 96px; overflow: hidden; }
.hero::before, .hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  z-index: -1;
}
.hero::before { width: 420px; height: 420px; background: var(--pink-200); top: -80px; right: -60px; opacity: .55; }
.hero::after  { width: 360px; height: 360px; background: var(--lav-200);  bottom: -60px; left: -80px; opacity: .55; }

.hero-main { text-align: center; max-width: 820px; margin: 0 auto; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .85rem; font-weight: 600;
  color: var(--lav-600);
  background: #fff;
  border: 1px solid var(--lav-200);
  padding: 6px 14px;
  border-radius: 999px;
  margin-bottom: 20px;
}
.hero-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pink-500); }
.hero h1 {
  font-size: clamp(2.6rem, 9vw, 4.6rem);
  line-height: 1.15;
  font-weight: 800;
  margin: 0 0 10px;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0 18px;
}
.grad-text {
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.hero-zh { font-size: .48em; color: var(--lav-400); font-weight: 600; }
.hero-sub {
  font-size: clamp(1.15rem, 3vw, 1.55rem);
  font-weight: 700;
  color: var(--plum-700);
  margin: 0 0 18px;
}
.hero-desc { color: var(--plum-700); font-size: 1.06rem; margin: 0 auto 32px; max-width: 640px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.hero-actions .btn { min-width: 170px; padding: 15px 30px; font-size: 1.05rem; }

/* 첫 화면 요약 정보 */
.quick-info {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin: 56px 0 0;
}
.qi { display: flex; gap: 14px; align-items: center; padding: 18px 20px; border-radius: var(--radius-sm); }
.qi-icon {
  width: 46px; height: 46px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 22px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100));
}
.qi dt { font-size: .8rem; font-weight: 700; color: var(--accent); }
.qi dd { margin: 0; font-weight: 600; font-size: .95rem; line-height: 1.45; }

/* ---------- 통계 카드 ---------- */
.stats-section { padding: 0 0 24px; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.stat-card { text-align: center; padding: 30px 16px; }
.stat-card strong {
  display: block;
  font-size: clamp(2.4rem, 6vw, 3.2rem);
  font-weight: 800;
  line-height: 1.1;
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  font-variant-numeric: tabular-nums;
}
.stat-card strong small { font-size: .45em; margin-left: 2px; }
.stat-card > span { display: block; margin-top: 6px; color: var(--muted); font-weight: 500; }

/* ---------- 장점 슬라이드 ---------- */
.slider { position: relative; padding: 0 64px; }
.slider-track {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: calc((100% - 40px) / 3);
  column-gap: 20px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  padding: 8px 4px 24px;
  scrollbar-width: none;
}
.slider-track::-webkit-scrollbar { display: none; }
.slider-track:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 4px; border-radius: var(--radius); }
.slide { scroll-snap-align: start; position: relative; min-height: 240px; }
.slide h3 { font-size: 1.15rem; margin: 0 0 8px; }
.slide p { margin: 0; color: var(--muted); }
.slide-num { position: absolute; right: 22px; top: 18px; font-weight: 800; color: var(--pink-200); font-size: 1.4rem; }
.slider-btn {
  position: absolute; top: calc(50% - 30px);
  width: 48px; height: 48px;
  border: 1.5px solid var(--pink-200);
  border-radius: 50%;
  background: #fff;
  color: var(--pink-600);
  display: grid; place-items: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: background .2s, opacity .2s;
}
.slider-btn:hover:not(:disabled) { background: var(--pink-50); }
.slider-btn:disabled { opacity: .35; cursor: default; }
.slider-btn:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.slider-btn.prev { left: 0; }
.slider-btn.next { right: 0; }
.slider-dots { display: flex; justify-content: center; gap: 8px; }
.dot {
  width: 10px; height: 10px; padding: 0;
  border: 0; border-radius: 999px;
  background: var(--pink-200);
  cursor: pointer;
  transition: width .25s, background .25s;
}
.dot.active { width: 28px; background: var(--grad); }
.dot:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }

/* ---------- AI 도구 ---------- */
section.tint { background: linear-gradient(180deg, rgba(225, 240, 214, 0), rgba(225, 240, 214, .55) 30%, rgba(225, 240, 214, .55) 70%, rgba(225, 240, 214, 0)); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.tool-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
.tool-icon {
  width: 50px; height: 50px;
  display: grid; place-items: center;
  font-size: 24px;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 0 0 1px var(--lav-200);
}
.tool-tag {
  font-size: .78rem; font-weight: 700;
  color: var(--lav-600);
  background: var(--lav-100);
  padding: 4px 12px;
  border-radius: 999px;
  text-align: right;
}
.tool h3 { font-size: 1.08rem; margin: 0 0 6px; }
.tool p { margin: 0; color: var(--muted); font-size: .95rem; }

/* ---------- 수강 준비물 ---------- */
.sub-title { text-align: center; font-size: 1.35rem; margin: 52px 0 20px; }
.prep { text-align: center; padding: 26px 20px; }
.prep-icon { font-size: 2.2rem; display: block; margin-bottom: 8px; }
.prep h4 { margin: 0 0 6px; font-size: 1.05rem; }
.prep p { margin: 0; color: var(--muted); font-size: .92rem; }

/* ---------- 공통 작은 요소 ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.btn-sm { padding: 10px 20px; font-size: .92rem; }
.btn[aria-disabled="true"] {
  background: var(--lav-100); color: var(--plum-500);
  box-shadow: none; cursor: not-allowed; transform: none;
}
.chip {
  border: 1.5px solid var(--pink-200);
  background: #fff;
  color: var(--pink-600);
  font: inherit; font-size: .85rem; font-weight: 600;
  padding: 6px 14px;
  border-radius: 999px;
  cursor: pointer;
}
.chip:hover { background: var(--pink-50); }
.link-btn {
  border: 0; background: none; padding: 0;
  font: inherit; font-weight: 600;
  color: var(--pink-600);
  text-decoration: underline; text-underline-offset: 3px;
  cursor: pointer;
}
.chip:focus-visible, .link-btn:focus-visible, .cal-nav:focus-visible, .cal-cell:focus-visible {
  outline: 3px solid var(--lav-400); outline-offset: 2px;
}
.badge {
  display: inline-block;
  font-size: .74rem; font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.badge-asg  { background: var(--pink-100); color: var(--pink-600); }
.badge-asg.urgent { background: var(--pink-500); color: #fff; }
.badge-asg.closed { background: #eef1ec; color: var(--plum-500); }
.badge-exam { background: var(--lav-100); color: var(--lav-600); }
.badge-now  { background: var(--grad); color: #fff; }
.badge-week { background: var(--grad); color: #fff; }

/* ---------- 주차별 목록 ---------- */
.weeks-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 56px 0 18px; }
.weeks-head .sub-title { margin: 0; }
.weeks-tools { display: flex; gap: 8px; }
.week-list { display: grid; gap: 12px; }
.week { padding: 0; overflow: hidden; }
.week.flash { box-shadow: 0 0 0 3px var(--pink-300), var(--shadow-hover); }
.week summary {
  list-style: none;
  cursor: pointer;
  display: grid;
  grid-template-columns: 64px 1fr auto 20px;
  align-items: center;
  gap: 16px;
  padding: 16px 22px;
}
.week summary::-webkit-details-marker { display: none; }
.week summary:hover { background: var(--pink-50); }
.week summary::after {
  content: "";
  width: 10px; height: 10px;
  border-right: 2px solid var(--pink-500);
  border-bottom: 2px solid var(--pink-500);
  transform: rotate(45deg) translateY(-3px);
  transition: transform .25s;
  justify-self: center;
}
.week[open] summary::after { transform: rotate(-135deg) translateY(-3px); }
.week summary:focus-visible { outline: 3px solid var(--lav-400); outline-offset: -3px; }
.week-no {
  width: 64px; height: 64px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100));
  line-height: 1.1;
}
.week-no strong { font-size: 1.5rem; color: var(--pink-600); }
.week-no small { font-size: .7rem; color: var(--plum-500); font-weight: 600; }
.week.exam .week-no { background: var(--grad); }
.week.exam .week-no strong, .week.exam .week-no small { color: #fff; }
.week.past .week-no { opacity: .65; }
.week-main { display: flex; flex-direction: column; min-width: 0; }
.week-date { font-size: .85rem; color: var(--muted); font-weight: 500; }
.week-title { font-weight: 700; font-size: 1.05rem; }
.week-badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.week-body { padding: 4px 22px 24px; border-top: 1px dashed var(--pink-200); }
.week-meta { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 18px 0; }
.week-meta div { display: flex; gap: 8px; }
.week-meta dt { font-weight: 700; color: var(--lav-600); font-size: .9rem; white-space: nowrap; }
.week-meta dd { margin: 0; font-size: .95rem; }
.week-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.week-cols h4 { margin: 0 0 8px; font-size: .95rem; color: var(--accent); }
.topic-list { margin: 0; padding: 0; list-style: none; }
.topic-list li { position: relative; padding: 4px 0 4px 18px; font-size: .95rem; }
.topic-list li::before {
  content: ""; position: absolute; left: 2px; top: 13px;
  width: 7px; height: 7px; border-radius: 50%; background: var(--pink-300);
}
.video-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.video-list a, .video-list li > .play.muted + * { font-size: .95rem; }
.video-list a {
  display: inline-flex; align-items: center; gap: 10px;
  text-decoration: none; font-weight: 500;
  padding: 8px 14px 8px 8px;
  background: var(--lav-50);
  border-radius: 999px;
  transition: background .2s;
}
.video-list a:hover { background: var(--lav-100); }
.play {
  width: 26px; height: 26px; flex-shrink: 0;
  display: inline-grid; place-items: center;
  border-radius: 50%;
  background: var(--grad); color: #fff;
  font-size: .62rem;
  padding-left: 2px;
}
.play.muted { background: var(--lav-200); }

/* 과제 상자 */
.assignment {
  margin-top: 20px;
  padding: 20px 22px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--pink-50), var(--lav-50));
  border: 1.5px solid var(--pink-200);
}
.assignment.urgent { border-color: var(--pink-500); }
.assignment.closed { border-color: var(--lav-200); }
.asg-head { display: flex; align-items: center; gap: 10px; }
.asg-head h4 { margin: 0; font-size: 1.05rem; }
.asg-label { font-size: .75rem; font-weight: 700; color: #fff; background: var(--pink-500); padding: 2px 10px; border-radius: 999px; }
.assignment.closed .asg-label { background: var(--plum-500); }
.assignment > p { margin: 10px 0 14px; color: var(--plum-700); font-size: .95rem; }
.asg-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.asg-time { display: flex; flex-direction: column; gap: 4px; font-size: .92rem; }
.countdown { display: flex; align-items: center; gap: 8px; color: var(--pink-600); font-weight: 600; }
.assignment.closed .countdown { color: var(--plum-500); }
.dd {
  font-size: .78rem; font-weight: 800;
  padding: 2px 9px; border-radius: 8px;
  background: var(--pink-500); color: #fff;
  font-variant-numeric: tabular-nums;
}
.dd-closed { background: var(--plum-500); }

/* ---------- 달력 ---------- */
.calendar-wrap { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-title { font-size: 1.25rem; font-weight: 800; }
.cal-nav {
  width: 42px; height: 42px;
  border: 1.5px solid var(--pink-200);
  border-radius: 50%;
  background: #fff;
  color: var(--pink-600);
  font-size: 1.5rem; line-height: 1;
  cursor: pointer;
}
.cal-nav:hover { background: var(--pink-50); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-dow span { text-align: center; font-size: .82rem; font-weight: 700; color: var(--muted); padding: 4px 0; }
.cal-dow .sun, .cal-cell.sun .cal-num { color: #e0607e; }
.cal-dow .sat, .cal-cell.sat .cal-num { color: #6b7fd7; }
.cal-days { margin-top: 4px; }
.cal-cell {
  position: relative;
  min-height: 74px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  padding: 8px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: rgba(255, 255, 255, .6);
  font: inherit;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.cal-cell.empty { background: none; cursor: default; }
.cal-cell:not(.empty):hover { border-color: var(--pink-200); background: #fff; }
.cal-num { font-size: .9rem; font-weight: 600; line-height: 1; }
.cal-cell.has-class { background: linear-gradient(135deg, var(--pink-100), var(--lav-100)); }
.cal-cell.has-holiday { background: #f1f4ef; }
.cal-cell.today .cal-num {
  display: inline-grid; place-items: center;
  width: 24px; height: 24px; margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--plum-900); color: #fff !important;
}
.cal-cell.selected { border-color: var(--pink-500); box-shadow: 0 0 0 2px var(--pink-300); background: #fff; }
.cal-tag {
  font-size: .68rem; font-weight: 700;
  color: #fff; background: var(--pink-500);
  padding: 1px 7px; border-radius: 999px;
  white-space: nowrap;
}
.cal-tag.holiday { background: var(--plum-500); }
.cal-dot {
  position: absolute; right: 8px; top: 9px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--lav-600);
}
.cal-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 14px; font-size: .84rem; color: var(--muted); }
.cal-legend .chip { margin-left: auto; }
.lg { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.lg-class { background: linear-gradient(135deg, var(--pink-200), var(--lav-200)); }
.lg-due { background: var(--lav-600); border-radius: 50%; }
.lg-holiday { background: var(--plum-500); }

.cal-detail { position: sticky; top: calc(var(--header-h) + 16px); }
.detail-date { margin: 0 0 14px; font-weight: 800; font-size: 1.1rem; }
.detail-class h4 { margin: 10px 0 6px; font-size: 1.12rem; }
.detail-meta { margin: 0 0 10px; color: var(--plum-700); font-size: .93rem; }
.detail-class .btn { margin-top: 12px; }
.detail-note { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-size: .93rem; }
.detail-note.holiday { background: #f1f4ef; }
.detail-note.due { background: var(--lav-50); }

/* ==========================================================
   4단계 — 참여하기
   ========================================================== */
.demo-note {
  margin: 18px 0 0;
  font-size: .84rem;
  color: var(--plum-500);
  background: var(--lav-50);
  border: 1px dashed var(--lav-200);
  border-radius: 12px;
  padding: 10px 14px;
}
.demo-note::before { content: "ℹ️ "; }
.block-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 20px; }
.block-head h3 { margin: 0 0 2px; font-size: 1.25rem; }
.block-head p { margin: 0; }
.block-icon {
  width: 48px; height: 48px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 24px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100));
}

/* ----- 투표 ----- */
.poll { padding: 32px; margin-bottom: 24px; }
.poll-head { margin-bottom: 22px; }
.poll-head h3 { margin: 8px 0 4px; font-size: 1.35rem; }
.poll-head p { margin: 0; }
.live {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .72rem; font-weight: 800; letter-spacing: .1em;
  color: #fff; background: var(--pink-500);
  padding: 3px 10px; border-radius: 999px;
}
.live i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.poll-body { display: grid; grid-template-columns: 1fr 1.2fr; gap: 28px; align-items: start; }
.poll-options { display: grid; gap: 10px; }
.poll-opt {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--pink-200);
  border-radius: 16px;
  background: #fff;
  font: inherit; font-weight: 600; color: var(--text);
  text-align: left;
  cursor: pointer;
  transition: border-color .2s, background .2s, transform .15s;
}
.poll-opt:hover { border-color: var(--pink-300); background: var(--pink-50); }
.poll-opt:active { transform: scale(.99); }
.poll-opt:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.poll-opt[aria-pressed="true"] { border-color: var(--pink-500); background: linear-gradient(135deg, var(--pink-50), var(--lav-50)); }
.poll-emoji { font-size: 1.3rem; }
.poll-label { flex: 1; }
.poll-check {
  width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: .8rem; color: transparent;
  border: 1.5px solid var(--pink-200);
}
.poll-opt[aria-pressed="true"] .poll-check { background: var(--grad); border-color: transparent; color: #fff; }

.poll-chart { background: var(--lav-50); border-radius: 18px; padding: 20px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.poll-total { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 1fr 74px; grid-template-areas: "label val" "track val"; column-gap: 12px; row-gap: 5px; align-items: center; }
.bar-label { grid-area: label; font-size: .9rem; font-weight: 500; }
.bar-track { grid-area: track; height: 14px; border-radius: 999px; background: #fff; overflow: hidden; }
.bar-fill { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--pink-300); transition: width .7s cubic-bezier(.2, .8, .2, 1); }
.bar-row.leader .bar-fill { background: var(--grad); }
.bar-row.mine .bar-label { font-weight: 800; color: var(--pink-600); }
.bar-row.mine .bar-label::after { content: " · 내 선택"; font-size: .76rem; color: var(--pink-500); }
.bar-val { grid-area: val; text-align: right; line-height: 1.2; font-variant-numeric: tabular-nums; }
.bar-val strong { display: block; font-size: 1.05rem; color: var(--lav-600); }
.bar-val small { color: var(--muted); font-size: .78rem; }

/* ----- 신청서 · 수강생 공간 ----- */
.join-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: start; }
.apply, .portal { padding: 32px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; margin: 0; padding: 0; border: 0; position: relative; }
.field.wide { grid-column: 1 / -1; }
.field > label, .field legend { font-size: .9rem; font-weight: 700; color: var(--plum-700); padding: 0; }
.req { color: var(--pink-500); }
.opt { color: var(--muted); font-weight: 400; font-size: .8rem; }
.field input:not([type="radio"]):not([type="checkbox"]):not([type="file"]),
.field select, .field textarea {
  width: 100%;
  font: inherit; font-size: 1rem;
  color: var(--text);
  padding: 12px 14px;
  border: 1.5px solid var(--pink-200);
  border-radius: 12px;
  background: #fff;
  transition: border-color .2s, box-shadow .2s;
}
.field textarea { resize: vertical; min-height: 110px; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--lav-400);
  box-shadow: 0 0 0 4px rgba(79, 176, 143, .2);
}
.field.invalid input:not([type="radio"]):not([type="checkbox"]), .field.invalid select, .field.invalid textarea { border-color: #e0517a; background: #fff7f9; }
.field-err { margin: 0; min-height: 0; font-size: .82rem; font-weight: 600; color: #d23f6c; }
.field-err:empty { display: none; }
.char-count { position: absolute; right: 12px; top: 2px; font-size: .78rem; color: var(--muted); }
.radio-row { display: flex; flex-wrap: wrap; gap: 8px; }
.radio { position: relative; cursor: pointer; }
.radio input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.radio span {
  display: inline-block;
  padding: 9px 16px;
  border: 1.5px solid var(--pink-200);
  border-radius: 999px;
  background: #fff;
  font-size: .92rem;
  transition: background .2s, border-color .2s;
}
.radio input:checked + span { background: var(--grad); border-color: transparent; color: #fff; font-weight: 700; }
.radio input:focus-visible + span { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.field.invalid .radio span { border-color: #e0517a; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: .93rem; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--pink-500); flex-shrink: 0; }
.form-summary {
  margin-bottom: 18px;
  padding: 14px 16px;
  border-radius: 14px;
  background: #fff1f5;
  border: 1.5px solid #f3a3bd;
  color: #a12a54;
  font-size: .92rem;
}
.form-summary p { margin: 6px 0 0; }
.form-summary .link-btn { color: #b02a5a; }
.form-actions { margin-top: 22px; }
.form-actions .btn { width: 100%; }

.apply-done { text-align: center; padding: 10px 0; }
.done-icon { font-size: 3rem; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.apply-done h4 { margin: 8px 0 4px; font-size: 1.25rem; }
.apply-done > p { margin: 0 0 16px; color: var(--muted); }
.done-list { text-align: left; margin: 0 auto 4px; max-width: 360px; background: var(--pink-50); border-radius: 14px; padding: 14px 18px; }
.done-list div { display: flex; gap: 12px; padding: 3px 0; font-size: .93rem; }
.done-list dt { width: 84px; flex-shrink: 0; color: var(--accent); font-weight: 700; }
.done-list dd { margin: 0; overflow-wrap: anywhere; }
.apply-done .btn { margin-top: 18px; }

/* 로그인 */
.login-form { display: grid; gap: 14px; }
.login-form .btn { width: 100%; margin-top: 4px; }
.login-join { margin: 2px 0 0; text-align: center; color: var(--muted); }
.login-join a { color: var(--accent); font-weight: 700; }
.login-hint { margin: -6px 0 14px; padding: 10px 14px; border-radius: 12px; background: var(--pink-50); font-size: .9rem; color: var(--pink-600); font-weight: 600; }
.portal-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
.who { display: flex; align-items: center; gap: 12px; }
.who-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--grad); color: #fff; font-weight: 800; font-size: 1.1rem;
}
.who strong { display: block; font-size: 1.05rem; }
.who small { color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; background: var(--lav-50); border-radius: 14px; margin-bottom: 18px; }
.tabs button {
  border: 0; background: none;
  font: inherit; font-weight: 700; font-size: .95rem; color: var(--plum-500);
  padding: 10px; border-radius: 10px; cursor: pointer;
}
.tabs button[aria-selected="true"] { background: #fff; color: var(--pink-600); box-shadow: 0 4px 12px -6px rgba(40, 70, 40, .4); }
.tabs button:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 1px; }

/* 출석 */
.att-today {
  display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100));
}
.att-today.empty { background: var(--lav-50); }
.att-today h4 { margin: 6px 0 2px; font-size: 1.05rem; }
.att-today p { margin: 0; }
.att-today .btn[disabled] { opacity: .7; cursor: not-allowed; }
.att-done { font-weight: 700; color: #2f9a6b; background: #fff; padding: 8px 14px; border-radius: 999px; }
.att-done.late { color: #c7842a; }
.att-done.absent { color: var(--plum-500); }
.att-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; text-align: center; }
.att-stats div { background: var(--pink-50); border-radius: 12px; padding: 10px 4px; }
.att-stats strong { display: block; font-size: 1.3rem; color: var(--lav-600); font-variant-numeric: tabular-nums; }
.att-stats .present strong { color: #2f9a6b; }
.att-stats .late strong { color: #c7842a; }
.att-stats .absent strong { color: #d23f6c; }
.att-stats span { font-size: .8rem; color: var(--muted); }
.att-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.att-cell {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 2px;
  border-radius: 12px;
  background: #fff;
  border: 1.5px solid var(--lav-100);
  font-size: .76rem; line-height: 1.35;
}
.att-cell strong { font-size: .88rem; }
.att-cell small { color: var(--muted); font-size: .68rem; }
.att-cell span { font-weight: 700; margin-top: 2px; }
.att-cell.present { background: #eefaf4; border-color: #bfe8d3; color: #2f9a6b; }
.att-cell.late { background: #fff7ea; border-color: #f4d9a8; color: #c7842a; }
.att-cell.absent { background: #fff1f5; border-color: #f6c3d3; color: #d23f6c; }
.att-cell.today { border-color: var(--pink-500); color: var(--pink-600); }
.att-cell.upcoming span { color: var(--muted); font-weight: 500; }
.att-cell strong, .att-cell small { color: var(--text); }

/* 과제 제출 */
.sub-form { display: grid; gap: 14px; }
.sub-info { background: var(--pink-50); border-radius: 14px; padding: 14px 16px; font-size: .93rem; }
.sub-info p { margin: 0 0 6px; }
.sub-info p:last-child { margin: 0; }
.sub-info.closed { background: #f2f5f0; }
.sub-last { color: #2f9a6b; font-weight: 600; }
.sub-blocked { margin: 0; padding: 14px; border-radius: 14px; background: #f2f5f0; color: var(--plum-700); font-weight: 600; text-align: center; }
.dropzone {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 26px 16px;
  border: 2px dashed var(--pink-300);
  border-radius: 18px;
  background: #fff;
  text-align: center;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.dropzone:hover, .dropzone.over { background: var(--pink-50); border-color: var(--pink-500); }
.dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.dropzone:focus-within { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.dz-icon { font-size: 2rem; }
.dz-text { display: flex; flex-direction: column; }
.dz-text small { color: var(--muted); font-size: .78rem; margin-top: 2px; }
.dz-file { margin-top: 6px; padding: 8px 14px; background: var(--lav-50); border-radius: 999px; font-size: .9rem; font-weight: 600; overflow-wrap: anywhere; }
.sub-form .btn { width: 100%; }
.hist-title { margin: 22px 0 10px; font-size: 1rem; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.hist li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; background: var(--lav-50); font-size: .88rem; }
.hist-file { flex: 1; min-width: 120px; overflow-wrap: anywhere; font-weight: 600; }
.hist-file small { color: var(--muted); font-weight: 400; }
.hist-at { color: var(--muted); font-variant-numeric: tabular-nums; }
.hist .late { color: #c7842a; font-style: normal; font-weight: 700; }

/* ----- 알림 ----- */
.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; display: grid; gap: 8px; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast {
  padding: 12px 20px;
  border-radius: 999px;
  background: var(--plum-900);
  color: #fff;
  font-weight: 600; font-size: .93rem;
  box-shadow: 0 12px 30px -10px rgba(22, 38, 24, .6);
  opacity: 0; transform: translateY(12px);
  transition: opacity .3s, transform .3s;
  text-align: center;
}
.toast.show { opacity: 1; transform: none; }
.toast-ok { background: linear-gradient(135deg, var(--pink-600), var(--lav-600)); }
.toast-error { background: #c23360; }

/* ----- 안내 팝업 ----- */
body.modal-open { overflow: hidden; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 110;
  display: grid; place-items: center;
  padding: 16px;
  background: rgba(22, 38, 24, .45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity .25s;
}
.modal-backdrop.show { opacity: 1; }
.modal {
  position: relative;
  width: 100%; max-width: 440px;
  max-height: calc(100vh - 32px); overflow: auto;
  padding: 36px 30px 22px;
  border-radius: 28px;
  background: linear-gradient(170deg, #fff 0%, #f4f9ef 60%, #eaf5ef 100%);
  box-shadow: 0 30px 70px -20px rgba(22, 38, 24, .5);
  text-align: center;
  transform: translateY(16px) scale(.97);
  transition: transform .3s cubic-bezier(.2, 1.2, .4, 1);
}
.modal-backdrop.show .modal { transform: none; }
.modal:focus { outline: none; }
.modal-deco { font-size: 2.6rem; margin-bottom: 4px; }
.modal h2 { margin: 6px 0 16px; font-size: 1.4rem; line-height: 1.4; white-space: pre-line; }
.modal-lines { list-style: none; margin: 0 0 22px; padding: 14px 16px; background: #fff; border-radius: 16px; text-align: left; font-size: .93rem; display: grid; gap: 6px; border: 1px solid var(--pink-100); }
.modal .btn { width: 100%; }
.modal-x {
  position: absolute; right: 14px; top: 12px;
  width: 36px; height: 36px; border: 0; border-radius: 50%;
  background: var(--pink-50); color: var(--pink-600);
  font-size: 1.4rem; line-height: 1; cursor: pointer;
}
.modal-x:focus-visible, .modal-today:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.modal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--pink-100); }
.modal-foot .check { align-items: center; color: var(--plum-700); }
.modal-foot .check input { margin: 0; }

/* ----- 폭죽 ----- */
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 130; }

/* ==========================================================
   5단계 — 공지 · 관리자
   ========================================================== */
.header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.lock-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 1.5px solid var(--pink-200);
  border-radius: 12px;
  background: #fff;
  color: var(--plum-500);
  cursor: pointer;
  transition: background .2s, color .2s;
}
.lock-btn:hover { background: var(--pink-50); color: var(--pink-600); }
.lock-btn:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.lock-btn .ic-unlock { display: none; }
.lock-btn.unlocked { background: var(--grad); color: #fff; border-color: transparent; }
.lock-btn.unlocked .ic-lock { display: none; }
.lock-btn.unlocked .ic-unlock { display: block; }

/* 공지사항 */
.notices-section { padding-top: 40px; }
.notice-list { max-width: 860px; margin: 0 auto; display: grid; gap: 12px; }
.notice-item { padding: 0; overflow: hidden; }
.notice-item.extra { display: none; }
.notice-item.important { border-color: var(--pink-300); box-shadow: 0 10px 30px -14px rgba(63, 157, 42, .55); }
.notice-item summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 18px 22px;
}
.notice-item summary::-webkit-details-marker { display: none; }
.notice-item summary:hover { background: var(--pink-50); }
.notice-item summary:focus-visible { outline: 3px solid var(--lav-400); outline-offset: -3px; }
.notice-title { font-weight: 700; flex: 1; min-width: 160px; }
.notice-date { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.notice-body { padding: 0 22px 20px; color: var(--plum-700); border-top: 1px dashed var(--pink-200); padding-top: 14px; }
.notice-more { text-align: center; margin-top: 16px; }

/* 공통 */
.btn.danger, .link-btn.danger { color: #c23360; }
.btn-ghost.danger { border-color: #f3a3bd; }
.file-btn { position: relative; overflow: hidden; cursor: pointer; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.file-btn:focus-within { outline: 3px solid var(--lav-400); outline-offset: 2px; }

/* 관리자 화면 */
.admin-backdrop {
  position: fixed; inset: 0; z-index: 115;
  display: grid; place-items: center;
  padding: 20px;
  background: rgba(22, 38, 24, .5);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  opacity: 0; transition: opacity .2s;
}
.admin-backdrop.show { opacity: 1; }
.admin {
  width: 100%; max-width: 1180px;
  height: min(860px, calc(100vh - 40px));
  display: flex; flex-direction: column;
  background: #fbfdf9;
  border-radius: 24px;
  box-shadow: 0 30px 80px -20px rgba(22, 38, 24, .55);
  overflow: hidden;
}
.admin-bar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 20px;
  background: var(--grad);
  color: #fff;
}
.admin-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 1.05rem; }
.admin-state { font-size: .75rem; font-weight: 700; background: rgba(255, 255, 255, .25); padding: 3px 10px; border-radius: 999px; }
.admin-state.on { background: #fff; color: var(--pink-600); }
.admin-bar-actions { display: flex; gap: 8px; align-items: center; }
.admin-bar .chip { background: rgba(255, 255, 255, .95); border-color: transparent; }
.admin-x {
  width: 38px; height: 38px; border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .25); color: #fff;
  font-size: 1.5rem; line-height: 1; cursor: pointer;
}
.admin-x:hover { background: rgba(255, 255, 255, .4); }
.admin-x:focus-visible, .admin-bar .chip:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.admin-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 200px 1fr; }
.admin-tabs {
  display: flex; flex-direction: column; gap: 4px;
  padding: 14px 10px;
  background: var(--lav-50);
  border-right: 1px solid var(--lav-100);
  overflow-y: auto;
}
.admin-tabs button {
  text-align: left;
  border: 0; background: none;
  font: inherit; font-weight: 600; font-size: .95rem; color: var(--plum-700);
  padding: 11px 14px; border-radius: 12px; cursor: pointer;
  white-space: nowrap;
}
.admin-tabs button:hover { background: #fff; }
.admin-tabs button[aria-selected="true"] { background: #fff; color: var(--pink-600); box-shadow: 0 4px 14px -8px rgba(40, 70, 40, .5); }
.admin-tabs button:focus-visible { outline: 3px solid var(--lav-400); outline-offset: -2px; }
.admin-panel { overflow-y: auto; padding: 24px 28px 32px; position: relative; }
.admin-panel:focus { outline: none; }

.ap-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.ap-head h3 { margin: 0 0 4px; font-size: 1.35rem; }
.ap-head p { margin: 0; max-width: 640px; }
.ap-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ap-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0; }
.ap-sub { margin: 28px 0 10px; }
.ap-empty { padding: 28px; text-align: center; color: var(--muted); background: #fff; border: 1.5px dashed var(--pink-200); border-radius: 16px; }
.ap-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.ap-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 18px;
  border: 1px solid var(--card-border);
  border-radius: 18px;
  background: #fff;
  font: inherit; color: var(--plum-700); text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform .2s;
}
.ap-card:hover:not(:disabled) { transform: translateY(-2px); }
.ap-card:disabled { cursor: default; }
.ap-card:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.ap-card-ic { font-size: 1.4rem; }
.ap-card strong { font-size: 1.6rem; color: var(--lav-600); font-variant-numeric: tabular-nums; }
.ap-note { margin: 20px 0 6px; padding: 16px 18px; border-radius: 16px; background: #fff; border: 1px solid var(--lav-200); font-size: .93rem; }
.ap-note p { margin: 6px 0 0; }
.ap-search { margin-bottom: 12px; }
.ap-search input, .ap-search select {
  width: 100%; max-width: 360px;
  font: inherit; padding: 10px 14px;
  border: 1.5px solid var(--pink-200); border-radius: 12px; background: #fff;
}
.ap-table-wrap { overflow-x: auto; background: #fff; border-radius: 16px; border: 1px solid var(--card-border); }
.ap-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.ap-table th, .ap-table td { padding: 10px 12px; border-bottom: 1px solid var(--pink-100); text-align: left; white-space: nowrap; }
.ap-table th { position: sticky; top: 0; background: var(--pink-50); font-weight: 700; color: var(--plum-700); z-index: 1; }
.ap-table tbody tr:hover { background: #fbfdf9; }
.att-mark { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 8px; font-size: .78rem; font-weight: 700; color: var(--muted); }
.att-mark.ok { background: #eefaf4; color: #2f9a6b; }
.att-mark.late { background: #fff7ea; color: #c7842a; }
.att-mark.no { background: #fff1f5; color: #d23f6c; }
.ap-minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-bottom: 16px; }
.ap-mini { display: flex; flex-direction: column; padding: 12px 14px; background: #fff; border-radius: 14px; border: 1px solid var(--card-border); font-size: .85rem; }
.ap-mini span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ap-mini em { font-style: normal; font-weight: 700; color: var(--pink-600); }
.ap-form { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 14px; padding: 18px; background: #fff; border-radius: 18px; border: 1px solid var(--card-border); margin-bottom: 12px; align-items: end; }
.ap-form .field.wide, .ap-form .field-err, .ap-form .ap-row { grid-column: 1 / -1; }
.ap-form .ap-row { margin: 0; }
.ap-roster-add { grid-template-columns: 1fr 1fr 1fr 1.3fr auto; }
.ap-bulk { margin: 0 0 16px; padding: 14px 18px; background: #fff; border-radius: 16px; border: 1px solid var(--card-border); }
.ap-bulk summary { cursor: pointer; font-weight: 700; color: var(--pink-600); }
.ap-bulk textarea { width: 100%; font: inherit; padding: 10px 12px; border: 1.5px solid var(--pink-200); border-radius: 12px; }
.ap-notices { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ap-notices li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; background: #fff; border-radius: 14px; border: 1px solid var(--card-border); }
.ap-notices strong { flex: 1; min-width: 140px; }
.ap-notices small { color: var(--muted); }
.ap-li-actions { display: flex; gap: 12px; }
.ap-blocks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.ap-block { padding: 20px; background: #fff; border-radius: 18px; border: 1px solid var(--card-border); }
.ak-row { display: flex; gap: 8px; align-items: center; }
.ak-row input { flex: 1; min-width: 0; font-family: ui-monospace, Consolas, monospace; }
.ap-key .field, .ap-key-add .field { margin-bottom: 10px; }
.ap-key .ed-check { margin: 4px 0 2px; }
.ap-key .ap-row { margin-top: 8px; flex-wrap: wrap; }
.ap-block h4 { margin: 0 0 6px; }
.ap-block .ap-form { padding: 0; border: 0; grid-template-columns: 1fr; }

/* 사이트 편집기 */
.ed-layout { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: start; }
.ed-sec-select { display: none; }
.ed-sec-list { display: grid; gap: 2px; position: sticky; top: 0; }
.ed-sec-list button {
  text-align: left; border: 0; background: none;
  font: inherit; font-size: .9rem; color: var(--plum-700);
  padding: 8px 12px; border-radius: 10px; cursor: pointer;
}
.ed-sec-list button:hover { background: var(--pink-50); }
.ed-sec-list button.on { background: var(--pink-100); color: var(--pink-600); font-weight: 700; }
.ed-sec-list button:focus-visible { outline: 3px solid var(--lav-400); outline-offset: -2px; }
.ed-form { display: grid; gap: 12px; padding-bottom: 70px; }
.ed-field { display: flex; flex-direction: column; gap: 4px; }
.ed-field label { font-size: .82rem; font-weight: 700; color: var(--plum-700); }
.ed-field input, .ed-field textarea {
  width: 100%; font: inherit; font-size: .94rem;
  padding: 9px 12px;
  border: 1.5px solid var(--pink-200); border-radius: 10px; background: #fff;
}
.ed-field input:focus, .ed-field textarea:focus { outline: none; border-color: var(--lav-400); box-shadow: 0 0 0 3px rgba(79, 176, 143, .2); }
.ed-check { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; }
.ed-check input { width: 18px; height: 18px; accent-color: var(--pink-500); }
.ed-arr, .ed-obj { margin: 0; padding: 12px 14px; border: 1.5px solid var(--lav-100); border-radius: 14px; background: rgba(255, 255, 255, .7); display: grid; gap: 10px; min-width: 0; }
.ed-arr > legend, .ed-obj > legend { font-weight: 800; color: var(--lav-600); padding: 0 6px; font-size: .92rem; }
.ed-arr small { color: var(--muted); font-weight: 500; }
.ed-item { background: #fff; border: 1px solid var(--pink-100); border-radius: 12px; }
.ed-item > summary {
  list-style: none; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 8px 12px; font-weight: 600; font-size: .9rem;
}
.ed-item > summary::-webkit-details-marker { display: none; }
.ed-item > summary::before { content: "▸"; color: var(--pink-500); margin-right: 4px; transition: transform .2s; }
.ed-item[open] > summary::before { transform: rotate(90deg); }
.ed-item > summary > span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-item-body { padding: 4px 12px 12px; display: grid; gap: 10px; border-top: 1px dashed var(--pink-100); }
.ed-item.flat { padding: 8px 10px; }
.ed-item-row { display: flex; gap: 8px; align-items: center; }
.ed-item-row > .ed-field { flex: 1; }
.ed-tools { display: inline-flex; gap: 4px; flex-shrink: 0; }
.ed-tools button {
  width: 28px; height: 28px; border: 1px solid var(--pink-200); border-radius: 8px;
  background: #fff; color: var(--plum-700); cursor: pointer; font-size: .85rem; line-height: 1;
}
.ed-tools button:hover:not(:disabled) { background: var(--pink-50); }
.ed-tools button:disabled { opacity: .35; cursor: default; }
.ed-tools button.danger { color: #c23360; }
.ed-add { justify-self: start; }
.ed-missing { display: flex; gap: 6px; flex-wrap: wrap; }
.ed-rm { font-size: .78rem; margin-left: 6px; }
.ed-bar {
  position: sticky; bottom: -32px;
  margin: 0 -28px -32px;
  padding: 12px 28px;
  display: flex; justify-content: flex-end; align-items: center; gap: 10px;
  background: rgba(250, 253, 248, .96);
  border-top: 1px solid var(--pink-100);
  backdrop-filter: blur(6px);
}
.ed-dirty { margin-right: auto; font-size: .85rem; color: var(--muted); }
.ed-bar .btn:disabled { opacity: .45; cursor: default; transform: none; }

/* ---------- 프로그램 소개 ---------- */
.feature-icon {
  width: 56px; height: 56px;
  display: grid; place-items: center;
  font-size: 28px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100));
  margin-bottom: 18px;
}
.feature h3 { font-size: 1.12rem; margin: 0 0 8px; }
.feature p { color: var(--muted); margin: 0; font-size: .95rem; }

/* ---------- 커리큘럼 ---------- */
.phase { position: relative; overflow: hidden; }
.phase::after {
  content: attr(data-step);
  position: absolute; right: 16px; top: 4px;
  font-size: 4.5rem; font-weight: 800;
  color: var(--pink-100);
  line-height: 1;
  pointer-events: none;
}
.phase-weeks {
  display: inline-block;
  font-size: .8rem; font-weight: 700;
  color: #fff;
  background: var(--grad);
  padding: 4px 12px;
  border-radius: 999px;
  margin-bottom: 12px;
  position: relative; z-index: 1;
}
.phase h3 { font-size: 1.2rem; margin: 0 0 14px; position: relative; z-index: 1; }
.phase ul { list-style: none; margin: 0; padding: 0; position: relative; z-index: 1; }
.phase li {
  position: relative;
  padding: 7px 0 7px 22px;
  font-size: .95rem;
  color: var(--plum-700);
  border-top: 1px dashed var(--pink-200);
}
.phase li:first-child { border-top: 0; }
.phase li::before {
  content: "";
  position: absolute; left: 4px; top: 16px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--pink-300);
}

/* ---------- 수강 안내 ---------- */
.enroll-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
.info-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 0; }
.info-item { background: var(--pink-50); border-radius: var(--radius-sm); padding: 14px 16px; }
.info-item dt { font-size: .8rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.info-item dd { margin: 0; font-weight: 500; }
.card h3 { margin-top: 0; }
.grade-row { margin-bottom: 14px; }
.grade-row:last-child { margin-bottom: 0; }
.grade-label { display: flex; justify-content: space-between; font-size: .95rem; margin-bottom: 6px; }
.grade-label strong { color: var(--lav-600); }
.grade-bar { height: 10px; border-radius: 999px; background: var(--lav-100); overflow: hidden; }
.grade-bar span { display: block; height: 100%; border-radius: inherit; background: var(--grad); }
.notice {
  margin-top: 20px;
  display: flex; gap: 12px; align-items: flex-start;
  background: linear-gradient(135deg, var(--pink-100), var(--lav-100));
  border-radius: var(--radius);
  padding: 18px 22px;
  color: var(--plum-700);
}
.notice::before { content: "📢"; font-size: 1.2rem; line-height: 1.5; }

/* ---------- FAQ ---------- */
.faq-list { max-width: 800px; margin: 0 auto; display: grid; gap: 14px; }
.faq-item { padding: 0; overflow: hidden; }
.faq-item summary {
  list-style: none;
  cursor: pointer;
  padding: 20px 60px 20px 24px;
  font-weight: 700;
  position: relative;
  display: flex; gap: 12px; align-items: flex-start;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::before {
  content: "Q";
  flex-shrink: 0;
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--grad);
  color: #fff;
  font-size: .85rem;
}
.faq-item summary::after {
  content: "";
  position: absolute; right: 26px; top: 50%;
  width: 10px; height: 10px;
  border-right: 2px solid var(--pink-500);
  border-bottom: 2px solid var(--pink-500);
  transform: translateY(-70%) rotate(45deg);
  transition: transform .25s;
}
.faq-item[open] summary::after { transform: translateY(-30%) rotate(-135deg); }
.faq-item summary:hover { background: var(--pink-50); }
.faq-answer { padding: 0 24px 22px 64px; color: var(--plum-700); }
.faq-answer p { margin: 0; }

/* ---------- 교수자 (푸터 안) ---------- */
.person {
  display: grid; grid-template-columns: 160px 1fr; gap: 36px; align-items: center;
  padding: 40px;
  max-width: 900px;
  margin: 0 auto;
  text-align: left;
  font-size: 1rem;
  color: var(--text);
}
.person .eyebrow { margin-bottom: 10px; }
.avatar {
  width: 160px; height: 160px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--grad);
  color: #fff;
  font-size: 3.6rem;
  box-shadow: 0 0 0 8px var(--pink-100);
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.person h3 { font-size: 1.5rem; margin: 0; }
.person h3 .zh { font-size: 1rem; color: var(--muted); margin-left: 8px; font-weight: 600; }
.person .role { color: var(--accent); font-weight: 600; margin: 2px 0 12px; }
.person .bio { color: var(--plum-700); margin: 0 0 18px; }
.contact { display: grid; gap: 8px; margin: 0; }
.contact div { display: flex; gap: 10px; font-size: .94rem; }
.contact dt { flex-shrink: 0; width: 76px; font-weight: 700; color: var(--lav-600); }
.contact dd { margin: 0; overflow-wrap: anywhere; }
.contact a { color: var(--pink-600); }

/* ---------- 푸터 ---------- */
.footer {
  margin-top: 40px;
  padding: 72px 0 40px;
  background: linear-gradient(180deg, rgba(196, 226, 173, .35), rgba(185, 223, 209, .55));
  border-top: 1px solid var(--card-border);
}
.footer .person { padding: 40px; }
.footer-bottom {
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid rgba(31, 122, 92, .18);
  display: flex; justify-content: space-between; align-items: center; gap: 20px;
  font-size: .86rem;
  color: var(--plum-700);
}
.footer-bottom p { margin: 2px 0; text-align: right; }
.footer-brand { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; }
.footer .copy { margin-top: 8px; font-size: .78rem; color: var(--muted); }

/* ---------- 맨 위로 버튼 ---------- */
.to-top {
  position: fixed;
  right: 20px; bottom: 20px;
  z-index: 60;
  width: 52px; height: 52px;
  border: 0;
  border-radius: 50%;
  background: var(--grad);
  color: #fff;
  cursor: pointer;
  display: grid; place-items: center;
  box-shadow: 0 10px 24px -8px rgba(47, 127, 30, .6);
  opacity: 0;
  visibility: hidden;
  transform: translateY(12px);
  transition: opacity .25s, transform .25s, visibility .25s;
}
.to-top.show { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { transform: translateY(-3px); }
.to-top:focus-visible, .btn:focus-visible, .nav a:focus-visible, .menu-toggle:focus-visible, summary:focus-visible {
  outline: 3px solid var(--lav-400);
  outline-offset: 2px;
}

/* ---------- 꽃잎 장식 ---------- */
.petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.petal {
  position: absolute;
  top: -30px;
  width: 14px; height: 11px;
  background: linear-gradient(135deg, #dcefc8, #a9d68a);
  border-radius: 11px 1px 11px 1px;
  opacity: .7;
  animation: fall linear infinite;
}
@keyframes fall {
  0%   { transform: translate3d(0, -5vh, 0) rotate(0deg); }
  100% { transform: translate3d(var(--drift, 80px), 105vh, 0) rotate(540deg); }
}
main, .footer { position: relative; z-index: 1; }

/* ==========================================================
   실시간 퀴즈
   ========================================================== */
:root {
  --qz0: #e5537a;  /* ▲ */
  --qz1: #7c6cf0;  /* ◆ */
  --qz2: #e39b2d;  /* ● */
  --qz3: #22a383;  /* ■ */
}
.quiz-card { margin-top: 24px; padding: 32px; }
.qhp {
  margin-bottom: 18px; padding: 14px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--lav-50), var(--pink-50));
  border: 1.5px dashed var(--lav-200);
}
.qhp-title { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 10px; }
.qhp-row { display: flex; gap: 10px; flex-wrap: wrap; }
.qhp-row select { flex: 1; min-width: 200px; font: inherit; padding: 9px 12px; border: 1.5px solid var(--pink-200); border-radius: 12px; background: #fff; }
.quiz-join { max-width: 560px; }
.quiz-join-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; margin-bottom: 8px; }
.qz-pin { font-size: 1.4rem !important; font-weight: 800; letter-spacing: .25em; text-align: center; font-variant-numeric: tabular-nums; }
.quiz-join .btn { width: 100%; margin-top: 4px; }
.qz-tip { margin: 10px 0 0; }
.qz-wait, .qz-result { text-align: center; padding: 18px 8px; }
.qz-wait h4, .qz-result h4 { margin: 6px 0; font-size: 1.3rem; }
.qz-wait p { margin: 4px 0 12px; color: var(--plum-700); }
.qz-big { font-size: 3rem; line-height: 1.2; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.qz-spin {
  width: 44px; height: 44px; margin: 8px auto 12px;
  border: 4px solid var(--pink-100); border-top-color: var(--pink-500);
  border-radius: 50%;
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.qz-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.qz-timer { font-weight: 700; color: var(--plum-700); }
.qz-timer b { font-size: 1.6rem; color: var(--pink-600); font-variant-numeric: tabular-nums; }
.qz-bar { height: 8px; border-radius: 999px; background: var(--pink-100); overflow: hidden; margin-bottom: 14px; }
.qz-bar span { display: block; height: 100%; background: var(--grad); border-radius: inherit; transition: width .2s linear; }
.qz-q { font-size: 1.25rem; margin: 0 0 16px; line-height: 1.5; }
.qz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qz-choice {
  display: flex; align-items: center; gap: 10px;
  min-height: 84px; padding: 14px 16px;
  border: 0; border-radius: 18px;
  color: #fff; font: inherit; font-weight: 700; font-size: 1.05rem; text-align: left;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .15);
  transition: transform .1s, box-shadow .1s, filter .2s;
}
.qz-choice:hover { filter: brightness(1.06); }
.qz-choice:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
.qz-choice:focus-visible { outline: 4px solid var(--plum-900); outline-offset: 2px; }
.qz-shape { font-size: 1.4rem; line-height: 1; flex-shrink: 0; }
.c0 { --qc: var(--qz0); } .c1 { --qc: var(--qz1); } .c2 { --qc: var(--qz2); } .c3 { --qc: var(--qz3); }
.qz-choice, .qz-chip, .qh-tile { background: var(--qc); }
.qz-chip { width: 84px; height: 84px; margin: 0 auto 8px; border-radius: 22px; display: grid; place-items: center; color: #fff; font-size: 2.4rem; }
.qz-result.ok h4 { color: #1f8a5c; }
.qz-result.no h4 { color: #c23360; }
.qz-exp { background: var(--lav-50); border-radius: 12px; padding: 10px 14px; margin: 10px auto; max-width: 460px; }
.qz-score { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.qz-score span { background: var(--pink-50); border-radius: 999px; padding: 8px 16px; }
.qz-score b { color: var(--pink-600); font-size: 1.15rem; font-variant-numeric: tabular-nums; }

/* 진행자 화면 (프로젝터용) */
.qh-backdrop {
  position: fixed; inset: 0; z-index: 116;
  background: linear-gradient(160deg, #f4f9ef 0%, #eaf5ef 100%);
  opacity: 0; transition: opacity .2s;
}
.qh-backdrop.show { opacity: 1; }
.qh { height: 100%; display: flex; flex-direction: column; }
.qh-bar { display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: var(--grad); color: #fff; }
.qh-bar strong { flex: 1; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qh-count { font-weight: 700; background: rgba(255, 255, 255, .25); padding: 4px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.qh-x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .25); color: #fff; font-size: 1.5rem; cursor: pointer; }
.qh-x:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.qh-body { flex: 1; overflow-y: auto; padding: clamp(16px, 3vw, 36px); display: flex; flex-direction: column; gap: 18px; max-width: 1200px; width: 100%; margin: 0 auto; }
.qh-body:focus { outline: none; }
.qh-center { margin: auto; text-align: center; }
.qh-label { margin: 0 0 6px; color: var(--plum-700); }
.qh-lobby { display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 4vw, 48px); align-items: center; background: #fff; border-radius: 28px; padding: clamp(16px, 3vw, 32px); box-shadow: var(--shadow); }
.qh-qr { text-align: center; }
.qh-qr svg { width: clamp(180px, 24vw, 280px); height: auto; display: block; border-radius: 12px; }
.qh-qr p { margin: 6px 0 0; }
.qh-pin { font-size: clamp(3rem, 9vw, 6.5rem); font-weight: 800; letter-spacing: .08em; line-height: 1.05; color: var(--plum-900); font-variant-numeric: tabular-nums; }
.qh-url { margin: 8px 0 0; color: var(--muted); font-size: 1rem; overflow-wrap: anywhere; }
.qh-warn { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; background: #fff7ea; color: #8a5a12; font-size: .9rem; }
.qh-players { background: rgba(255, 255, 255, .7); border-radius: 22px; padding: 18px 20px; min-height: 120px; }
.qh-names { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.qh-names li { padding: 8px 16px; border-radius: 999px; background: #fff; font-weight: 700; box-shadow: 0 4px 12px -8px rgba(40, 70, 40, .5); animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
.qh-names li.off { opacity: .4; }
.qh-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: auto; }
.qh-actions .btn { font-size: 1.1rem; padding: 14px 28px; }
.qh-actions .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.qh-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.qh-qhead { display: flex; justify-content: space-between; align-items: center; }
.qh-answered { font-weight: 700; font-size: 1.1rem; color: var(--plum-700); font-variant-numeric: tabular-nums; }
.qh-qrow { display: flex; gap: 20px; align-items: center; }
.qh-qrow .qh-question { flex: 1; }
.qh-question { margin: 0; font-size: clamp(1.4rem, 3.4vw, 2.4rem); line-height: 1.4; background: #fff; border-radius: 24px; padding: 22px 26px; box-shadow: var(--shadow); }
.qh-time {
  --p: 100%;
  width: 104px; height: 104px; flex-shrink: 0;
  border-radius: 50%;
  display: grid; place-items: center;
  background: conic-gradient(var(--pink-500) var(--p), var(--pink-100) 0);
}
.qh-time b {
  width: 82px; height: 82px; border-radius: 50%;
  display: grid; place-items: center;
  background: #fff; font-size: 2.2rem; color: var(--plum-900); font-variant-numeric: tabular-nums;
}
.qh-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.qh-tile {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 14px;
  min-height: clamp(70px, 12vh, 120px);
  padding: 16px 22px;
  border-radius: 20px;
  color: #fff; font-weight: 700; font-size: clamp(1.05rem, 2.2vw, 1.6rem);
  box-shadow: 0 6px 0 rgba(0, 0, 0, .12);
}
.qh-tile .qz-shape { font-size: 1.8rem; }
.qh-tile-text { flex: 1; position: relative; z-index: 1; }
.qh-tile-count { position: relative; z-index: 1; font-size: 1.1rem; background: rgba(255, 255, 255, .25); padding: 4px 12px; border-radius: 999px; }
.qh-tile-bar { position: absolute; left: 0; bottom: 0; height: 6px; background: rgba(255, 255, 255, .7); transition: width .6s; }
.qh-tiles.result .qh-tile.wrong { opacity: .35; }
.qh-tiles.result .qh-tile.right { box-shadow: 0 0 0 5px #fff, 0 0 0 9px var(--qc); transform: scale(1.01); }
.qh-exp { margin: 0; padding: 14px 18px; background: #fff; border-radius: 16px; font-size: 1.1rem; }
.qh-title { text-align: center; margin: 0; font-size: clamp(1.6rem, 4vw, 2.6rem); }
.qh-board { list-style: none; margin: 0 auto; padding: 0; width: 100%; max-width: 760px; display: grid; gap: 10px; }
.qh-board li {
  display: grid; grid-template-columns: 52px 1fr auto auto; gap: 14px; align-items: center;
  padding: 14px 20px; background: #fff; border-radius: 18px; box-shadow: var(--shadow);
  font-size: 1.2rem; animation: pop .4s cubic-bezier(.2, 1.4, .4, 1) both;
}
.qh-board li:nth-child(2) { animation-delay: .06s; } .qh-board li:nth-child(3) { animation-delay: .12s; }
.qh-board li:nth-child(4) { animation-delay: .18s; } .qh-board li:nth-child(5) { animation-delay: .24s; }
.qh-rank { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #fff; font-weight: 800; }
.qh-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qh-gain { color: #1f8a5c; font-weight: 700; font-size: 1rem; }
.qh-score { font-weight: 800; color: var(--lav-600); font-variant-numeric: tabular-nums; }
.qh-podium { display: grid; grid-template-columns: repeat(3, minmax(0, 200px)); justify-content: center; align-items: end; gap: 12px; }
.qh-pod { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) both; }
.qh-pod.p1 { animation-delay: .3s; } .qh-pod.p3 { animation-delay: .15s; }
.qh-pod-name { font-weight: 800; font-size: 1.2rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qh-pod-score { color: var(--muted); font-variant-numeric: tabular-nums; }
.qh-pod-block { width: 100%; display: grid; place-items: center; color: #fff; font-size: 2.4rem; font-weight: 800; border-radius: 18px 18px 0 0; }
.qh-pod.p1 .qh-pod-block { height: 170px; background: linear-gradient(180deg, #f6c445, #e39b2d); }
.qh-pod.p2 .qh-pod-block { height: 125px; background: linear-gradient(180deg, #c9c3dc, #9d94bb); }
.qh-pod.p3 .qh-pod-block { height: 95px; background: linear-gradient(180deg, #e9a77d, #c97a4f); }
.qh-table { max-height: 260px; overflow: auto; background: #fff; border-radius: 16px; }
.qh-table table { width: 100%; border-collapse: collapse; }
.qh-table th, .qh-table td { padding: 10px 14px; border-bottom: 1px solid var(--pink-100); text-align: left; }
.qh-table th { position: sticky; top: 0; background: var(--pink-50); }

/* 관리자 › 퀴즈 */
.qa-ai { margin: 16px 0; background: #fff; border: 1.5px solid var(--lav-200); border-radius: 18px; }
.qa-ai > summary { cursor: pointer; padding: 14px 18px; font-weight: 800; color: var(--lav-600); }
.qa-ai-body { padding: 4px 18px 18px; display: grid; gap: 12px; }
.qa-weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; max-height: 190px; overflow: auto; padding: 8px; background: var(--lav-50); border-radius: 12px; }
.qa-week { display: flex; gap: 8px; align-items: flex-start; font-size: .86rem; cursor: pointer; }
.qa-week input { accent-color: var(--pink-500); margin-top: 3px; }
.qa-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.qa-row .ed-field { min-width: 120px; }
.qa-row select { font: inherit; padding: 9px 12px; border: 1.5px solid var(--pink-200); border-radius: 10px; background: #fff; }
.qa-key { flex: 1; min-width: 220px !important; }
.qa-method { padding: 14px; border-radius: 14px; background: var(--pink-50); display: grid; gap: 8px; }
.qa-method h5 { margin: 0; font-size: .95rem; }
.qa-method p { margin: 0; }
.qa-method .btn { justify-self: start; }
.qa-method textarea { width: 100%; font: inherit; font-size: .88rem; padding: 10px 12px; border: 1.5px solid var(--pink-200); border-radius: 10px; }
.qa-status { margin: 0; font-weight: 600; color: var(--lav-600); min-height: 1.4em; }
.qa-list { display: grid; gap: 12px; margin-bottom: 12px; }
.qa-q { background: #fff; border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.qa-q-head { display: flex; justify-content: space-between; align-items: center; }
.qa-choices { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qa-choices legend { margin-bottom: 4px; color: var(--plum-700); font-weight: 700; }
.qa-choice { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; border-radius: 12px; background: var(--qc); }
.qa-choice input[type="radio"] { width: 18px; height: 18px; accent-color: #fff; flex-shrink: 0; }
.qa-choice .qz-shape { color: #fff; font-size: 1rem; }
.qa-choice input[type="text"] { flex: 1; min-width: 0; font: inherit; font-size: .92rem; padding: 7px 10px; border: 0; border-radius: 8px; background: rgba(255, 255, 255, .95); }
.qa-choice:has(input[type="radio"]:checked) { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--qc); }
.qa-time { max-width: 130px; }
.qa-exp { flex: 1; min-width: 200px; }

/* ==========================================================
   반응형
   ========================================================== */
@media (max-width: 1000px) {
  .grid-4, .grid-3, .quick-info, .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .enroll-grid { grid-template-columns: 1fr; }
  .slider-track { grid-auto-columns: calc((100% - 20px) / 2); }
  .calendar-wrap { grid-template-columns: 1fr; }
  .cal-detail { position: static; }
  .join-grid, .poll-body { grid-template-columns: 1fr; }
  .ap-cards { grid-template-columns: repeat(2, 1fr); }
  .ap-roster-add { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 860px) {
  .admin-backdrop { padding: 0; }
  .admin { height: 100%; max-height: none; border-radius: 0; }
  .admin-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .admin-tabs { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--lav-100); padding: 8px; scrollbar-width: none; }
  .admin-tabs::-webkit-scrollbar { display: none; }
  .admin-tabs button { padding: 8px 12px; font-size: .88rem; }
  .ed-layout { grid-template-columns: 1fr; }
  .ed-sec-list { display: none; }
  .ed-sec-select { display: block; width: 100%; font: inherit; padding: 10px 12px; border: 1.5px solid var(--pink-200); border-radius: 12px; background: #fff; }
  .ap-blocks { grid-template-columns: 1fr; }
}

@media (max-width: 860px) {
  .menu-toggle { display: block; }
  .nav {
    position: absolute;
    top: var(--header-h);
    left: 12px; right: 12px;
    flex-direction: column;
    gap: 4px;
    padding: 10px;
    background: rgba(255, 255, 255, .97);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-hover);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: opacity .2s, transform .2s, visibility .2s;
  }
  .nav.open { opacity: 1; visibility: visible; transform: none; }
  .nav a { padding: 13px 16px; font-size: 1rem; }
}

@media (max-width: 640px) {
  :root { --header-h: 60px; --radius: 20px; }
  .container { padding: 0 16px; }
  section { padding: 64px 0; }
  .hero { padding: 40px 0 64px; }
  .section-head { margin-bottom: 32px; }
  .card { padding: 22px; }
  .grid-4, .grid-3, .grid-2, .quick-info { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat-card { padding: 22px 10px; }
  .quick-info { margin-top: 40px; gap: 10px; }
  .info-list { grid-template-columns: 1fr; }
  .hero-actions .btn { flex: 1 1 140px; min-width: 0; padding: 14px 18px; }
  .slider { padding: 0; }
  .slider-track { grid-auto-columns: 86%; column-gap: 14px; }
  .slider-btn { display: none; }
  .sub-title { margin-top: 40px; }
  .weeks-head { margin-top: 40px; justify-content: center; }
  .week summary { grid-template-columns: 48px 1fr 16px; gap: 12px; padding: 14px 16px; }
  .week-no { width: 48px; height: 48px; border-radius: 14px; }
  .week-no strong { font-size: 1.2rem; }
  .week-badges { grid-column: 2 / 3; grid-row: 2; justify-content: flex-start; }
  .week summary::after { grid-column: 3; grid-row: 1; }
  .week-body { padding: 4px 16px 20px; }
  .week-meta div { flex-direction: column; gap: 0; }
  .week-cols { grid-template-columns: 1fr; }
  .asg-foot .btn { width: 100%; }
  .assignment { padding: 16px; }
  .calendar { padding: 16px 12px; }
  .cal-grid { gap: 3px; }
  .cal-cell { min-height: 54px; padding: 5px 3px; align-items: center; border-radius: 10px; }
  .cal-tag { font-size: .58rem; padding: 1px 4px; }
  .cal-dot { right: 4px; top: 5px; width: 6px; height: 6px; }
  .cal-cell.today .cal-num { margin: -3px 0 0; }
  .poll, .apply, .portal { padding: 22px 18px; }
  .poll-chart { padding: 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .att-grid { grid-template-columns: repeat(3, 1fr); }
  .att-today .btn { width: 100%; }
  .modal { padding: 30px 22px 18px; }
  .toasts { bottom: 80px; }
  .lock-btn { width: 40px; height: 40px; }
  .admin-panel { padding: 18px 16px 28px; }
  .admin-bar { padding: 10px 12px; }
  .admin-state { display: none; }
  .ap-cards, .ap-form, .ap-roster-add { grid-template-columns: 1fr; }
  .ed-bar { bottom: -28px; margin: 0 -16px -28px; padding: 10px 16px; }
  .ed-item-row { flex-wrap: wrap; }
  .notice-item summary { padding: 16px; }
  .notice-body { padding: 14px 16px 18px; }
  .quiz-card { padding: 22px 18px; }
  .quiz-join-grid { grid-template-columns: 1fr; }
  .qz-choices { grid-template-columns: 1fr; }
  .qz-choice { min-height: 64px; }
  .qh-lobby { grid-template-columns: 1fr; text-align: center; }
  .qh-qr svg { margin: 0 auto; }
  .qh-qrow { flex-direction: column-reverse; align-items: stretch; }
  .qh-time { width: 76px; height: 76px; align-self: center; }
  .qh-time b { width: 58px; height: 58px; font-size: 1.6rem; }
  .qh-tiles, .qa-choices { grid-template-columns: 1fr; }
  .qh-board li { grid-template-columns: 40px 1fr auto; font-size: 1rem; }
  .qh-gain { display: none; }
  .qh-pod-block { font-size: 1.6rem; }
  .qh-pod.p1 .qh-pod-block { height: 120px; } .qh-pod.p2 .qh-pod-block { height: 90px; } .qh-pod.p3 .qh-pod-block { height: 70px; }
  .footer { padding-top: 48px; }
  .footer .person { padding: 28px 22px; }
  .footer-bottom { flex-direction: column; text-align: center; }
  .footer-bottom p { text-align: center; }
  .person { grid-template-columns: 1fr; text-align: center; padding: 28px 22px; gap: 20px; }
  .avatar { width: 120px; height: 120px; font-size: 2.8rem; margin: 0 auto; }
  .contact { text-align: left; }
  .faq-item summary { padding: 18px 50px 18px 18px; }
  .faq-item summary::after { right: 20px; }
  .faq-answer { padding: 0 18px 20px 58px; }
  .logo-mark { width: 36px; height: 36px; font-size: 19px; }
  .to-top { right: 16px; bottom: 16px; width: 48px; height: 48px; }
}

/* ==========================================================
   디자인 개편 — 공공기관형 깔끔한 레이아웃 (참고 이미지 반영)
   흰 바탕 · 왼쪽 정렬 큰 제목 · 아이콘 바로가기 · 카드형 소식 ·
   색 띠 카드 넘기기 · 하단 안내 배너 · 흰 바닥글
   ========================================================== */
body {
  font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--bg);
  letter-spacing: -0.01em;
}
.petals { opacity: .5; }
.card { background: var(--card); border: 1px solid var(--card-border); }
.btn-primary { background: var(--pink-500); box-shadow: 0 10px 22px -12px rgba(47, 127, 30, .8); }
.btn-primary:hover { background: var(--pink-600); }
.btn-ghost { background: #fff; color: var(--text); border: 1.5px solid var(--line); }
.btn-ghost:hover { background: #fff; border-color: var(--plum-900); }
.btn-brown { background: #8a5a44; color: #fff; padding: 12px 22px; }
.btn-brown:hover { background: #714635; transform: translateY(-2px); }

/* 섹션 제목: 작은 강조 글씨 + 굵은 제목 */
.section-head { margin-bottom: 40px; }
.eyebrow { background: none; padding: 0; margin-bottom: 8px; letter-spacing: .1em; color: var(--accent); }
.section-head h2 { font-weight: 800; letter-spacing: -.03em; font-size: clamp(1.7rem, 3.4vw, 2.3rem); }
section.tint { background: #fff; }

/* 맨 위 작은 바로가기 줄 */
.util-bar { background: #fff; border-bottom: 1px solid var(--line); font-size: .8rem; color: var(--muted); position: relative; z-index: 51; }
.util-inner { display: flex; justify-content: space-between; align-items: center; min-height: 38px; gap: 12px; }
.util-links { display: flex; align-items: center; }
.util-links a { color: var(--muted); text-decoration: none; padding: 0 12px; border-left: 1px solid var(--line); }
.util-links a:first-child { padding-left: 0; border-left: 0; }
.util-links a:hover { color: var(--text); }
.util-right { display: flex; align-items: center; gap: 12px; }
.util-btn { background: var(--lav-600); color: #fff; text-decoration: none; padding: 4px 12px; border-radius: 999px; font-weight: 700; }
.util-btn:hover { background: #16604a; }
.util-links a:focus-visible, .util-btn:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; border-radius: 6px; }

/* 헤더: 흰 바탕 · 가운데 메뉴 · 밑줄 표시 */
.header { background: rgba(255, 255, 255, .97); border-bottom: 1px solid var(--line); }
.header.scrolled { background: #fff; box-shadow: 0 8px 22px -18px rgba(22, 35, 24, .45); }
.logo-mark { background: var(--pink-50); border: 1px solid var(--pink-100); }
.logo-text strong { font-size: 1.15rem; letter-spacing: -.02em; }
.nav { gap: 2px; }
.nav a { position: relative; border-radius: 0; padding: 10px 15px; font-size: 1rem; font-weight: 600; color: var(--text); }
.nav a:hover { background: none; color: var(--accent); }
.nav a.active { background: none; color: var(--accent); }
.nav a.active::after { content: ""; position: absolute; left: 15px; right: 15px; bottom: 2px; height: 2px; border-radius: 2px; background: var(--accent); }
.lock-btn { border: 0; background: transparent; color: var(--plum-700); }
/* 헤더 수강생 로그인 */
.hdr-user { position: relative; }
.hdr-user-btn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--pink-200); background: #fff; color: var(--plum-700); font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
.hdr-user-btn:hover { background: var(--pink-50); }
.hdr-user-btn.on { background: var(--pink-50); border-color: var(--pink-300, var(--pink-200)); }
.hdr-user-btn:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.hdr-user-label { max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
.hdr-pop { position: absolute; top: calc(100% + 10px); right: 0; z-index: 80; width: 300px; padding: 18px; background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 40px -16px rgba(22, 35, 24, .35); }
.hdr-pop[hidden] { display: none; }
.hdr-pop-title { margin: 0 0 12px; font-weight: 800; display: flex; flex-direction: column; }
