  /* ----- AI 요청문 ----- */
  function aiPrompt(panel) {
    var weeks = (window.Curriculum && window.Curriculum.weeks) || [];
    var picked = $$(".qa-weeks input:checked", panel).map(function (i) { return weeks[+i.value - 1]; }).filter(Boolean);
    var scope = picked.length
      ? picked.map(function (w) { return "- " + w.n + "주차 「" + w.data.title + "」: " + (w.data.topics || []).join(", "); }).join("\n")
      : "- 중국어 입문 전반 (발음·성조, 인사말, 자기소개, 숫자·날짜, 생활 회화)";
    var extra = ($("#qa-extra", panel).value || "").trim();
    var n = +$("#qa-n", panel).value || 5;
    var level = $("#qa-level", panel).value || "보통";
    return {
      n: n,
      text:
        "대학 교양 중국어 입문 수업에서 실시간 퀴즈로 쓸 4지선다 문제를 " + n + "개 만들어 주세요.\n\n" +
        "[수업] " + ((C.site && C.site.university) || "") + " 「" + ((C.site && C.site.courseName) || "교양중국어") + "」 — 중국어를 처음 배우는 대학생 대상, 한국어로 진행\n" +
        "[범위]\n" + scope + "\n" +
        (extra ? "[추가 요청] " + extra + "\n" : "") +
        "[난이도] " + level + "\n\n" +
        "규칙:\n" +
        "- 문제와 선택지는 한국어로 쓰고, 중국어는 간체자로 쓰며 필요하면 병음을 함께 적습니다.\n" +
        "- 선택지는 정확히 4개이고 정답은 하나입니다. 정답 위치는 문제마다 고르게 섞어 주세요.\n" +
        "- 학생이 휴대폰으로 빠르게 읽을 수 있도록 문제는 60자, 선택지는 25자 이내로 짧게 씁니다.\n" +
        "- 사실과 병음·성조 표기가 정확한지 꼭 확인하고, 애매하거나 정답이 둘인 문제는 만들지 않습니다.\n" +
        "- explanation에는 정답인 이유를 한두 문장으로 씁니다.\n" +
        "- answer는 정답 선택지의 번호입니다 (첫 번째 = 0).\n\n" +
        "답은 아래 JSON 형식으로만 주세요:\n" +
        '{"questions":[{"q":"문제","choices":["선택지1","선택지2","선택지3","선택지4"],"answer":0,"explanation":"해설"}]}'
    };
  }

  var SCHEMA = {
    type: "object",
    additionalProperties: false,
    required: ["questions"],
    properties: {
      questions: {
        type: "array",
        items: {
          type: "object",
          additionalProperties: false,
          required: ["q", "choices", "answer", "explanation"],
          properties: {
            q: { type: "string" },
            choices: { type: "array", items: { type: "string" } },
            answer: { type: "integer" },
            explanation: { type: "string" }
          }
        }
      }
    }
  };

  // Claude API 호출 (공식 TypeScript/JavaScript SDK를 브라우저에서 사용)
  async function askClaude(apiKey, prompt) {
    var mod = await import(SDK_URL);
    var Anthropic = mod.default || mod.Anthropic;
    var client = new Anthropic({ apiKey: apiKey, dangerouslyAllowBrowser: true });
    var res = await client.beta.messages.create({
      model: (Q && Q.aiModel) || "claude-opus-5-5",
      max_tokens: 16000,
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default", // 안전 분류기가 거절하면 서버가 다른 모델로 다시 시도
      system: "You write accurate, unambiguous multiple-choice quiz questions for a Korean university course that teaches beginner Mandarin Chinese. Write in Korean, use simplified Chinese characters, and double-check pinyin and tone marks.",
      messages: [{ role: "user", content: prompt }],
      output_config: { effort: "medium", format: { type: "json_schema", schema: SCHEMA } }
    });
    if (res.stop_reason === "refusal") throw new Error("AI가 이 요청에는 답하지 않았습니다. 범위나 추가 요청 문구를 바꿔 보세요.");
    if (res.stop_reason === "max_tokens") throw new Error("답이 너무 길어 잘렸습니다. 문제 수를 줄여 다시 시도해 주세요.");
    var text = res.content.filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("");
    return JSON.parse(text);
  }
  function aiErrorMessage(e) {
    var st = e && e.status;
    if (st === 401) return "API 키가 올바르지 않습니다. 키를 다시 확인해 주세요.";
    if (st === 403) return "이 API 키로는 사용할 수 없는 기능입니다. (권한 확인 필요)";
    if (st === 429) return "요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.";
    if (st === 400) return "요청이 거부되었습니다: " + ((e.error && e.error.error && e.error.error.message) || e.message);
    if (st >= 500) return "Anthropic 서버에 일시적인 문제가 있습니다. 잠시 후 다시 시도해 주세요.";
    if (e instanceof SyntaxError) return "AI 답을 읽지 못했습니다. 다시 시도해 주세요.";
    if (!st && /fetch|network|import|load/i.test(String(e && e.message))) return "인터넷 연결을 확인해 주세요. (AI 기능을 불러오지 못함)";
    return (e && e.message) || "알 수 없는 오류";
  }

  // AI 답을 퀴즈 문제 형식으로 정리 (잘못된 문제는 빼고 개수를 알려 줌)
  function normalize(data) {
    if (typeof data === "string") {
      var t = data.replace(/```(?:json)?/gi, "");
      var a = t.indexOf("{"), b = t.lastIndexOf("}");
      data = JSON.parse(a >= 0 && b > a ? t.slice(a, b + 1) : t);
    }
    var arr = Array.isArray(data) ? data : (data && data.questions) || [];
    var ok = [], bad = 0;
    arr.forEach(function (x) {
      var ch = (x && x.choices || []).map(function (c) { return String(c).trim(); }).filter(Boolean);
      var ans = Math.floor(+x.answer);
      if (!x || !String(x.q || "").trim() || ch.length !== 4 || !(ans >= 0 && ans < 4)) { bad++; return; }
      ok.push({ q: String(x.q).trim(), choices: ch, answer: ans, time: (Q && Q.defaultTime) || 20, explanation: String(x.explanation || "").trim() });
    });
    return { list: ok, bad: bad };
  }

  function readEditor(panel) {
    var s = QA.editing;
    var t = $("#qa-title", panel);
    if (t) s.title = t.value;
    $$(".qa-q", panel).forEach(function (el) {
      var q = s.questions[+el.dataset.i];
      if (!q) return;
      q.q = $('[data-f="q"]', el).value;
      for (var k = 0; k < 4; k++) q.choices[k] = $('[data-f="c' + k + '"]', el).value;
      var r = $('[data-f="answer"]:checked', el);
      q.answer = r ? +r.value : 0;
      q.time = Math.max(5, Math.min(120, +$('[data-f="time"]', el).value || 20));
      q.explanation = $('[data-f="explanation"]', el).value;
    });
  }

  function qaAfter(panel, ctx) {
    var root = $(".qa", panel);
    if (!root) return;
    function rerender() { var y = panel.scrollTop; panel.innerHTML = qaRender(); qaAfter(panel, ctx); panel.scrollTop = y; }
    function status(msg) { QA.status = msg; var p = $(".qa-status", panel); if (p) p.textContent = msg; }
    function addGenerated(res) {
      readEditor(panel);
      QA.editing.questions = QA.editing.questions.filter(function (q) { return q.q.trim() || q.choices.some(Boolean); }).concat(res.list);
      QA.status = res.list.length + "문제를 받았습니다." + (res.bad ? " (형식이 맞지 않는 " + res.bad + "문제는 뺐습니다)" : "") + " 내용을 꼭 확인한 뒤 저장하세요.";
      rerender();
    }

    root.addEventListener("click", function (e) {
      var b = e.target.closest("[data-qa]");
      if (!b || b.disabled) return;
      var a = b.dataset.qa, i = +b.dataset.i;
      if (a === "new") { QA.editing = { _new: true, id: "s" + Date.now().toString(36), title: "", questions: [] }; QA.status = ""; rerender(); }
      else if (a === "edit") {
        var s = sets().filter(function (x) { return x.id === b.dataset.id; })[0];
        QA.editing = JSON.parse(JSON.stringify(s)); QA.status = ""; rerender();
      }
      else if (a === "del") {
        if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "정말 삭제?"; return; }
        var cfg = JSON.parse(JSON.stringify(C));
        cfg.quiz.sets = cfg.quiz.sets.filter(function (x) { return x.id !== b.dataset.id; });
        ctx.saveOverride(cfg, "quiz");
      }
      else if (a === "run") { ctx.close(); setTimeout(function () { hostOpen(b.dataset.id); }, 250); }
      else if (a === "csv") { var r = store.get("quiz:results", [])[i]; if (r) downloadCsv(r); }
      else if (a === "cancel") { QA.editing = null; QA.status = ""; rerender(); }
      else if (a === "addq") { readEditor(panel); QA.editing.questions.push(blankQ()); rerender(); }
      else if (a === "rmq") { readEditor(panel); QA.editing.questions.splice(i, 1); rerender(); }
      else if (a === "up" || a === "down") {
        readEditor(panel);
        var qs = QA.editing.questions, j = a === "up" ? i - 1 : i + 1;
        if (j >= 0 && j < qs.length) { var tmp = qs[i]; qs[i] = qs[j]; qs[j] = tmp; }
        rerender();
      }
      else if (a === "copy") {
        var pr = aiPrompt(panel).text;
        (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(pr) : Promise.reject())
          .then(function () { status("요청문을 복사했습니다. AI 채팅에 붙여넣으세요."); })
          .catch(function () { $("#qa-paste", panel).value = pr; status("자동 복사가 안 되어 아래 칸에 요청문을 넣었습니다. 직접 복사해 주세요."); });
      }
      else if (a === "paste") {
        try {
          var res = normalize($("#qa-paste", panel).value);
          if (!res.list.length) { status("불러올 수 있는 문제가 없습니다. AI 답 전체(JSON)를 붙여넣었는지 확인해 주세요."); return; }
          addGenerated(res);
        } catch (err) { status("붙여넣은 내용을 읽지 못했습니다. AI 답의 { 부터 } 까지 전부 붙여넣어 주세요."); }
      }
      else if (a === "ai") {
        var key = $("#qa-key", panel).value.trim();
        if (!key) { status("API 키를 입력해 주세요. (키가 없으면 방법 2를 쓰세요)"); $("#qa-key", panel).focus(); return; }
        try {
          sessionStorage.setItem("kcn:quiz:apikey", key);
          if ($("#qa-remember", panel).checked) localStorage.setItem("kcn:quiz:apikey", key);
          else localStorage.removeItem("kcn:quiz:apikey");
        } catch (err) { /* 무시 */ }
        var p = aiPrompt(panel);
        QA.busy = true;
        readEditor(panel);
        QA.status = "Claude가 " + p.n + "문제를 만드는 중입니다… (보통 10~40초)";
        rerender();
        askClaude(key, p.text).then(function (data) {
          QA.busy = false;
          var res2 = normalize(data);
          if (!res2.list.length) { QA.status = "쓸 수 있는 문제를 받지 못했습니다. 다시 시도해 주세요."; rerender(); return; }
          addGenerated(res2);
        }).catch(function (err) {
          QA.busy = false;
          QA.status = "⚠️ " + aiErrorMessage(err);
          rerender();
        });
      }
      else if (a === "save") {
        readEditor(panel);
        var s2 = QA.editing, err2 = $(".qa-err", panel);
        if (!s2.title.trim()) { err2.textContent = "퀴즈 제목을 입력해 주세요."; $("#qa-title", panel).focus(); return; }
        if (!s2.questions.length) { err2.textContent = "문제를 하나 이상 넣어 주세요."; return; }
        for (var k = 0; k < s2.questions.length; k++) {
          var q = s2.questions[k];
          if (!q.q.trim() || q.choices.some(function (c) { return !String(c).trim(); })) {
            err2.textContent = "Q" + (k + 1) + "의 문제나 선택지가 비어 있습니다.";
            var el = $('.qa-q[data-i="' + k + '"]', panel); if (el) el.scrollIntoView({ block: "center" });
            return;
          }
        }
        var cfg2 = JSON.parse(JSON.stringify(C));
        var clean = { id: s2.id, title: s2.title.trim(), questions: s2.questions.map(function (x) {
          return { q: x.q.trim(), choices: x.choices.map(function (c) { return String(c).trim(); }), answer: +x.answer, time: +x.time || 20, explanation: (x.explanation || "").trim() };
        }) };
        var idx = cfg2.quiz.sets.map(function (x) { return x.id; }).indexOf(clean.id);
        if (idx >= 0) cfg2.quiz.sets[idx] = clean; else cfg2.quiz.sets.push(clean);
        QA.editing = null; QA.status = "";
        ctx.saveOverride(cfg2, "quiz");
      }
    });
  }

  window.QuizAdmin = { render: qaRender, after: qaAfter };
})();

/* ######################################################## main */
/* ==========================================================
   화면 구성 스크립트
   맨 위 설정(window.SITE_CONFIG)의 내용을 읽어 페이지를 그립니다.
   내용을 바꾸려면 이 코드가 아니라 맨 위 설정 부분을 고치세요.
   ========================================================== */
(function () {
  "use strict";

  var C = window.SITE_CONFIG;
  if (!C) {
    document.getElementById("main").innerHTML =
      '<p style="padding:40px;text-align:center">설정(SITE_CONFIG)을 읽지 못했습니다. index.html 맨 위 설정 부분의 쉼표·따옴표를 확인해 주세요.</p>';
    return;
  }

  /* ---------- 도우미 ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function list(arr, fn) { return (arr || []).map(fn).join(""); }
  function head(sec) {
    return (
      '<div class="section-head reveal">' +
      (sec.eyebrow ? '<span class="eyebrow">' + esc(sec.eyebrow) + "</span>" : "") +
      "<h2>" + esc(sec.title) + "</h2>" +
      (sec.lead ? "<p>" + esc(sec.lead) + "</p>" : "") +
      "</div>"
    );
  }
  function section(id, inner, cls) {
    return '<section id="' + esc(id) + '"' + (cls ? ' class="' + cls + '"' : "") + '><div class="container">' + inner + "</div></section>";
  }

  /* ---------- 섹션별 화면 ---------- */
  var render = {
    hero: function (h) {
      var applyHref = h.applyUrl ? esc(h.applyUrl) : (C.participate ? "#apply" : "#enroll");
      var applyExtra = h.applyUrl ? ' target="_blank" rel="noopener"' : "";
      var info = list(h.quickInfo, function (q) {
        return (
          '<div class="qi card">' +
            '<span class="qi-icon" aria-hidden="true">' + esc(q.icon) + "</span>" +
            '<div><dt>' + esc(q.label) + "</dt><dd>" + esc(q.value) + "</dd></div>" +
          "</div>"
        );
      });
      return (
        '<section class="hero" id="top"><div class="container">' +
          '<div class="hero-main reveal">' +
            (h.badge ? '<span class="hero-badge">' + esc(h.badge) + "</span>" : "") +
            '<h1><span class="grad-text">' + esc(h.title) + "</span>" +
              (h.titleZh ? '<span class="zh hero-zh">' + esc(h.titleZh) + "</span>" : "") + "</h1>" +
            (h.subtitle ? '<p class="hero-sub">' + esc(h.subtitle) + "</p>" : "") +
            '<p class="hero-desc">' + esc(h.description) + "</p>" +
            '<div class="hero-actions">' +
              '<a class="btn btn-primary" href="' + applyHref + '"' + applyExtra + ">" + esc(h.applyLabel || "수강 신청") + "</a>" +
              '<a class="btn btn-ghost" href="#curriculum">' + esc(h.curriculumLabel || "커리큘럼 보기") + "</a>" +
            "</div>" +
          "</div>" +
          (info ? '<dl class="quick-info reveal">' + info + "</dl>" : "") +
        "</div></section>"
      );
    },

    stats: function (stats) {
      var items = list(stats, function (s) {
        var v = s.value;
        if (v === "auto:tools") v = ((C.tools && C.tools.items) || []).length;
        var n = parseInt(v, 10);
        return (
          '<div class="stat-card card lift reveal">' +
            '<strong><span class="count" data-to="' + (isNaN(n) ? "" : n) + '">' + esc(v) + "</span>" +
            (s.suffix ? "<small>" + esc(s.suffix) + "</small>" : "") + "</strong>" +
            "<span>" + esc(s.label) + "</span>" +
          "</div>"
        );
      });
      return '<section class="stats-section" aria-label="강의 한눈에 보기"><div class="container"><div class="stats-grid">' + items + "</div></div></section>";
    },

    about: function (a) {
      var slides = list(a.slides, function (s, i) {
        return (
          '<article class="slide card" role="group" aria-roledescription="slide" aria-label="' + (i + 1) + " / " + a.slides.length + '">' +
            '<span class="slide-num">' + String(i + 1).padStart(2, "0") + "</span>" +
            '<div class="feature-icon" aria-hidden="true">' + esc(s.icon) + "</div>" +
            "<h3>" + esc(s.title) + "</h3><p>" + esc(s.text) + "</p>" +
          "</article>"
        );
      });
      var dots = list(a.slides, function (s, i) {
        return '<button type="button" class="dot" aria-label="' + (i + 1) + '번째 장점 보기"></button>';
      });
      return section("about",
        head(a) +
        '<div class="slider reveal" aria-roledescription="carousel" aria-label="' + esc(a.title) + '">' +
          '<button type="button" class="slider-btn prev" aria-label="이전">' + arrow("left") + "</button>" +
          '<div class="slider-track" tabindex="0">' + slides + "</div>" +
          '<button type="button" class="slider-btn next" aria-label="다음">' + arrow("right") + "</button>" +
          '<div class="slider-dots">' + dots + "</div>" +
        "</div>"
      );
    },

    curriculum: function (c) {
      if (window.Curriculum) return window.Curriculum.render(c); // js/curriculum.js
      var phases = list(c.phases, function (p, i) {
        return (
          '<article class="card lift phase reveal" data-step="' + String(i + 1).padStart(2, "0") + '">' +
          '<span class="phase-weeks">' + esc(p.weeks) + "</span>" +
          "<h3>" + esc(p.title) + "</h3><ul>" + list(p.items, function (it) { return "<li>" + esc(it) + "</li>"; }) + "</ul></article>"
        );
      });
      return section("curriculum", head(c) + '<div class="grid grid-4">' + phases + "</div>");
    },

    tools: function (t) {
      var items = list(t.items, function (it) {
        return (
          '<article class="card lift tool reveal">' +
            '<div class="tool-top"><span class="tool-icon" aria-hidden="true">' + esc(it.icon) + "</span>" +
            '<span class="tool-tag">' + esc(it.use) + "</span></div>" +
            "<h3>" + esc(it.name) + "</h3><p>" + esc(it.text) + "</p>" +
          "</article>"
        );
      });
      return section("tools", head(t) + '<div class="grid grid-3">' + items + "</div>", "tint");
    },

    enroll: function (e) {
      var info = list(e.info, function (i) {
        return '<div class="info-item"><dt>' + esc(i.label) + "</dt><dd>" + esc(i.value) + "</dd></div>";
      });
      var g = e.grading || { items: [] };
      var grades = list(g.items, function (r) {
        var pct = Math.max(0, Math.min(100, Number(r.percent) || 0));
        return (
          '<div class="grade-row"><div class="grade-label"><span>' + esc(r.label) + "</span><strong>" + pct + "%</strong></div>" +
          '<div class="grade-bar" role="img" aria-label="' + esc(r.label) + " " + pct + '%"><span style="width:' + pct + '%"></span></div></div>'
        );
      });
      var prep = e.prep
        ? '<h3 class="sub-title reveal">' + esc(e.prep.title || "수강 준비물") + "</h3>" +
          '<div class="grid grid-4">' + list(e.prep.items, function (p) {
            return (
              '<article class="card prep reveal">' +
                '<span class="prep-icon" aria-hidden="true">' + esc(p.icon) + "</span>" +
                "<h4>" + esc(p.name) + "</h4><p>" + esc(p.text) + "</p>" +
              "</article>"
            );
          }) + "</div>"
        : "";
      return section("enroll",
        head(e) +
        '<div class="enroll-grid">' +
          '<div class="card reveal"><h3>강의 정보</h3><dl class="info-list">' + info + "</dl></div>" +
          '<div class="card reveal"><h3>' + esc(g.title || "평가 방법") + "</h3>" + grades + "</div>" +
        "</div>" +
        prep +
        (e.notice ? '<div class="notice reveal">' + esc(e.notice) + "</div>" : "")
      );
    },

    notices: function (n) {
      // 고정 → 최신 순
      var items = (n.items || []).slice().sort(function (a, b) {
        if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;

  var header = document.querySelector(".header");

  function pageTop(el) { return el.getBoundingClientRect().top + window.scrollY; }
  function onScroll() {
    var y = window.scrollY;

    toTop.classList.toggle("show", y > 500);

    var current = "";
    var line = y + header.offsetHeight + window.innerHeight * 0.3;
    targets.forEach(function (s) { if (pageTop(s) <= line) current = s.id; });
    if (window.innerHeight + y >= document.documentElement.scrollHeight - 4 && targets.length) {
      current = targets[targets.length - 1].id; // 페이지 끝에서는 마지막 메뉴
    }

  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  toTop.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });

  /* ---------- 장점 슬라이드 ---------- */
  document.querySelectorAll(".slider").forEach(function (slider) {
    var track = slider.querySelector(".slider-track");
    var slides = track.querySelectorAll(".slide");
    var dots = slider.querySelectorAll(".dot");
    var prev = slider.querySelector(".prev");
    var next = slider.querySelector(".next");

    function step() {
      var gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return slides[0] ? slides[0].offsetWidth + gap : track.clientWidth;
    }
    function index() { return Math.round(track.scrollLeft / step()); }
    function goTo(i) {
      var max = slides.length - 1;
      track.scrollTo({ left: Math.max(0, Math.min(max, i)) * step(), behavior: "smooth" });
    }
    function update() {
      var i = index();
      var atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
      if (atEnd) i = slides.length - 1;
      dots.forEach(function (d, k) {
        d.classList.toggle("active", k === i);
        d.setAttribute("aria-current", k === i ? "true" : "false");
      });
      prev.disabled = track.scrollLeft <= 4;
      next.disabled = atEnd;
    }

    prev.addEventListener("click", function () { goTo(index() - 1); });
    next.addEventListener("click", function () { goTo(index() + 1); });
    dots.forEach(function (d, k) { d.addEventListener("click", function () { goTo(k); }); });
    track.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { e.preventDefault(); goTo(index() - 1); }
      if (e.key === "ArrowRight") { e.preventDefault(); goTo(index() + 1); }
    });
    var t;
    track.addEventListener("scroll", function () { clearTimeout(t); t = setTimeout(update, 60); }, { passive: true });
    window.addEventListener("resize", update);
    update();
  });

  /* ---------- 숫자 올라가는 효과 ---------- */
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function countUp(el) {
    var to = parseInt(el.dataset.to, 10);
    if (isNaN(to) || reduce) return;
    var start = null, dur = 1200;
    function tick(ts) {
      if (!start) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    }
    el.textContent = "0";
    requestAnimationFrame(tick);
  }

  /* ---------- 스크롤 등장 효과 ---------- */
  var reveals = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add("in");
        en.target.querySelectorAll(".count").forEach(countUp);
        io.unobserve(en.target);
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    reveals.forEach(function (el) { io.observe(el); });
  } else {
    reveals.forEach(function (el) { el.classList.add("in"); });
  }

  /* ---------- 꽃잎 ---------- */
  if (!reduce) {
    var box = document.querySelector(".petals");
    var count = window.innerWidth < 640 ? 8 : 16;
    for (var i = 0; i < count; i++) {
      var p = document.createElement("span");
      p.className = "petal";
      var size = 8 + Math.random() * 10;
      p.style.left = Math.random() * 100 + "%";
      p.style.width = size + "px";
      p.style.height = size * 0.8 + "px";
      p.style.animationDuration = 10 + Math.random() * 12 + "s";
      p.style.animationDelay = -Math.random() * 20 + "s";
      p.style.opacity = (0.35 + Math.random() * 0.45).toFixed(2);
      p.style.setProperty("--drift", (Math.random() * 160 - 60).toFixed(0) + "px");
      box.appendChild(p);
    }
  }
})();

/* ######################################################## welcome */
/* ==========================================================
   첫 방문 환영 효과 · 수강 신청 안내 팝업
   설정은 설정(SITE_CONFIG)의 welcome / popup 에서 고칩니다.
   ========================================================== */
(function () {
  "use strict";

  var C = window.SITE_CONFIG || {};
  var store = window.SiteStore || { get: function (k, d) { return d; }, set: function () {} };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  // 팝업 '오늘 하루 보지 않기'는 실제 날짜 기준
  function realDayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  /* ---------- 폭죽 ---------- */
  var COLORS = ["#f7a6c4", "#e86a9a", "#fcc8db", "#a78bfa", "#d9cbff", "#7c5cc4", "#ffd479", "#ffffff"];

  function burst(power) {
    if (reduce) return;
    power = power || 1;
    var cv = document.createElement("canvas");
    cv.className = "confetti";
    cv.setAttribute("aria-hidden", "true");
    document.body.appendChild(cv);
    var ctx = cv.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.scale(dpr, dpr);

    var parts = [];
    var count = Math.round((W < 640 ? 90 : 160) * power);
    // 양쪽 아래에서 위로 쏘아 올리기 + 가운데 위에서 한 번
    function shoot(x, y, angle, spread, n, speed) {
      for (var i = 0; i < n; i++) {
        var a = angle + (Math.random() - 0.5) * spread;
        var v = speed * (0.55 + Math.random() * 0.6);
        parts.push({
          x: x, y: y,
          vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          size: 5 + Math.random() * 7,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          shape: Math.random() < 0.35 ? "petal" : Math.random() < 0.5 ? "circle" : "rect",
          life: 0
        });
      }
    }
    var sp = Math.min(W, H) * 0.028 + 9;
    shoot(0, H * 0.85, -Math.PI / 3, 0.7, count * 0.4, sp);
    shoot(W, H * 0.85, -Math.PI * 2 / 3, 0.7, count * 0.4, sp);
    shoot(W / 2, H * 0.35, -Math.PI / 2, Math.PI * 1.6, count * 0.2, sp * 0.6);

    var start = performance.now();
    function frame(t) {
      var el = t - start;
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.vy += 0.28;
        p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy;
        p.rot += p.vr;
        var alpha = el > 2600 ? Math.max(0, 1 - (el - 2600) / 900) : 1;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.shape === "circle") { ctx.beginPath(); ctx.arc(0, 0, p.size / 2.4, 0, Math.PI * 2); ctx.fill(); }
        else if (p.shape === "petal") {
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 0.7, p.size * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();
        } else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      });
      if (el < 3500) requestAnimationFrame(frame);
      else cv.remove();
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 안내 팝업 ---------- */
  var lastFocus = null;

  function openPopup() {
    var p = C.popup;
    if (!p || !p.enabled || document.querySelector(".modal-backdrop")) return;
    lastFocus = document.activeElement;
    var wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">' +
        '<button type="button" class="modal-x" aria-label="닫기">×</button>' +
        '<div class="modal-deco" aria-hidden="true">🌸</div>' +
        (p.badge ? '<span class="eyebrow">' + esc(p.badge) + "</span>" : "") +
        '<h2 id="modal-title">' + esc(p.title) + "</h2>" +
        '<ul class="modal-lines">' + (p.lines || []).map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>" +
        '<a class="btn btn-primary modal-go" href="#' + esc(p.target || "apply") + '">' + esc(p.button || "자세히 보기") + "</a>" +
        '<div class="modal-foot">' +
          '<label class="check small"><input type="checkbox" class="modal-today"><span>오늘 하루 보지 않기</span></label>' +
          '<button type="button" class="link-btn modal-close">닫기</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(wrap);
    document.body.classList.add("modal-open");
    requestAnimationFrame(function () { wrap.classList.add("show"); });
    var modal = wrap.querySelector(".modal");
    modal.focus();

    function close() {
      if (wrap.querySelector(".modal-today").checked) store.set("popup:hideDay", realDayKey());
      wrap.classList.remove("show");
      document.body.classList.remove("modal-open");
      document.removeEventListener("keydown", onKey);
      setTimeout(function () { wrap.remove(); }, 250);
      if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    }
    function onKey(e) {
      if (e.key === "Escape") close();
      if (e.key === "Tab") {
        // 포커스가 팝업 밖으로 나가지 않게
        var f = modal.querySelectorAll("button, a, input");
        var first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === first || document.activeElement === modal)) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener("keydown", onKey);
    wrap.addEventListener("click", function (e) {
      if (e.target === wrap || e.target.closest(".modal-x, .modal-close")) close();
      if (e.target.closest(".modal-go")) { lastFocus = null; close(); }
    });
  }

  /* ---------- 시작 ---------- */
  function init() {
    var first = !store.get("visited", false);
    store.set("visited", true);
    var w = C.welcome || {};
    if (first) {
      if (w.confetti !== false) setTimeout(function () { burst(1); }, 400);
      if (w.message && window.showToast) setTimeout(function () { window.showToast(w.message, "ok"); }, 600);
    }
    var p = C.popup;
    var admin = false;
    try { admin = sessionStorage.getItem("kcn:admin") === "1"; } catch (e) { /* 무시 */ }
    if (p && p.enabled && !admin && store.get("popup:hideDay", "") !== realDayKey()) {
      setTimeout(openPopup, (p.delaySec != null ? p.delaySec : 2.5) * 1000);
    }
  }

  window.Welcome = { burst: burst, openPopup: openPopup };
  init();
})();

/* ######################################################## admin */
/* ==========================================================
   관리자 화면
   - 오른쪽 위 자물쇠 → 비밀번호 확인 (해시값 비교, 원문은 코드에 없음)
   - 사이트 편집 · 공지 · 수강생 명단 · 신청/출석/과제 내역 · 설정 파일
   ※ 이 화면은 정적 사이트를 편하게 고치기 위한 도구입니다.
     서버가 없으므로 강력한 보안 장치는 아닙니다. (README 참고)
   ========================================================== */
(function () {
  "use strict";

  var C = window.SITE_CONFIG || {};
  var FILE_CFG = window.SITE_CONFIG_FILE || C;
  var store = window.SiteStore || { get: function (k, d) { return d; }, set: function () {}, del: function () {} };

  var sha = window.sha256;

  function esc(s) {

      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function list(arr, fn) { return (arr || []).map(fn).join(""); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function realToday() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function stamp(iso) {
    if (!iso) return "";
    var d = new Date(iso);

  }
  function fmtSize(b) { return b >= 1048576 ? (b / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round((b || 0) / 1024)) + "KB"; }

  /* ---------- 세션 ---------- */
  var SESSION = "kcn:admin";
  function ss(k, v) {
    try {
      if (v === undefined) return sessionStorage.getItem(k);
      if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v);
    } catch (e) { return null; }
  }
  function isAdmin() { return ss(SESSION) === "1"; }
  function hashPw(pw) { return sha(((C.admin && C.admin.salt) || "") + ":" + pw); }

  var lockBtn = $(".lock-btn");
  function updateLock() {
    if (window.Quiz) window.Quiz.refreshHostPanel(); // 진행자 모드 표시/숨김

  }

  /* ---------- 저장소 훑기 ---------- */
  function keys(prefix) {
    var out = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf("kcn:" + prefix) === 0) out.push(k.slice(4));
      }
    } catch (e) { /* 무시 */ }
    return out;
  }
  function roster() { return store.get("admin:roster", []); }
  function people() {
    var map = {};
    roster().forEach(function (r) { map[r.id] = r.name; });
    var p = store.get("people", {});
    Object.keys(p).forEach(function (id) { if (!map[id]) map[id] = p[id]; });
    return map;
  }

  /* ---------- 파일 내려받기 ---------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);

    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function modal(html, onMount) {
    var last = document.activeElement;
    var wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" tabindex="-1">' +
      '<button type="button" class="modal-x" aria-label="닫기">×</button>' + html + "</div>";
    document.body.appendChild(wrap);
    document.body.classList.add("modal-open");
    requestAnimationFrame(function () { wrap.classList.add("show"); });
    var box = $(".modal", wrap);
    function close(keepScrollLock) {
      wrap.classList.remove("show");
      if (!keepScrollLock) document.body.classList.remove("modal-open");
      document.removeEventListener("keydown", onKey);
      setTimeout(function () { wrap.remove(); }, 220);
      if (last && last.focus && !keepScrollLock) last.focus({ preventScroll: true });
    }
    function onKey(e) {
      if (e.key === "Escape") close();
      if (e.key === "Tab") {
        var f = $$("button, a, input, select, textarea", box);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    }
    document.addEventListener("keydown", onKey);
    wrap.addEventListener("click", function (e) { if (e.target === wrap || e.target.closest(".modal-x")) close(); });
    if (onMount) onMount(box, close);
    return close;
  }

          if (!C.admin || !C.admin.passwordHash || !sha) { err.textContent = "관리자 비밀번호가 설정되어 있지 않습니다. (설정(SITE_CONFIG)의 admin)"; return; }

          if (hashPw(input.value) === C.admin.passwordHash) {
            ss(SESSION, "1");
            ss("kcn:admin:fails", null);
            updateLock();
            close(true);
            setTimeout(function () { openAdmin(); }, 230);

  function applyRows() {

  function classEnd(w) {
    var m = /(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/.exec(w.time || "");
    var d = w.date;
    return m ? new Date(d.getFullYear(), d.getMonth(), d.getDate(), +m[3], +m[4]) : new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59);
  }
  function attMatrix() {
    var map = people();
    keys("att:").forEach(function (k) { var id = k.slice(4); if (!map[id]) map[id] = "(이름 미상)"; });
    var now = CU.now ? CU.now() : new Date();
    return Object.keys(map).sort().map(function (id) {
      var recs = store.get("att:" + id, {});
      var t = { p: 0, l: 0, a: 0 };
      var cells = WEEKS.map(function (w) {
        var r = recs[w.n];
        if (r) { r.late ? t.l++ : t.p++; return r.late ? "지각" : "출석"; }
        if (now > classEnd(w)) { t.a++; return "결석"; }
        return "-";
      });
      var held = t.p + t.l + t.a;
      return { id: id, name: map[id], cells: cells, t: t, rate: held ? Math.round(((t.p + t.l) / held) * 100) : 0 };
    });
  }
  function subRows() {
    var map = people();
    var rows = [];
    keys("sub:").forEach(function (k) {

      ctrl = (LONG.test(key) || s.length > 60 || s.indexOf("\n") >= 0)
        ? '<textarea id="' + id + '" rows="3" data-path="' + p + '"' + aria + ">" + esc(s) + "</textarea>"
        : '<input type="text" id="' + id + '" data-path="' + p + '" value="' + esc(s) + '"' + aria + ">";
    }
    return '<div class="ed-field">' + (lab ? '<label for="' + id + '">' + lab + "</label>" : "") + ctrl + rm + "</div>";
  }
  function optionalKeys(arr, shape) {
    var o = {};
    Object.keys(shape).forEach(function (k) {
      if (arr.some(function (it) { return !it || typeof it !== "object" || !(k in it); })) o[k] = 1;
    });
    return o;
  }

  RENDER.edit = function () {
    var sec = st.section;
    var val = st.draft[sec];
    var body = val === undefined
      ? '<p class="ap-empty">이 섹션 설정이 없습니다.</p>'
      : (Array.isArray(val) || typeof val !== "object" ? editor(val, [sec], LABELS[sec] || sec) : editor(val, [sec], null));
    return head("사이트 편집", "칸을 고친 뒤 <b>적용하기</b>를 누르면 이 브라우저에서 바로 바뀐 모습을 볼 수 있습니다. " +
        "모든 방문자에게 반영하려면 <b>설정 파일</b> 탭에서 index.html을 저장해 올리세요.") +
      '<div class="ed-layout">' +
        '<div class="ed-sections"><label class="sr-only" for="ed-sec">편집할 섹션</label>' +
          '<select id="ed-sec" class="ed-sec-select">' + list(SECTIONS, function (s) {
            return '<option value="' + s[0] + '"' + (s[0] === sec ? " selected" : "") + ">" + s[1] + "</option>";
          }) + "</select>" +
          '<div class="ed-sec-list">' + list(SECTIONS, function (s) {
            return '<button type="button" data-sec="' + s[0] + '" class="' + (s[0] === sec ? "on" : "") + '">' + s[1] + "</button>";
          }) + "</div>" +
        "</div>" +
        '<div class="ed-form">' + body + "</div>" +
      "</div>" +
      '<div class="ed-bar">' +
        '<span class="ed-dirty">' + (st.dirty ? "● 적용하지 않은 변경 있음" : "변경 없음") + "</span>" +
        '<button type="button" class="btn btn-ghost btn-sm" data-a="revert"' + (st.dirty ? "" : " disabled") + ">되돌리기</button>" +
        '<button type="button" class="btn btn-primary btn-sm" data-a="apply-edit"' + (st.dirty ? "" : " disabled") + ">적용하기</button>" +
      "</div>";
  };
  function setDirty(v) {
    st.dirty = v;
    var d = $(".ed-dirty", root);
    if (d) d.textContent = v ? "● 적용하지 않은 변경 있음" : "변경 없음";
    $$('[data-a="revert"], [data-a="apply-edit"]', root).forEach(function (b) { b.disabled = !v; });
  }
  function rerenderEdit() {
    var form = $(".ed-form", root);
    var y = form ? form.scrollTop : 0, py = $(".admin-panel", root).scrollTop;
    show("edit");
    var f2 = $(".ed-form", root);
    if (f2) f2.scrollTop = y;
    $(".admin-panel", root).scrollTop = py;
  }
  function arrOp(btn) {
    var path = JSON.parse(btn.dataset.path);
    var op = btn.dataset.op;
    if (op === "rmkey") {
      var parent = getPath(st.draft, path.slice(0, -1));
      delete parent[path[path.length - 1]];
    } else if (op === "addkey") {
      var obj = getPath(st.draft, path);
      var arrPath = path.slice(0, -1);
      var shape = shapeOf(getPath(st.draft, arrPath));
      obj[btn.dataset.k] = blankLike(shape[btn.dataset.k]);
    } else {
      var arr = getPath(st.draft, path);
      var i = +btn.dataset.i;
      if (op === "add") {
        var tpl = arr.length ? blankLike(arr[arr.length - 1]) : (path[path.length - 1] === "videos" ? { title: "", url: "" } : "");
        // 선택 항목(예: 과제)은 새 항목에 넣지 않음
        if (tpl && typeof tpl === "object" && !Array.isArray(tpl)) {
          var opt = optionalKeys(arr, shapeOf(arr));
          Object.keys(opt).forEach(function (k) { delete tpl[k]; });
        }
        arr.push(tpl);
        st.open[JSON.stringify(path.concat(arr.length - 1))] = true;
      }
      if (op === "del") arr.splice(i, 1);
      if (op === "up" && i > 0) arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
      if (op === "down" && i < arr.length - 1) arr.splice(i + 1, 0, arr.splice(i, 1)[0]);
    }
    setDirty(true);
    rerenderEdit();
  }

  /* ----- 퀴즈 (js/quiz.js의 QuizAdmin) ----- */
  RENDER.quiz = function () {
    return window.QuizAdmin ? window.QuizAdmin.render() : '<p class="ap-empty">퀴즈 기능(js/quiz.js)을 불러오지 못했습니다.</p>';
  };
  AFTER.quiz = function (panel) {
    if (window.QuizAdmin) window.QuizAdmin.after(panel, { saveOverride: saveOverride, close: function () { st.dirty = false; closeAdmin(); } });
  };

  /* ----- 설정 파일 ----- */
  RENDER.file = function () {
    var saved = window.SITE_CONFIG_OVERRIDDEN && C._savedAt ? stamp(C._savedAt) : "";
    return head("설정 파일", "고친 설정을 담은 index.html을 저장하거나, 저장해 둔 파일에서 설정을 다시 불러옵니다.") +
      '<div class="ap-blocks">' +
        '<div class="ap-block"><h4>💾 설정 저장 (index.html)</h4>' +
          '<p class="small">지금 적용된 설정(사이트 편집에서 「적용하기」까지 누른 내용)이 들어간 <b>index.html</b>을 내려받습니다. 이 파일로 사이트의 index.html을 바꿔 올리면 모든 방문자에게 반영됩니다.</p>' +
          '<button type="button" class="btn btn-primary btn-sm" data-a="export">index.html 내려받기</button></div>' +
        '<div class="ap-block"><h4>📂 설정 불러오기</h4>' +
          '<p class="small">전에 저장한 index.html(또는 예전 config.js·.json)을 고르면 그 안의 설정이 이 브라우저에 적용됩니다.</p>' +
          '<label class="btn btn-ghost btn-sm file-btn">파일 고르기<input type="file" accept=".html,.htm,.js,.json" class="cfg-file"></label>' +
          '<p class="field-err cfg-err" role="alert"></p></div>' +
        '<div class="ap-block"><h4>↩️ 원래대로</h4>' +
          '<p class="small">' + (window.SITE_CONFIG_OVERRIDDEN ? "이 브라우저에 편집본이 적용되어 있습니다" + (saved ? " (" + saved + " 저장)" : "") + ". 지우면 올려 둔 index.html의 설정으로 돌아갑니다." : "지금은 index.html에 들어 있는 원래 설정을 쓰고 있습니다.") + "</p>" +
          '<button type="button" class="btn btn-ghost btn-sm danger" data-a="reset"' + (window.SITE_CONFIG_OVERRIDDEN ? "" : " disabled") + ">편집본 지우기</button></div>" +
        '<div class="ap-block"><h4>🔑 관리자 비밀번호 변경</h4>' +
          '<form class="ap-form ap-pw" novalidate>' +
            '<div class="field"><label for="pw-cur">현재 비밀번호</label><input type="password" id="pw-cur" autocomplete="current-password"></div>' +
            '<div class="field"><label for="pw-new">새 비밀번호 (8자 이상)</label><input type="password" id="pw-new" autocomplete="new-password"></div>' +
            '<div class="field"><label for="pw-new2">새 비밀번호 확인</label><input type="password" id="pw-new2" autocomplete="new-password"></div>' +
            '<p class="field-err pw-err" role="alert"></p>' +
            '<button type="submit" class="btn btn-primary btn-sm">비밀번호 바꾸기</button>' +
          "</form>" +
          '<p class="muted small">바꾼 뒤 \'index.html 내려받기\'로 저장해 올려야 다른 컴퓨터에서도 새 비밀번호가 적용됩니다.</p></div>' +
      "</div>";
  };
  // 설정 부분(<script id="site-config">)만 새 설정으로 바꾼 index.html 전체를 만듭니다.
  var CFG_RE = /(<script id="site-config">)([\s\S]*?)(<\/script>)/;
  function exportConfig() {
    var cfg = clone(st.draft);
    delete cfg._savedAt;
    var page = window.__PAGE_SOURCE || "";
    if (!CFG_RE.test(page)) { toast("페이지 원본을 찾지 못해 저장할 수 없습니다.", "error"); return; }
    var json = JSON.stringify(cfg, null, 2).replace(/<\//g, "<\\/"); // 글 안에 script 닫는 태그가 있어도 페이지가 깨지지 않게
    var text =
      "\n/* ==========================================================\n" +
      "   사이트 설정 (관리자 화면에서 저장: " + stamp(new Date().toISOString()) + ")\n" +
      "   직접 고칠 때는 따옴표 안의 글만 바꾸고, 쉼표(,)가 지워지지 않게 조심하세요.\n" +
      "   ========================================================== */\n" +
      "window.SITE_CONFIG = " + json + ";\n";
    var out = page.replace(CFG_RE, function (m, a, b, c) { return a + text + c; });
    download("index.html", out, "text/html;charset=utf-8");
    toast("index.html을 내려받았습니다. 사이트의 파일을 이것으로 바꿔 올리세요.", "ok");
  }
  function importConfig(file) {
    var err = $(".cfg-err", root);
    var r = new FileReader();
    r.onload = function () {
      var text = String(r.result).replace(/^﻿/, "");
      var cfg = null;
      var m = CFG_RE.exec(text);
      if (m) text = m[2]; // index.html이면 설정 부분만 꺼냄
      try { cfg = JSON.parse(text); } catch (e) {
        try {
          // window.SITE_CONFIG = { ... }; 형식 (가짜 window 안에서만 실행)
          var fake = {};
          new Function("window", text)(fake);
          cfg = fake.SITE_CONFIG;
        } catch (e2) { cfg = null; }
      }
      if (!cfg || typeof cfg !== "object" || !cfg.site) {
        err.textContent = "설정을 읽지 못했습니다. 이 사이트의 index.html이 맞는지 확인해 주세요.";
        return;
      }
      if (!window.confirm("'" + file.name + "' 설정을 이 브라우저에 적용할까요?")) return;
      saveOverride(JSON.parse(JSON.stringify(cfg)), "file");
    };
    r.readAsText(file, "utf-8");
  }
  function changePw(form) {
    var err = $(".pw-err", form);
    var cur = $("#pw-cur", form).value, n1 = $("#pw-new", form).value, n2 = $("#pw-new2", form).value;
    if (hashPw(cur) !== C.admin.passwordHash) { err.textContent = "현재 비밀번호가 맞지 않습니다."; return; }
    if (n1.length < 8) { err.textContent = "새 비밀번호는 8자 이상으로 해 주세요."; return; }
    if (n1 !== n2) { err.textContent = "새 비밀번호 두 칸이 서로 다릅니다."; return; }
    var cfg = clone(C);
    cfg.admin = cfg.admin || {};
    cfg.admin.passwordHash = sha((cfg.admin.salt || "") + ":" + n1);
    toast("비밀번호를 바꿨습니다. index.html을 저장해 올리는 것을 잊지 마세요.", "ok");
    saveOverride(cfg, "file");
  }

  /* ==========================================================
     이벤트 연결
     ========================================================== */
  function bind() {
    root.addEventListener("click", function (e) {
      if (e.target === root) { closeAdmin(); return; }
      var t = e.target.closest("[data-tab]");
      if (t && !t.disabled) {
        if (st.tab === "edit" && st.dirty && t.dataset.tab !== "edit" && !confirmLeave()) return;
        if (st.tab === "edit" && t.dataset.tab !== "edit") { st.draft = clone(C); setDirty(false); }
        show(t.dataset.tab);
        return;
      }
      var a = e.target.closest("[data-a]");
      if (a) {
        var act = a.dataset.a;
        if (act === "close") closeAdmin();
        else if (act === "lock") { st.dirty = false; ss(SESSION, null); updateLock(); closeAdmin(); toast("관리자 화면을 잠갔습니다."); }
        else if (act === "demo") makeDemo();
        else if (act === "wipe") wipe(a);
        else if (act === "csv-apply") csvApply();
        else if (act === "csv-att") csvAtt();
        else if (act === "csv-sub") csvSub();
        else if (act === "csv-roster") downloadCsv("수강생명단", [["학번", "이름", "학과", "이메일"]].concat(roster().map(function (x) { return [x.id, x.name, x.major, x.email]; })));
        else if (act === "roster-template") downloadCsv("명단양식", [["학번", "이름", "학과", "이메일"], ["2026123456", "홍길동", "경영학과", "hong@korea.ac.kr"]]);
        else if (act === "bulk") {
          var res = parseRoster($(".r-bulk", root).value);
          var added = addRoster(res.list);
          toast(added + "명을 추가했습니다." + (res.bad ? " (형식이 맞지 않는 " + res.bad + "줄은 건너뜀)" : ""), added ? "ok" : "error");
          show("roster");
        }
        else if (act === "roster-clear") {
          if (a.dataset.armed !== "1") { a.dataset.armed = "1"; a.textContent = "⚠️ 정말 비울까요? 한 번 더"; return; }
          store.set("admin:roster", []); show("roster");
        }
        else if (act === "roster-apply") applyRoster();
        else if (act === "notice-cancel") { editingNotice = null; show("notice"); }
        else if (act === "revert") { st.draft = clone(C); setDirty(false); rerenderEdit(); }
        else if (act === "apply-edit") { st.dirty = false; saveOverride(st.draft, "edit"); }
        else if (act === "export") exportConfig();
        else if (act === "reset") {
          if (a.dataset.armed !== "1") { a.dataset.armed = "1"; a.textContent = "⚠️ 한 번 더 누르면 지웁니다"; return; }
          store.del("configOverride"); ss("kcn:admin:reopen", "file"); location.reload();
        }
        return;
      }
      var sec = e.target.closest("[data-sec]");
      if (sec) { st.section = sec.dataset.sec; show("edit"); return; }
      var op = e.target.closest("[data-op]");
      if (op) { e.preventDefault(); arrOp(op); return; }
      var dr = e.target.closest("[data-del-roster]");
      if (dr) { var r = roster(); r.splice(+dr.dataset.delRoster, 1); store.set("admin:roster", r); show("roster"); return; }
      var en = e.target.closest("[data-edit-notice]");
      if (en) { editingNotice = en.dataset.editNotice; show("notice"); $("#n-title", root).focus(); return; }
      var dn = e.target.closest("[data-del-notice]");
      if (dn) deleteNotice(dn.dataset.delNotice, dn);
    });

    root.addEventListener("input", function (e) {
      var el = e.target;
      if (el.dataset.path) {
        var v = el.dataset.type === "boolean" ? el.checked : el.dataset.type === "number" ? (el.value === "" ? 0 : +el.value) : el.value;
        setPath(st.draft, JSON.parse(el.dataset.path), v);
        setDirty(true);
      }
      if (el.classList.contains("ap-q")) {
        st.q = el.value;
        var pos = el.selectionStart;
        show("apply");
        var q = $(".ap-q", root); q.focus(); q.setSelectionRange(pos, pos);
      }
    });
    root.addEventListener("change", function (e) {
      var el = e.target;
      if (el.dataset.path && el.dataset.type === "boolean") { setPath(st.draft, JSON.parse(el.dataset.path), el.checked); setDirty(true); }
      if (el.id === "ed-sec") { st.section = el.value; show("edit"); $("#ed-sec", root).focus(); }
      if (el.classList.contains("ap-week")) { st.subWeek = el.value; show("sub"); $(".ap-week", root).focus(); }
      if (el.classList.contains("cfg-file") && el.files[0]) importConfig(el.files[0]);
      if (el.classList.contains("r-file") && el.files[0]) {
        var fr = new FileReader();
        fr.onload = function () {
          var res = parseRoster(String(fr.result).replace(/^﻿/, ""));
          var added = addRoster(res.list);
          toast(added + "명을 추가했습니다." + (res.bad ? " (형식이 맞지 않는 " + res.bad + "줄은 건너뜀)" : ""), added ? "ok" : "error");
          show("roster");
        };
        fr.readAsText(el.files[0], "utf-8");
      }
    });
    root.addEventListener("toggle", function (e) {
      var d = e.target;
      if (d.classList && d.classList.contains("ed-item") && d.dataset.key) st.open[d.dataset.key] = d.open;
    }, true);
    root.addEventListener("submit", function (e) {
      e.preventDefault();
      var f = e.target;
      if (f.classList.contains("ap-notice")) saveNotice(f);
      if (f.classList.contains("ap-pw")) changePw(f);
      if (f.classList.contains("ap-roster-add")) {
        var id = $("#r-id", f).value.trim(), nm = $("#r-name", f).value.trim(), err = $(".r-err", f);
        if (!/^\d{10}$/.test(id)) { err.textContent = "학번은 숫자 10자리로 입력해 주세요."; $("#r-id", f).focus(); return; }
        if (!nm) { err.textContent = "이름을 입력해 주세요."; $("#r-name", f).focus(); return; }
        var added = addRoster([{ id: id, name: nm, major: $("#r-major", f).value.trim(), email: $("#r-email", f).value.trim() }]);
        toast(added ? nm + " 학생을 추가했습니다." : "이미 등록된 학번입니다.", added ? "ok" : "error");
        show("roster");
        $("#r-id", root).focus();
      }
    });
    // 탭 메뉴 화살표 이동
    $(".admin-tabs", root).addEventListener("keydown", function (e) {
      if (["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].indexOf(e.key) < 0) return;
      e.preventDefault();
      var ids = TABS.map(function (t) { return t[0]; });
      var i = ids.indexOf(st.tab) + (e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1);
      i = (i + ids.length) % ids.length;
      $('[data-tab="' + ids[i] + '"]', root).click();
      $('.admin-tabs [data-tab="' + ids[i] + '"]', root).focus();
    });
  }

  /* ---------- 시작 ---------- */
  if (lockBtn) lockBtn.addEventListener("click", function () { isAdmin() ? openAdmin() : openLogin(); });
  updateLock();
  var reopen = ss("kcn:admin:reopen");
  if (reopen && isAdmin()) {
    ss("kcn:admin:reopen", null);
    setTimeout(function () { openAdmin(reopen); }, 100);
  }

  window.Admin = { open: openAdmin };
})();
</script>
</body>
</html>
