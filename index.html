        '<button type="button" role="tab" id="tab-sub" aria-controls="panel-sub" aria-selected="' + (tab === "sub") + '" data-tab="sub">📤 과제 제출</button>' +
      "</div>" +
      '<div class="tab-panel" role="tabpanel" id="panel-att" aria-labelledby="tab-att"' + (tab === "att" ? "" : " hidden") + ">" + attendanceHtml(u) + "</div>" +
      '<div class="tab-panel" role="tabpanel" id="panel-sub" aria-labelledby="tab-sub"' + (tab === "sub" ? "" : " hidden") + ">" + submissionHtml(u) + "</div>" +
      (!P.endpoint ? '<p class="demo-note">' + esc(P.demoNotice) + "</p>" : "");
    if (tab === "sub") bindDrop();
  }

  /* ----- 출석 ----- */
  function parseTime(t) {
    var m = /(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/.exec(t || "");
    return m ? { s: +m[1] * 60 + +m[2], e: +m[3] * 60 + +m[4] } : { s: 0, e: 1439 };
  }
  function classWindow(w) {
    var t = parseTime(w.time);
    var base = w.date;
    function at(min) { return new Date(base.getFullYear(), base.getMonth(), base.getDate(), Math.floor(min / 60), min % 60); }
    return {
      open: at(t.s - (attCfg.openBeforeMin || 0)),
      start: at(t.s),
      late: at(t.s + (attCfg.lateAfterMin || 0)),
      end: at(t.e)
    };
  }
  function attRecords(u) { return store.get("att:" + u.id, {}); }
  function attStatus(w, rec) {
    if (rec) return rec.late ? "late" : "present";
    var win = classWindow(w);
    if (now() > win.end) return "absent";
    if (dayKey(w.date) === dayKey(today())) return "today";
    return "upcoming";
  }
  var ST = { present: "출석", late: "지각", absent: "결석", today: "오늘", upcoming: "예정" };

  function attendanceHtml(u) {
    var recs = attRecords(u);
    var tKey = dayKey(today());
    var todayWeek = WEEKS.filter(function (w) { return dayKey(w.date) === tKey; })[0];
    var next = WEEKS.filter(function (w) { return w.date > today(); })[0];
    var card;
    if (todayWeek) {
      var win = classWindow(todayWeek);
      var rec = recs[todayWeek.n];
      var n = now();
      var action;
      if (rec) action = '<span class="att-done ' + (rec.late ? "late" : "") + '">' + (rec.late ? "⏰ 지각 처리" : "✅ 출석 완료") + " · " + hm(new Date(rec.at)) + "</span>";
      else if (n < win.open) action = '<button type="button" class="btn btn-ghost" disabled>' + hm(win.open) + "부터 출석 가능</button>";
      else if (n > win.end) action = '<span class="att-done absent">출석 시간이 지났습니다</span>';
      else action = '<button type="button" class="btn btn-primary att-check" data-week="' + todayWeek.n + '">출석 체크하기</button>';
      card =
        '<div class="att-today">' +
          '<div><span class="badge badge-now">오늘 수업</span>' +
          "<h4>" + todayWeek.n + "주차 · " + esc(todayWeek.data.title) + "</h4>" +
          '<p class="muted small">' + esc(todayWeek.time) + " · " + esc(todayWeek.place) +
          " · 시작 " + (attCfg.lateAfterMin || 0) + "분 후부터 지각</p></div>" +
          action +
        "</div>";
    } else {
      card =
        '<div class="att-today empty">' +
          "<div><h4>오늘은 수업이 없습니다</h4>" +
          '<p class="muted small">' + (next ? "다음 수업: " + CU.fmtDate(next.date) + " · " + next.n + "주차 " + esc(next.data.title) : "이번 학기 수업이 모두 끝났습니다.") + "</p></div>" +
        "</div>";
    }

    var tally = { present: 0, late: 0, absent: 0 };
    var cells = WEEKS.map(function (w) {
      var s = attStatus(w, recs[w.n]);
      if (tally[s] != null) tally[s]++;
      return '<li class="att-cell ' + s + '"><strong>' + w.n + "주</strong><small>" + CU.fmtShort(w.date) + "</small><span>" + ST[s] + "</span></li>";
    }).join("");
    var held = tally.present + tally.late + tally.absent;
    var rate = held ? Math.round(((tally.present + tally.late) / held) * 100) : 0;

    return (
      card +
      '<div class="att-stats">' +
        '<div><strong>' + rate + '%</strong><span>출석률</span></div>' +
        '<div class="present"><strong>' + tally.present + "</strong><span>출석</span></div>" +
        '<div class="late"><strong>' + tally.late + "</strong><span>지각</span></div>" +
        '<div class="absent"><strong>' + tally.absent + "</strong><span>결석</span></div>" +
      "</div>" +
      '<ul class="att-grid" aria-label="주차별 출석 현황">' + cells + "</ul>"
    );
  }

  function checkIn(n) {
    var u = user();
    var w = WEEKS[n - 1];
    if (!u || !w) return;
    var win = classWindow(w);
    var t = now();
    if (t < win.open || t > win.end) { toast("지금은 출석할 수 없는 시간입니다.", "error"); showPortal(); return; }
    var recs = attRecords(u);
    if (recs[n]) return;
    recs[n] = { at: t.toISOString(), late: t > win.late };
    store.set("att:" + u.id, recs);
    send("attendance", { studentId: u.id, name: u.name, week: n, late: recs[n].late, at: recs[n].at });
    toast(recs[n].late ? "지각으로 출석 처리되었습니다." : "출석 완료! 오늘도 화이팅 🌸", recs[n].late ? "" : "ok");
    showPortal();
  }

  /* ----- 과제 제출 ----- */
  var ASG = WEEKS.filter(function (w) { return w.data.assignment; });
  var chosenFile = null;

  function subRecords(u) { return store.get("sub:" + u.id, {}); }
  function isClosed(w) { return w.due && now() > w.due; }
  function defaultAsg() {
    if (pendingWeek && ASG.some(function (w) { return w.n === pendingWeek; })) return pendingWeek;
    var open = ASG.filter(function (w) { return !isClosed(w); })[0];
    return (open || ASG[0] || {}).n;
  }
  var currentAsg = null;

  function submissionHtml(u) {
    if (!ASG.length) return '<p class="muted">등록된 과제가 없습니다.</p>';
    if (!currentAsg) currentAsg = defaultAsg();
    var w = ASG.filter(function (x) { return x.n === currentAsg; })[0] || ASG[0];
    var a = w.data.assignment;
    var recs = subRecords(u);
    var mine = recs[w.n] || [];
    var last = mine[mine.length - 1];
    var closed = isClosed(w);
    var blocked = closed && !subCfg.allowLate;

    var options = list(ASG, function (x) {
      var st = (recs[x.n] || []).length ? " · 제출함" : isClosed(x) ? " · 마감" : "";
      return '<option value="' + x.n + '"' + (x.n === w.n ? " selected" : "") + ">" + x.n + "주차 · " + esc(x.data.assignment.title) + st + "</option>";
    });

    var history = [];
    ASG.forEach(function (x) {
      (recs[x.n] || []).forEach(function (r) { history.push({ w: x, r: r }); });
    });
    history.sort(function (p, q) { return p.r.at < q.r.at ? 1 : -1; });

    var exts = (subCfg.accept || "").split(",").map(function (s) { return s.trim().replace(".", "").toUpperCase(); }).filter(Boolean);

    return (
      '<form class="sub-form" novalidate>' +
        '<div class="field"><label for="sub-week">제출할 과제</label><select id="sub-week">' + options + "</select></div>" +
        '<div class="sub-info' + (closed ? " closed" : "") + '">' +
          "<p>" + esc(a.desc) + "</p>" +
          '<p class="small"><strong>마감</strong> ' + (w.due ? CU.fmtDue(w.due) : "미정") +
            (closed ? ' <span class="badge badge-asg closed">마감됨</span>' : "") + "</p>" +
          (last ? '<p class="small sub-last">✅ 마지막 제출: ' + esc(last.fileName) + " · " + esc(fmtStamp(last.at)) + (last.late ? " (지각)" : "") + "</p>" : "") +
        "</div>" +
        (blocked
          ? '<p class="sub-blocked">⛔ 마감된 과제는 제출할 수 없습니다.</p>'
          : '<label class="dropzone" for="sub-file">' +
              '<input type="file" id="sub-file" accept="' + esc(subCfg.accept || "") + '">' +
              '<span class="dz-icon" aria-hidden="true">📁</span>' +
              '<span class="dz-text"><strong>파일을 끌어다 놓거나 눌러서 선택</strong>' +
              "<small>" + esc(exts.join(" · ")) + " · 최대 " + (subCfg.maxSizeMB || 20) + "MB</small></span>" +
              '<span class="dz-file" hidden></span>' +
            "</label>" +
            '<p class="field-err sub-err" role="alert"></p>' +
            '<button type="submit" class="btn btn-primary">' + (closed ? "지각 제출하기" : last ? "다시 제출하기" : "제출하기") + "</button>") +
      "</form>" +
      (history.length
        ? '<h4 class="hist-title">내 제출 기록</h4><ul class="hist">' + list(history, function (h) {
            return "<li><span class=\"badge badge-week\">" + h.w.n + "주</span>" +
              '<span class="hist-file">' + esc(h.r.fileName) + " <small>(" + fmtSize(h.r.size) + ")</small></span>" +
              '<span class="hist-at">' + esc(fmtStamp(h.r.at)) + (h.r.late ? ' <em class="late">지각</em>' : "") + "</span></li>";
          }) + "</ul>"
        : "")
    );
  }

  function setFile(file) {
    var err = $(".sub-err");
    var label = $(".dz-file");
    chosenFile = null;
    if (err) err.textContent = "";
    if (!file) { if (label) label.hidden = true; return; }
    var max = (subCfg.maxSizeMB || 20) * 1048576;
    var exts = (subCfg.accept || "").toLowerCase().split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    var ext = "." + (file.name.split(".").pop() || "").toLowerCase();
    if (exts.length && exts.indexOf(ext) < 0) { err.textContent = "제출할 수 없는 파일 형식입니다. (" + ext + ")"; label.hidden = true; return; }
    if (file.size > max) { err.textContent = "파일이 너무 큽니다. " + (subCfg.maxSizeMB || 20) + "MB 이하로 올려 주세요. (지금 " + fmtSize(file.size) + ")"; label.hidden = true; return; }
    chosenFile = file;
    label.hidden = false;
    label.innerHTML = "📄 " + esc(file.name) + " <small>(" + fmtSize(file.size) + ')</small> <button type="button" class="link-btn dz-clear">취소</button>';
  }

  function bindDrop() {
    var dz = $(".dropzone");
    var input = $("#sub-file");
    chosenFile = null;
    if (!dz) return;
    input.addEventListener("change", function () { setFile(input.files[0]); });
    ["dragenter", "dragover"].forEach(function (t) {
      dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.add("over"); });
    });
    ["dragleave", "drop"].forEach(function (t) {
      dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.remove("over"); });
    });
    dz.addEventListener("drop", function (e) {
      var f = e.dataTransfer && e.dataTransfer.files[0];
      if (f) setFile(f);
    });
  }

  function submitFile() {
    var u = user();
    var w = WEEKS[currentAsg - 1];
    if (!u || !w) return;
    var err = $(".sub-err");
    if (!chosenFile) { err.textContent = "제출할 파일을 선택해 주세요."; $("#sub-file").focus(); return; }
    var closed = isClosed(w);
    if (closed && !subCfg.allowLate) { err.textContent = "마감된 과제는 제출할 수 없습니다."; return; }
    var recs = subRecords(u);
    var rec = { fileName: chosenFile.name, size: chosenFile.size, at: now().toISOString(), late: !!closed };
    (recs[w.n] = recs[w.n] || []).push(rec);
    store.set("sub:" + u.id, recs);
    send("submission", { studentId: u.id, name: u.name, week: w.n, assignment: w.data.assignment.title, late: rec.late, file: chosenFile });
    toast(w.n + "주차 과제를 제출했어요!", "ok");
    showPortal();
  }

  // 아이디·비밀번호 로그인 (회원가입 때 저장한 해시값과 비교)
  function login(form) {
    var account = form.elements.lid.value.trim().toLowerCase();
    var pw = form.elements.lpw.value;
    var err = $(".lg-err", form);
    var ok = true;
    err.textContent = "";
    function mark(field, msg) {
      var wrap = $('[data-field="' + field + '"]', form);
      wrap.classList.toggle("invalid", !!msg);
      $(".field-err", wrap).textContent = msg;
      $("input", wrap).setAttribute("aria-invalid", msg ? "true" : "false");
      if (msg && ok) { $("input", wrap).focus(); ok = false; }
    }
    mark("lid", account ? "" : "아이디를 입력해 주세요.");
    mark("lpw", pw ? "" : "비밀번호를 입력해 주세요.");
    if (!ok) return;
    // 5번 틀리면 30초 잠금
    var until = +(sessionStorage.getItem("kcn:login:lockUntil") || 0);
    if (Date.now() < until) { err.textContent = Math.ceil((until - Date.now()) / 1000) + "초 뒤에 다시 시도해 주세요."; return; }
    var m = members()[account];
    if (!m || hashPassword(m.salt, account, pw) !== m.hash) {
      var fails = +(sessionStorage.getItem("kcn:login:fails") || 0) + 1;
      if (fails >= 5) {
        sessionStorage.setItem("kcn:login:lockUntil", String(Date.now() + 30000));
        sessionStorage.removeItem("kcn:login:fails");
        err.textContent = "5번 틀렸습니다. 30초 뒤에 다시 시도해 주세요.";
      } else {
        sessionStorage.setItem("kcn:login:fails", String(fails));
        err.textContent = "아이디 또는 비밀번호가 맞지 않습니다. (" + fails + "/5)" +
          (m ? "" : " 이 브라우저에서 가입한 계정만 로그인할 수 있습니다.");
      }
      form.elements.lpw.value = "";
      form.elements.lpw.focus();
      return;
    }
    sessionStorage.removeItem("kcn:login:fails");
    var id = m.studentId || account;
    var name = m.name || account;
    // 관리자가 명단을 등록했다면 명단에 있는 학생만 로그인
    var roster = (portal.rosterHashes || []);
    if (roster.length && roster.indexOf(rosterKey(id, name)) < 0) {
      err.textContent = "수강생 명단에 없는 학번·이름으로 가입된 계정입니다. 회원 정보를 확인하거나 교수자에게 문의해 주세요.";
      return;
    }
    store.set("user", { id: id, name: name, account: account });
    remember(id, name);
    if (pendingWeek) { tab = "sub"; currentAsg = pendingWeek; }
    showPortal();
    pendingWeek = null;
    toast(name + " 님, 환영합니다!", "ok");
  }

  /* ---------- 섹션 그리기 ---------- */
  function render(p) {
    return (
      '<section id="participate"><div class="container">' +
        '<div class="section-head reveal">' +
          (p.eyebrow ? '<span class="eyebrow">' + esc(p.eyebrow) + "</span>" : "") +
          "<h2>" + esc(p.title) + "</h2>" + (p.lead ? "<p>" + esc(p.lead) + "</p>" : "") +
        "</div>" +
        renderPoll() +
        '<div class="join-grid">' + renderApply() + renderPortal() + "</div>" +
        (window.Quiz ? window.Quiz.render() : "") + // js/quiz.js — 실시간 퀴즈
      "</div></section>"
    );
  }

  /* ---------- 동작 연결 ---------- */
  function init() {
    if (!$("#participate")) return;
    if (window.Quiz) window.Quiz.init();
    updatePoll();
    showApply();
    showPortal();

    // 투표
    $("#poll").addEventListener("click", function (e) {
      var b = e.target.closest(".poll-opt");
      if (b) vote(b.dataset.id);
    });
    // 다른 탭에서 투표하면 바로 반영
    window.addEventListener("storage", function (e) {
      if (!e.key || e.key.indexOf(PREFIX + "poll") === 0) updatePoll();
      if (e.key === PREFIX + "user") showPortal();
    });

    // 신청서
    var ap = $("#apply");
    ap.addEventListener("submit", function (e) { e.preventDefault(); submitApply(e.target); });
    ap.addEventListener("click", function (e) {
      if (e.target.closest(".apply-edit")) { showApply("edit"); return; }
      var f = e.target.closest("[data-focus]");
      if (f) focusField($(".apply-form"), f.dataset.focus);
    });
    function live(e) {
      var form = e.target.form;
      if (!form || !form.classList.contains("apply-form")) return;
      updateCounts(form);
      var wrap = e.target.closest(".field");
      if (!wrap) return;
      // 비밀번호를 고치면 '비밀번호 확인'도 다시 검사
      apply.fields.forEach(function (x) {
        if (x.matches === wrap.dataset.field) {
          var w2 = $('[data-field="' + x.name + '"]', form);
          if (w2 && (w2.classList.contains("invalid") || fieldValue(form, x))) checkField(form, x);
        }
      });
      if (!wrap.classList.contains("invalid")) return;
      var f = apply.fields.filter(function (x) { return x.name === wrap.dataset.field; })[0];
      if (f) checkField(form, f);
    }
    ap.addEventListener("input", live);
    ap.addEventListener("change", live);
    ap.addEventListener("focusout", function (e) {
      var form = e.target.form;
      if (!form || !form.classList.contains("apply-form") || !e.target.value) return;
      var wrap = e.target.closest(".field");
      var f = wrap && apply.fields.filter(function (x) { return x.name === wrap.dataset.field; })[0];
      if (f && f.type !== "radio" && f.type !== "checkbox") checkField(form, f);
    });

    // 수강생 공간
    var pt = $("#portal");
    pt.addEventListener("submit", function (e) {
      e.preventDefault();
      if (e.target.classList.contains("login-form")) login(e.target);
      if (e.target.classList.contains("sub-form")) submitFile();
    });
    pt.addEventListener("click", function (e) {
      if (e.target.closest(".logout")) { logout(); return; }
      var t = e.target.closest("[data-tab]");
      if (t) { tab = t.dataset.tab; showPortal(); $('[data-tab="' + tab + '"]').focus(); return; }
      var c = e.target.closest(".att-check");
      if (c) { checkIn(+c.dataset.week); return; }
      if (e.target.closest(".dz-clear")) { e.preventDefault(); $("#sub-file").value = ""; setFile(null); }
    });
    pt.addEventListener("change", function (e) {
      if (e.target.id === "sub-week") { currentAsg = +e.target.value; showPortal(); $("#sub-week").focus(); }
    });
    pt.addEventListener("keydown", function (e) {
      // 탭 메뉴 좌우 화살표 이동
      var t = e.target.closest('[role="tab"]');
      if (!t || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
      tab = tab === "att" ? "sub" : "att";
      showPortal();
      $('[data-tab="' + tab + '"]').focus();
    });

    // 헤더의 로그인 버튼
    var hu = document.getElementById("hdr-user");
    if (hu) {
      hu.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!e.target.classList.contains("hdr-login")) return;
        login(e.target);
        if (user()) renderHeaderUser(); // 성공하면 닫힌 상태로 다시 그림
      });
      hu.addEventListener("click", function (e) {
        if (e.target.closest(".hdr-user-btn")) { toggleHeaderUser($("#hdr-pop").hidden); return; }
        if (e.target.closest(".hdr-logout")) { logout(); $(".hdr-user-btn").focus(); return; }
        var l = e.target.closest("[data-hdr-close]");
        if (l) {
          if (l.dataset.hdrTab && user()) { tab = l.dataset.hdrTab; showPortal(); }
          else toggleHeaderUser(false);
        }
      });
      document.addEventListener("click", function (e) {
        if (!hu.contains(e.target) && $("#hdr-pop") && !$("#hdr-pop").hidden) toggleHeaderUser(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && $("#hdr-pop") && !$("#hdr-pop").hidden) { toggleHeaderUser(false); $(".hdr-user-btn").focus(); }
      });
    }

    // 커리큘럼의 '사이트에서 제출하기' 버튼
    document.addEventListener("click", function (e) {
      var b = e.target.closest("[data-submit-week]");
      if (!b || b.getAttribute("aria-disabled") === "true") return;
      var n = +b.dataset.submitWeek;
      if (user()) { tab = "sub"; currentAsg = n; pendingWeek = null; }
      else pendingWeek = n;
      showPortal();
    });
  }

  window.Participate = { render: render, init: init };
})();

/* ######################################################## api-keys */
/* ==========================================================
   API 키 보관함 (관리자 화면 > API 키)
   - 키는 이 브라우저(localStorage 또는 이번 창만 sessionStorage)에만 저장됩니다.
   - 설정(SITE_CONFIG)·index.html 내려받기·CSV 어디에도 들어가지 않습니다.
   - 다른 코드에서는 window.ApiKeys.get("anthropic"), get("baze") 처럼 꺼내 씁니다.
   ========================================================== */
(function () {
  "use strict";
  var KEY = "kcn:apikeys";
  var OLD_QUIZ_KEY = "kcn:quiz:apikey"; // 예전 퀴즈 화면에서 저장하던 자리
  // 기본으로 보이는 칸. id는 코드에서 키를 꺼낼 때 쓰는 이름입니다.
  var BUILTIN = [
    { id: "anthropic", label: "Anthropic (Claude)", hint: "퀴즈 AI 출제에 쓰입니다.", placeholder: "sk-ant-…", test: true },
    { id: "baze", label: "BAZE", hint: "BAZE 연동에 쓸 키입니다.", placeholder: "BAZE API 키" }
  ];

  function read(s) {
    try { var v = JSON.parse(s.getItem(KEY) || "{}"); return v && typeof v === "object" ? v : {}; } catch (e) { return {}; }
  }
  function write(s, obj) {
    try { if (Object.keys(obj).length) s.setItem(KEY, JSON.stringify(obj)); else s.removeItem(KEY); } catch (e) { /* 저장 불가 */ }
  }
  // 예전 퀴즈 키를 보관함으로 옮김 (한 번만)
  (function migrate() {
    try {
      [[localStorage, true], [sessionStorage, false]].forEach(function (p) {
        var old = p[0].getItem(OLD_QUIZ_KEY);
        if (!old) return;
        var box = read(p[0]);
        if (!box.anthropic) { box.anthropic = { key: old, at: new Date().toISOString() }; write(p[0], box); }
        p[0].removeItem(OLD_QUIZ_KEY);
      });
    } catch (e) { /* 무시 */ }
  })();

  function slots() {
    var loc = read(localStorage), ses = {};
    try { ses = read(sessionStorage); } catch (e) { /* 무시 */ }
    var out = BUILTIN.map(function (b) { return Object.assign({ builtin: true }, b); });
    var ids = out.map(function (b) { return b.id; });
    Object.keys(loc).concat(Object.keys(ses)).forEach(function (id) {
      if (ids.indexOf(id) >= 0) return;
      var e = ses[id] || loc[id];
      ids.push(id);
      out.push({ id: id, label: e.label || id, hint: e.memo || "", placeholder: "API 키" });
    });
    return out.map(function (s) {
      var e = ses[s.id] || loc[s.id] || null;
      return Object.assign(s, { key: e ? e.key : "", at: e ? e.at : "", memo: e && e.memo || "", remember: !ses[s.id] && !!loc[s.id] });
    });
  }
  function get(id) {
    var ses = {}; try { ses = read(sessionStorage); } catch (e) { /* 무시 */ }
    var e = ses[id] || read(localStorage)[id];
    return e && e.key ? e.key : "";
  }
  function set(id, key, opts) {
    opts = opts || {};
    var loc = read(localStorage), ses = read(sessionStorage);
    var prev = ses[id] || loc[id] || {};
    var entry = { key: key, at: new Date().toISOString() };
    var label = opts.label != null ? opts.label : prev.label;
    var memo = opts.memo != null ? opts.memo : prev.memo;
    if (label) entry.label = label;
    if (memo) entry.memo = memo;
    delete loc[id]; delete ses[id];
    (opts.remember === false ? ses : loc)[id] = entry;
    write(localStorage, loc); write(sessionStorage, ses);
  }
  function remove(id) {
    var loc = read(localStorage), ses = read(sessionStorage);
    delete loc[id]; delete ses[id];
    write(localStorage, loc); write(sessionStorage, ses);
  }
  function mask(k) {
    if (!k) return "";
    return k.length <= 10 ? "•".repeat(k.length) : k.slice(0, 6) + "…" + k.slice(-4);
  }
  // Anthropic 키 확인: 모델 목록을 1개만 불러 봄 (요금 없음)
  async function testAnthropic(key) {
    var mod = await import("https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.135.0/+esm");
    var Anthropic = mod.default || mod.Anthropic;
    var client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true });
    await client.models.list({ limit: 1 });
    return true;
  }

  window.ApiKeys = { slots: slots, get: get, set: set, remove: remove, mask: mask, testAnthropic: testAnthropic, BUILTIN: BUILTIN };
})();

/* ######################################################## quiz */
/* ==========================================================
   실시간 퀴즈 (Kahoot · Socrative 방식)
   - 진행자(교수자): 관리자 로그인 → '퀴즈 방 열기' → PIN·QR 표시 → 문제 진행 → 결과 CSV
   - 학생: QR 촬영 또는 PIN 입력 → 휴대폰으로 답 고르기 → 점수·순위 확인
   - 연결: PeerJS(WebRTC). 진행자 브라우저가 방장 역할을 하므로 별도 서버가 필요 없습니다.
     (PeerJS가 제공하는 무료 연결 안내 서버 0.peerjs.com 을 사용합니다)
   - AI 출제: 관리자 화면 > 퀴즈 (QuizAdmin, 이 파일 아래쪽)
   내용은 설정(SITE_CONFIG)의 quiz 에서 고칩니다.
   ========================================================== */
(function () {
  "use strict";

  var C = window.SITE_CONFIG || {};
  var Q = C.quiz;
  var store = window.SiteStore || { get: function (k, d) { return d; }, set: function () {}, del: function () {} };
  function toast(m, t) { if (window.showToast) window.showToast(m, t); }

  var PEER_URL = "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js";
  var QR_URL = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
  var SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.135.0/+esm";
  var PREFIX = "kcn-quiz-";
  var SHAPES = ["▲", "◆", "●", "■"];

  /* ---------- 도우미 ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function list(arr, fn) { return (arr || []).map(fn).join(""); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function stamp(d) {
    d = d ? new Date(d) : new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  var loading = {};
  function loadScript(url) {
    if (loading[url]) return loading[url];
    loading[url] = new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = url; s.async = true;
      s.onload = res;
      s.onerror = function () { delete loading[url]; rej(new Error("load")); };
      document.head.appendChild(s);
    });
    return loading[url];
  }
  function isAdmin() { try { return sessionStorage.getItem("kcn:admin") === "1"; } catch (e) { return false; } }
  function sets() { return (Q && Q.sets) || []; }
  function joinBase() {
    var u = (Q && Q.joinUrl || "").trim();
    return u || location.href.split("#")[0].split("?")[0];
  }
  function joinLink(pin) { var b = joinBase(); return b + (b.indexOf("?") >= 0 ? "&" : "?") + "quiz=" + pin + "#quiz"; }
  function myKey() {
    var k = store.get("quiz:key", null);
    if (!k) { k = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store.set("quiz:key", k); }
    return k;
  }
  function burst(p) { if (window.Welcome) window.Welcome.burst(p); }

  /* ---------- CSV ---------- */
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function resultCsv(rec) {
    var head = ["순위", "이름", "학번", "총점", "정답 수"];
    rec.questions.forEach(function (q, i) {
      var n = "Q" + (i + 1);
      head.push(n + " 선택", n + " 정답여부", n + " 점수", n + " 응답(초)");
    });
    var rows = [head];
    rec.players.forEach(function (p) {
      var r = [p.rank, p.name, p.sid || "", p.score, p.correct];
      rec.questions.forEach(function (q, i) {
        var a = p.answers[i];
        if (!a) r.push("무응답", "X", 0, "");
        else r.push((a.c + 1) + ". " + (q.choices[a.c] || ""), a.correct ? "O" : "X", a.points, (a.ms / 1000).toFixed(1));
      });
      rows.push(r);
    });
    rows.push([]);
    rows.push(["퀴즈", rec.title]);
    rows.push(["진행 일시", stamp(rec.at)]);
    rec.questions.forEach(function (q, i) {
      var right = rec.players.filter(function (p) { return p.answers[i] && p.answers[i].correct; }).length;
      rows.push(["Q" + (i + 1), q.q, "정답: " + (q.choices[q.answer] || ""), "정답률 " + (rec.players.length ? Math.round(right / rec.players.length * 100) : 0) + "%"]);
    });
    return "﻿" + rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
  }
  function downloadCsv(rec) {
    var name = "교양중국어_퀴즈결과_" + rec.title.replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 30) + "_" +
      stamp(rec.at).replace(/[-: ]/g, "").slice(0, 12) + ".csv";
    var blob = new Blob([resultCsv(rec)], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("퀴즈 결과 파일을 내려받았습니다.", "ok");
  }

  /* ==========================================================
     섹션 (참여하기 > 수강생 공간 아래)
     ========================================================== */
  function render() {
    if (!Q) return "";
    return (
      '<article class="card quiz-card reveal" id="quiz">' +
        '<div class="block-head"><span class="block-icon" aria-hidden="true">🎯</span><div>' +
          "<h3>" + esc(Q.title || "실시간 퀴즈") + "</h3>" +
          '<p class="muted small">' + esc(Q.desc || "") + "</p></div></div>" +
        '<div class="quiz-host-panel"></div>' +
        '<div class="quiz-stage" aria-live="polite"></div>' +
      "</article>"
    );
  }

  function renderHostPanel() {
    var box = $(".quiz-host-panel");
    if (!box) return;
    if (!isAdmin()) { box.innerHTML = ""; return; }
    var s = sets();
    box.innerHTML =
      '<div class="qhp">' +
        '<div class="qhp-title"><strong>🎤 진행자 모드</strong><span class="muted small">관리자로 로그인되어 있어서 보입니다. 문제는 관리자 화면 › 퀴즈에서 만듭니다.</span></div>' +
        (s.length
          ? '<div class="qhp-row"><label class="sr-only" for="qz-set">진행할 퀴즈</label><select id="qz-set">' +
              list(s, function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.title) + " (" + (x.questions || []).length + "문제)</option>"; }) +
            '</select><button type="button" class="btn btn-primary btn-sm" data-qz="host">퀴즈 방 열기</button></div>'
          : '<p class="small">아직 만든 퀴즈가 없습니다.</p>') +
      "</div>";
  }

  /* ==========================================================
     학생
     ========================================================== */
  var S = { state: "join", pin: "", name: "", peer: null, conn: null, q: null, res: null, final: null, err: "", timer: null };

  function stage() { return $(".quiz-stage"); }
  function setState(st) { S.state = st; renderStudent(); }

  function renderStudent() {
    var box = stage();
    if (!box) return;
    clearInterval(S.timer);
    var h = "";
    if (S.state === "join") {
      var u = store.get("user", null);
      h =
        '<form class="quiz-join" novalidate>' +
          '<div class="quiz-join-grid">' +
            '<div class="field"><label for="qz-pin">PIN 6자리</label>' +
              '<input id="qz-pin" class="qz-pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" value="' + esc(S.pin) + '"></div>' +
            '<div class="field"><label for="qz-name">이름 (화면에 보일 이름)</label>' +
              '<input id="qz-name" maxlength="20" autocomplete="nickname" placeholder="홍길동" value="' + esc(S.name || (u ? u.name : "")) + '"></div>' +
          "</div>" +
          '<p class="field-err qz-err" role="alert">' + esc(S.err) + "</p>" +
          '<button type="submit" class="btn btn-primary">입장하기</button>' +
          '<p class="muted small qz-tip">📱 교수자 화면의 QR을 휴대폰 카메라로 찍으면 PIN이 자동으로 채워집니다.</p>' +
        "</form>";
    } else if (S.state === "connecting") {
      h = '<div class="qz-wait"><div class="qz-spin" aria-hidden="true"></div><p>퀴즈 방에 연결하는 중…</p></div>';
    } else if (S.state === "lobby") {
      h = '<div class="qz-wait"><div class="qz-big" aria-hidden="true">🙌</div><h4>입장 완료!</h4>' +
        "<p><b>" + esc(S.joined) + "</b> 님, 교수자 화면에 이름이 보이나요?<br>곧 퀴즈가 시작됩니다.</p>" +
        '<p class="muted small">' + esc(S.title || "") + "</p></div>";
    } else if (S.state === "question") {
      var q = S.q;
      h =
        '<div class="qz-top"><span class="badge badge-week">' + (q.i + 1) + " / " + q.total + '</span>' +
          '<span class="qz-timer" aria-label="남은 시간"><b>' + Math.ceil(q.left) + "</b>초</span></div>" +
        '<div class="qz-bar"><span style="width:' + (q.left / q.full * 100) + '%"></span></div>' +
        '<h4 class="qz-q">' + esc(q.q) + "</h4>" +
        '<div class="qz-choices">' + list(q.choices, function (c, k) {
          return '<button type="button" class="qz-choice c' + k + '" data-c="' + k + '"><span class="qz-shape" aria-hidden="true">' + SHAPES[k] + "</span><span>" + esc(c) + "</span></button>";
        }) + "</div>";
    } else if (S.state === "answered") {
      h = '<div class="qz-wait"><div class="qz-chip c' + S.myChoice + '" aria-hidden="true">' + SHAPES[S.myChoice] + "</div>" +
        "<h4>답을 보냈어요!</h4><p>다른 친구들을 기다리는 중…</p></div>";
    } else if (S.state === "timeout") {
      h = '<div class="qz-wait"><div class="qz-big" aria-hidden="true">⏰</div><h4>시간이 끝났어요</h4><p>정답 공개를 기다리는 중…</p></div>';
    } else if (S.state === "reveal") {
      var r = S.res;
      h = '<div class="qz-result ' + (r.correct ? "ok" : "no") + '">' +
        '<div class="qz-big" aria-hidden="true">' + (r.correct ? "🎉" : r.answered ? "😢" : "⏰") + "</div>" +
        "<h4>" + (r.correct ? "정답! +" + r.points + "점" : r.answered ? "아쉬워요, 오답!" : "시간 안에 답하지 못했어요") + "</h4>" +
        (r.correct ? "" : '<p>정답: <b>' + SHAPES[r.answer] + " " + esc(r.answerText) + "</b></p>") +
        (r.explanation ? '<p class="small qz-exp">' + esc(r.explanation) + "</p>" : "") +
        '<div class="qz-score"><span>총점 <b>' + r.score + "</b>점</span><span><b>" + r.rank + "</b>등 / " + r.players + "명</span></div>" +
        "</div>";
    } else if (S.state === "end") {
      var f = S.final;
      h = '<div class="qz-result end"><div class="qz-big" aria-hidden="true">' + (f.rank === 1 ? "🏆" : f.rank <= 3 ? "🥇" : "🌸") + "</div>" +
        "<h4>최종 " + f.rank + "등 / " + f.players + "명</h4>" +
        '<div class="qz-score"><span>총점 <b>' + f.score + "</b>점</span><span>정답 <b>" + f.correct + "</b> / " + f.total + "</span></div>" +
        '<p class="muted small">수고했어요! 결과는 교수자에게 전달되었습니다.</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-qz="again">다른 퀴즈 입장하기</button></div>';
    } else if (S.state === "lost") {
      h = '<div class="qz-wait"><div class="qz-big" aria-hidden="true">📡</div><h4>연결이 끊겼어요</h4>' +
        "<p>" + esc(S.err || "인터넷 연결을 확인해 주세요.") + "</p>" +
        '<button type="button" class="btn btn-primary btn-sm" data-qz="retry">다시 연결</button> ' +
        '<button type="button" class="btn btn-ghost btn-sm" data-qz="again">처음으로</button></div>';
    } else if (S.state === "closed") {
      h = '<div class="qz-wait"><div class="qz-big" aria-hidden="true">👋</div><h4>퀴즈 방이 닫혔어요</h4>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-qz="again">다른 퀴즈 입장하기</button></div>';
    }
    box.innerHTML = h;
    if (S.state === "question") runStudentTimer();
  }

  function runStudentTimer() {
    var q = S.q;
    S.timer = setInterval(function () {
      q.left = Math.max(0, (q.endsAt - Date.now()) / 1000);
      var b = $(".qz-timer b"), bar = $(".qz-bar span");
      if (b) b.textContent = Math.ceil(q.left);
      if (bar) bar.style.width = (q.left / q.full * 100) + "%";
      if (q.left <= 0) { clearInterval(S.timer); if (S.state === "question") setState("timeout"); }
    }, 200);
  }

  function studentSend(m) { try { if (S.conn && S.conn.open) S.conn.send(m); } catch (e) { /* 무시 */ } }
  function cleanupStudent() {
    clearInterval(S.timer);
    clearTimeout(S.connTimer);
    try { if (S.conn) S.conn.close(); } catch (e) { /* 무시 */ }
    try { if (S.peer) S.peer.destroy(); } catch (e) { /* 무시 */ }
    S.conn = null; S.peer = null;
  }
  function fail(msg, toJoin) {
    cleanupStudent();
    S.err = msg;
    setState(toJoin ? "join" : "lost");
  }

  function studentConnect() {
    setState("connecting");
    loadScript(PEER_URL).then(function () {
      cleanupStudent();
      var peer = S.peer = new window.Peer({ debug: 0 });
      S.connTimer = setTimeout(function () {
        if (S.state === "connecting") fail("연결이 오래 걸립니다. PIN과 인터넷 연결을 확인해 주세요.", true);
      }, 15000);
      peer.on("open", function () {
        var conn = S.conn = peer.connect(PREFIX + S.pin, { reliable: true });
        conn.on("open", function () {
          var u = store.get("user", null);
          studentSend({ t: "join", key: myKey(), name: S.name, sid: u ? u.id : "" });
        });
        conn.on("data", onHostMsg);
        conn.on("close", function () { if (S.state !== "end" && S.state !== "closed" && S.state !== "join") fail("교수자 화면과의 연결이 끊겼습니다."); });
      });
      peer.on("error", function (e) {
        if (e.type === "peer-unavailable") fail("PIN " + S.pin + " 퀴즈 방을 찾을 수 없습니다. PIN을 확인하거나, 교수자가 방을 열었는지 확인해 주세요.", true);
        else if (S.state === "connecting") fail("연결 서버에 접속하지 못했습니다. 인터넷 연결을 확인해 주세요. (" + e.type + ")", true);
      });
    }).catch(function () { fail("퀴즈 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.", true); });
  }

  function onHostMsg(m) {
    if (!m || typeof m !== "object") return;
    clearTimeout(S.connTimer);
    if (m.t === "welcome") { S.joined = m.name; S.title = m.title; S.err = ""; setState("lobby"); }
    else if (m.t === "q") {
      S.q = { i: m.i, total: m.total, q: m.q, choices: m.choices, full: m.full, left: m.left, endsAt: Date.now() + m.left * 1000 };
      if (m.answered != null) { S.myChoice = m.answered; setState("answered"); }
      else setState(m.left > 0 ? "question" : "timeout");
    }
    else if (m.t === "result") { S.res = m; setState("reveal"); if (m.correct) burst(0.25); }
    else if (m.t === "end") { S.final = m; setState("end"); if (m.rank <= 3) burst(0.8); }
    else if (m.t === "closed") { cleanupStudent(); setState("closed"); }
    else if (m.t === "reject") fail(m.reason || "입장할 수 없습니다.", true);
  }

  function answer(c) {
    if (S.state !== "question" || !S.q || S.q.left <= 0) return;
    S.myChoice = c;
    studentSend({ t: "answer", i: S.q.i, c: c });
    setState("answered");
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) { /* 무시 */ }
  }

  /* ==========================================================
     진행자 (교수자 화면)
     ========================================================== */
  var H = null;

  function hostOpen(setId) {
    if (!isAdmin()) { toast("관리자로 로그인해야 퀴즈를 진행할 수 있습니다.", "error"); return; }
    var set = sets().filter(function (s) { return s.id === setId; })[0] || sets()[0];
    if (!set || !(set.questions || []).length) { toast("문제가 있는 퀴즈를 먼저 만들어 주세요.", "error"); return; }
    if (H) hostClose(true);
    H = { set: set, players: {}, order: [], qi: -1, phase: "opening", pin: "", peer: null, timer: null, time: Q.defaultTime || 20 };
    var wrap = document.createElement("div");
    wrap.className = "qh-backdrop";
    wrap.innerHTML =
      '<div class="qh" role="dialog" aria-modal="true" aria-labelledby="qh-title">' +
        '<div class="qh-bar"><strong id="qh-title">🎯 ' + esc(set.title) + '</strong>' +
          '<span class="qh-count">👥 0명</span>' +
          '<button type="button" class="qh-x" data-qh="close" aria-label="퀴즈 진행 화면 닫기">×</button></div>' +
        '<div class="qh-body" tabindex="-1"></div>' +
      "</div>";
    document.body.appendChild(wrap);
    document.body.classList.add("modal-open");
    requestAnimationFrame(function () { wrap.classList.add("show"); });
    H.root = wrap;
    wrap.addEventListener("click", onHostClick);
    H.onKey = function (e) { if (e.key === "Escape" && H) hostClose(); };
    document.addEventListener("keydown", H.onKey);
    renderHost();
    Promise.all([loadScript(PEER_URL), loadScript(QR_URL)]).then(openRoom).catch(function () {
      H.phase = "error"; H.err = "퀴즈 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."; renderHost();
    });
  }

  function openRoom(tries) {
    if (!H) return;
    tries = typeof tries === "number" ? tries : 0;
    H.pin = String(Math.floor(100000 + Math.random() * 900000));
    var peer = H.peer = new window.Peer(PREFIX + H.pin, { debug: 0 });
    peer.on("open", function () { if (!H) return; H.phase = "lobby"; renderHost(); });
    peer.on("connection", onConn);
    peer.on("error", function (e) {
      if (!H) return;
      if (e.type === "unavailable-id" && tries < 4) { try { peer.destroy(); } catch (x) { /* 무시 */ } openRoom(tries + 1); return; }
      if (H.phase === "opening") { H.phase = "error"; H.err = "퀴즈 방을 열지 못했습니다. 인터넷 연결을 확인해 주세요. (" + e.type + ")"; renderHost(); }
    });
    peer.on("disconnected", function () { if (H && H.peer === peer && !peer.destroyed) try { peer.reconnect(); } catch (x) { /* 무시 */ } });
  }

  function hostClose(silent) {
    if (!H) return;
    if (!silent && H.phase !== "end" && H.qi >= 0 && !window.confirm("퀴즈가 진행 중입니다. 닫으면 학생들의 연결이 끊깁니다. 닫을까요?")) return;
    if (H.qi >= 0 && H.phase !== "end") saveResults(true);
    broadcast({ t: "closed" });
    clearInterval(H.timer);
    var h = H; H = null;
    setTimeout(function () { try { if (h.peer) h.peer.destroy(); } catch (e) { /* 무시 */ } }, 300);
    document.removeEventListener("keydown", h.onKey);
    h.root.classList.remove("show");
    document.body.classList.remove("modal-open");
    setTimeout(function () { h.root.remove(); }, 220);
  }

  function players() { return H.order.map(function (k) { return H.players[k]; }); }
  function online() { return players().filter(function (p) { return p.online; }); }
  function broadcast(m) { if (H) players().forEach(function (p) { send(p, m); }); }
  function send(p, m) { try { if (p.conn && p.conn.open) p.conn.send(m); } catch (e) { /* 무시 */ } }
  function refreshCount() {
    if (!H) return;
    var c = $(".qh-count", H.root);
    if (c) c.textContent = "👥 " + online().length + "명";
    var a = $(".qh-answered", H.root);
    if (a && H.phase === "question") {
      var n = players().filter(function (p) { return p.answers[H.qi]; }).length;
      a.textContent = n + " / " + online().length + "명 답변";
    }
  }

  function onConn(conn) {
    conn.on("data", function (m) {
      if (!H || !m || typeof m !== "object") return;
      if (m.t === "join") hostJoin(conn, m);
      else if (m.t === "answer") hostAnswer(conn, m);
    });
    conn.on("close", function () {
      if (!H) return;
      var p = H.players[conn._key];
      if (p && p.conn === conn) { p.online = false; if (H.phase === "lobby") renderHost(); else refreshCount(); }
    });
  }

  function uniqueName(name, key) {
    var taken = players().some(function (p) { return p.key !== key && p.name === name; });
    if (!taken) return name;
    for (var i = 2; i < 100; i++) {
      var n = name + " (" + i + ")";
      if (!players().some(function (p) { return p.name === n; })) return n;
    }
    return name + " (" + Date.now() % 1000 + ")";
  }

  function hostJoin(conn, m) {
    var key = String(m.key || conn.peer).slice(0, 40);
    var p = H.players[key];
    if (!p) {
      if (H.order.length >= 200) { conn.send({ t: "reject", reason: "퀴즈 방이 가득 찼습니다." }); return; }
      var name = String(m.name || "").replace(/\s+/g, " ").trim().slice(0, 20) || "익명";
      p = H.players[key] = { key: key, name: uniqueName(name, key), sid: String(m.sid || "").replace(/\D/g, "").slice(0, 10), score: 0, answers: {} };
      H.order.push(key);
    }
    conn._key = key;
    p.conn = conn;
    p.online = true;
    send(p, { t: "welcome", name: p.name, title: H.set.title });
    if (H.phase === "question") sendQuestion(p);
    else if (H.phase === "reveal" || H.phase === "leader") sendResult(p, ranks());
    else if (H.phase === "end") sendEnd(p, ranks());
    if (H.phase === "lobby") renderHost(); else refreshCount();
  }

  function curQ() { return H.set.questions[H.qi]; }
  function sendQuestion(p) {
    var q = curQ();
    var left = Math.max(0, (H.timeMs - (Date.now() - H.qStart)) / 1000);
    var a = p.answers[H.qi];
    send(p, { t: "q", i: H.qi, total: H.set.questions.length, q: q.q, choices: q.choices, full: H.timeMs / 1000, left: left, answered: a ? a.c : null });
  }

  function startQuestion(i) {
    H.qi = i;
    H.phase = "question";
    var q = curQ();
    H.timeMs = (+q.time || H.time) * 1000;
    H.qStart = Date.now();
    players().forEach(sendQuestion);
    renderHost();
    clearInterval(H.timer);
    H.timer = setInterval(function () {
      if (!H) return;
      var left = Math.max(0, H.timeMs - (Date.now() - H.qStart));
      var t = $(".qh-time b", H.root), ring = $(".qh-time", H.root);
      if (t) t.textContent = Math.ceil(left / 1000);
      if (ring) ring.style.setProperty("--p", (left / H.timeMs * 100) + "%");
      if (left <= 0) reveal();
    }, 200);
  }

  function hostAnswer(conn, m) {
    if (H.phase !== "question" || m.i !== H.qi) return;
    var p = H.players[conn._key];
    if (!p || p.answers[H.qi]) return;
    var c = Math.floor(+m.c);
    if (!(c >= 0 && c < 4)) return;
    var ms = Date.now() - H.qStart;
    if (ms > H.timeMs + 800) return; // 시간 지난 답은 받지 않음 (전송 지연 0.8초까지 허용)
    var correct = c === +curQ().answer;
    var points = correct ? Math.round(500 + 500 * Math.max(0, 1 - ms / H.timeMs)) : 0;
    p.answers[H.qi] = { c: c, ms: Math.min(ms, H.timeMs), correct: correct, points: points };
    p.score += points;
    refreshCount();
    var on = online();
    if (on.length && on.every(function (x) { return x.answers[H.qi]; })) setTimeout(function () { if (H && H.phase === "question") reveal(); }, 600);
  }

  function ranks() {
    var arr = players().slice().sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return totalMs(a) - totalMs(b);
    });
    var map = {};
    arr.forEach(function (p, i) { map[p.key] = i + 1; });
    return { arr: arr, map: map };
  }
  function totalMs(p) { var t = 0; Object.keys(p.answers).forEach(function (k) { if (p.answers[k].correct) t += p.answers[k].ms; }); return t; }
  function correctCount(p) { return Object.keys(p.answers).filter(function (k) { return p.answers[k].correct; }).length; }

  function sendResult(p, r) {
    var q = curQ();
    var a = p.answers[H.qi];
    send(p, { t: "result", i: H.qi, answer: +q.answer, answerText: q.choices[q.answer], answered: !!a, correct: !!(a && a.correct),
      points: a ? a.points : 0, score: p.score, rank: r.map[p.key], players: H.order.length, explanation: q.explanation || "" });
  }
  function sendEnd(p, r) {
    send(p, { t: "end", score: p.score, rank: r.map[p.key], players: H.order.length, correct: correctCount(p), total: H.set.questions.length });
  }

  function reveal() {
    if (!H || H.phase !== "question") return;
    clearInterval(H.timer);
    H.phase = "reveal";
    var r = ranks();
    players().forEach(function (p) { sendResult(p, r); });
    renderHost();
  }
  function next() {
    if (H.qi + 1 < H.set.questions.length) startQuestion(H.qi + 1);
    else finish();
  }
  function finish() {
    H.phase = "end";
    var r = ranks();
    players().forEach(function (p) { sendEnd(p, r); });
    H.saved = saveResults(false);
    renderHost();
    burst(1);
  }

  function buildRecord(partial) {
    var r = ranks();
    return {
      id: "r" + Date.now().toString(36),
      title: H.set.title + (partial ? " (중간 종료)" : ""),
      at: new Date().toISOString(),
      questions: H.set.questions.map(function (q) { return { q: q.q, choices: q.choices, answer: +q.answer }; }),
      players: r.arr.map(function (p) {
        return { rank: r.map[p.key], name: p.name, sid: p.sid, score: p.score, correct: correctCount(p), answers: p.answers };
      })
    };
  }
  function saveResults(partial) {
    if (!H || !H.order.length) return null;
    var rec = buildRecord(partial);
    var all = store.get("quiz:results", []);
    all.unshift(rec);
    store.set("quiz:results", all.slice(0, 20));
    return rec;
  }

  /* ----- 진행 화면 그리기 ----- */
  function tiles(q, showResult) {
    var counts = [0, 0, 0, 0];
    if (showResult) players().forEach(function (p) { var a = p.answers[H.qi]; if (a) counts[a.c]++; });
    var max = Math.max.apply(null, counts.concat(1));
    return '<div class="qh-tiles' + (showResult ? " result" : "") + '">' + list(q.choices, function (c, k) {
      var right = k === +q.answer;
      return '<div class="qh-tile c' + k + (showResult ? (right ? " right" : " wrong") : "") + '">' +
        '<span class="qz-shape" aria-hidden="true">' + SHAPES[k] + "</span><span class=\"qh-tile-text\">" + esc(c) + "</span>" +
        (showResult ? '<span class="qh-tile-count">' + (right ? "✓ " : "") + counts[k] + "명</span>" +
          '<span class="qh-tile-bar" style="width:' + (counts[k] / max * 100) + '%"></span>' : "") +
      "</div>";
    }) + "</div>";
  }

  function renderHost() {
    if (!H) return;
    var body = $(".qh-body", H.root);
    var h = "";
    var n = H.set.questions.length;
    if (H.phase === "opening") {
      h = '<div class="qh-center"><div class="qz-spin" aria-hidden="true"></div><p>퀴즈 방을 여는 중…</p></div>';
    } else if (H.phase === "error") {
      h = '<div class="qh-center"><div class="qz-big" aria-hidden="true">⚠️</div><p>' + esc(H.err) + "</p>" +
        '<button type="button" class="btn btn-ghost" data-qh="close">닫기</button></div>';
    } else if (H.phase === "lobby") {
      var link = joinLink(H.pin);
      var qr = "";
      try {
        var gen = window.qrcode(0, "M");
        gen.addData(link);
        gen.make();
        qr = gen.createSvgTag({ cellSize: 6, margin: 2, scalable: true, alt: "퀴즈 입장 QR 코드" });
      } catch (e) { qr = '<p class="small">QR을 만들지 못했습니다. PIN으로 입장하세요.</p>'; }
      var localWarn = (location.protocol === "file:" || /^(localhost|127\.)/.test(location.hostname)) && !(Q.joinUrl || "").trim();
      var ps = players();
      h =
        '<div class="qh-lobby">' +
          '<div class="qh-qr">' + qr + '<p class="small">휴대폰 카메라로 찍으세요</p></div>' +
          '<div class="qh-pin-box">' +
            '<p class="qh-label">사이트의 <b>참여하기 › 실시간 퀴즈</b>에서 PIN 입력</p>' +
            '<div class="qh-pin" aria-label="PIN ' + H.pin.split("").join(" ") + '">' + H.pin.replace(/(\d{3})(\d{3})/, "$1 $2") + "</div>" +
            '<p class="qh-url">' + esc(joinBase().replace(/^https?:\/\//, "")) + "</p>" +
            (localWarn ? '<p class="qh-warn">⚠️ 지금은 내 컴퓨터 주소로 열려 있어 학생 휴대폰이 QR 주소에 접속할 수 없습니다. 배포한 사이트에서 진행하거나 설정(SITE_CONFIG)의 <b>quiz.joinUrl</b>에 배포 주소를 적어 주세요.</p>' : "") +
          "</div>" +
        "</div>" +
        '<div class="qh-players"><p class="qh-label">입장한 학생 <b>' + ps.filter(function (p) { return p.online; }).length + "</b>명</p>" +
          (ps.length ? '<ul class="qh-names">' + list(ps, function (p) { return '<li class="' + (p.online ? "" : "off") + '">' + esc(p.name) + "</li>"; }) + "</ul>"
            : '<p class="muted">학생이 들어오기를 기다리는 중…</p>') + "</div>" +
        '<div class="qh-actions"><span class="muted small">' + n + "문제 · 문제당 기본 " + H.time + "초</span>" +
          '<button type="button" class="btn btn-primary" data-qh="start"' + (online().length ? "" : " disabled") + ">퀴즈 시작 ▶</button></div>";
    } else if (H.phase === "question") {
      var q = curQ();
      var left = Math.max(0, H.timeMs - (Date.now() - H.qStart));
      h =
        '<div class="qh-qhead"><span class="badge badge-week">' + (H.qi + 1) + " / " + n + "</span>" +
          '<span class="qh-answered">0 / ' + online().length + "명 답변</span></div>" +
        '<div class="qh-qrow"><h2 class="qh-question">' + esc(q.q) + "</h2>" +
          '<div class="qh-time" style="--p:' + (left / H.timeMs * 100) + '%"><b>' + Math.ceil(left / 1000) + "</b></div></div>" +
        tiles(q, false) +
        '<div class="qh-actions"><span></span><button type="button" class="btn btn-ghost" data-qh="reveal">바로 정답 공개</button></div>';
    } else if (H.phase === "reveal") {
      var q2 = curQ();
      var right = players().filter(function (p) { return p.answers[H.qi] && p.answers[H.qi].correct; }).length;
      h =
        '<div class="qh-qhead"><span class="badge badge-week">' + (H.qi + 1) + " / " + n + '</span><span class="qh-answered">정답 ' + right + " / " + H.order.length + "명</span></div>" +
        '<h2 class="qh-question">' + esc(q2.q) + "</h2>" + tiles(q2, true) +
        (q2.explanation ? '<p class="qh-exp">💡 ' + esc(q2.explanation) + "</p>" : "") +
        '<div class="qh-actions"><span></span><button type="button" class="btn btn-primary" data-qh="leader">순위 보기 ▶</button></div>';
    } else if (H.phase === "leader") {
      var r = ranks();
      h =
        '<h2 class="qh-title">🏅 현재 순위</h2>' +
        '<ol class="qh-board">' + list(r.arr.slice(0, 5), function (p, i) {
          var a = p.answers[H.qi];
          return '<li><span class="qh-rank">' + (i + 1) + '</span><span class="qh-name">' + esc(p.name) + "</span>" +
            (a && a.correct ? '<span class="qh-gain">+' + a.points + "</span>" : "<span></span>") +
            '<span class="qh-score">' + p.score + "</span></li>";
        }) + "</ol>" +
        '<div class="qh-actions"><span class="muted small">' + (H.qi + 1) + " / " + n + "문제 완료</span>" +
          '<button type="button" class="btn btn-primary" data-qh="next">' + (H.qi + 1 < n ? "다음 문제 ▶" : "최종 결과 🏆") + "</button></div>";
    } else if (H.phase === "end") {
      var r2 = ranks();
      var top = r2.arr.slice(0, 3);
      var order = [top[1], top[0], top[2]];
      h =
        '<h2 class="qh-title">🏆 최종 결과</h2>' +
        '<div class="qh-podium">' + list(order, function (p, i) {
          if (!p) return '<div class="qh-pod empty"></div>';
          var place = [2, 1, 3][i];
          return '<div class="qh-pod p' + place + '"><span class="qh-pod-name">' + esc(p.name) + "</span><span class=\"qh-pod-score\">" + p.score + "점</span>" +
            '<div class="qh-pod-block">' + place + "</div></div>";
        }) + "</div>" +
        '<div class="qh-table"><table><thead><tr><th scope="col">순위</th><th scope="col">이름</th><th scope="col">정답</th><th scope="col">점수</th></tr></thead><tbody>' +
          list(r2.arr, function (p, i) { return "<tr><td>" + (i + 1) + "</td><td>" + esc(p.name) + "</td><td>" + correctCount(p) + " / " + n + "</td><td>" + p.score + "</td></tr>"; }) +
        "</tbody></table></div>" +
        '<div class="qh-actions"><span class="muted small">결과는 관리자 화면 › 퀴즈에도 저장됩니다.</span>' +
          '<span class="qh-btns"><button type="button" class="btn btn-ghost" data-qh="close">닫기</button>' +
          '<button type="button" class="btn btn-primary" data-qh="csv">⬇️ 결과 CSV 받기</button></span></div>';
    }
    body.innerHTML = h;
    refreshCount();
    var focus = $(".btn-primary:not([disabled])", body);
    if (focus && H.phase !== "question") focus.focus({ preventScroll: true });
  }

  function onHostClick(e) {
    if (!H) return;
    var b = e.target.closest("[data-qh]");
    if (!b || b.disabled) return;
    var a = b.dataset.qh;
    if (a === "close") hostClose();
    else if (a === "start") startQuestion(0);
    else if (a === "reveal") reveal();
    else if (a === "leader") { H.phase = "leader"; renderHost(); }
    else if (a === "next") next();
    else if (a === "csv") downloadCsv(H.saved || buildRecord(false));
  }

  /* ---------- 시작 ---------- */
  function init() {
    if (!$("#quiz")) return;
    renderHostPanel();
    // QR로 들어온 경우: ?quiz=123456
    var pin = new URLSearchParams(location.search).get("quiz");
    if (pin && /^\d{6}$/.test(pin)) {
      S.pin = pin;
      setTimeout(function () {
        var el = $("#quiz");
        el.classList.add("in");
        el.scrollIntoView({ block: "start" });
        var name = $("#qz-name");
        if (name) (name.value ? $(".quiz-join button[type=submit]") : name).focus({ preventScroll: true });
      }, 400);
    }
    renderStudent();

    var card = $("#quiz");
    card.addEventListener("submit", function (e) {
      if (!e.target.classList.contains("quiz-join")) return;
      e.preventDefault();
      var pinEl = $("#qz-pin"), nameEl = $("#qz-name");
      var p = pinEl.value.replace(/\D/g, ""), n = nameEl.value.trim();
      S.pin = p; S.name = n;
      if (!/^\d{6}$/.test(p)) { $(".qz-err").textContent = "PIN 6자리 숫자를 입력해 주세요."; pinEl.focus(); return; }
      if (!n) { $(".qz-err").textContent = "이름을 입력해 주세요."; nameEl.focus(); return; }
      S.err = "";
      studentConnect();
    });
    card.addEventListener("input", function (e) {
      if (e.target.id === "qz-pin") e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
    });
    card.addEventListener("click", function (e) {
      var c = e.target.closest(".qz-choice");
      if (c) { answer(+c.dataset.c); return; }
      var b = e.target.closest("[data-qz]");
      if (!b) return;
      var a = b.dataset.qz;
      if (a === "host") hostOpen($("#qz-set").value);
      else if (a === "retry") studentConnect();
      else if (a === "again") { cleanupStudent(); S.err = ""; S.pin = ""; setState("join"); }
    });
  }

  window.Quiz = { render: render, init: init, host: hostOpen, refreshHostPanel: renderHostPanel };

  /* ==========================================================
     관리자 화면 › 퀴즈 탭 (세트 편집 · AI 출제 · 지난 결과)
     ========================================================== */
  var QA = { editing: null, status: "", busy: false };

  function blankQ() { return { q: "", choices: ["", "", "", ""], answer: 0, time: (Q && Q.defaultTime) || 20, explanation: "" }; }

  function qaRender() {
    if (!Q) return '<p class="ap-empty">설정에 quiz 설정이 없습니다.</p>';
    if (QA.editing) return qaEditor();
    var results = store.get("quiz:results", []);
    return '<div class="qa">' +

  function localStorageHasKey() {

  /* ----- AI 요청문 ----- */
  function aiPrompt(panel) {
    var weeks = (window.Curriculum && window.Curriculum.weeks) || [];
    var picked = $$(".qa-weeks input:checked", panel).map(function (i) { return weeks[+i.value - 1]; }).filter(Boolean);
    var scope = picked.length
      ? picked.map(function (w) { return "- " + w.n + "주차 「" + w.data.title + "」: " + (w.data.topics || []).join(", "); }).join("\n")
      : "- 중국어 입문 전반 (발음·성조, 인사말, 자기소개, 숫자·날짜, 생활 회화)";
    var extra = ($("#qa-extra", panel).value || "").trim();
    var n = +$("#qa-n", panel).value || 5;
    var level = $("#qa-level", panel).value || "보통";
    return {
      n: n,
      text:
        "대학 교양 중국어 입문 수업에서 실시간 퀴즈로 쓸 4지선다 문제를 " + n + "개 만들어 주세요.\n\n" +
        "[수업] " + ((C.site && C.site.university) || "") + " 「" + ((C.site && C.site.courseName) || "교양중국어") + "」 — 중국어를 처음 배우는 대학생 대상, 한국어로 진행\n" +
        "[범위]\n" + scope + "\n" +
        (extra ? "[추가 요청] " + extra + "\n" : "") +
        "[난이도] " + level + "\n\n" +
        "규칙:\n" +
        "- 문제와 선택지는 한국어로 쓰고, 중국어는 간체자로 쓰며 필요하면 병음을 함께 적습니다.\n" +
        "- 선택지는 정확히 4개이고 정답은 하나입니다. 정답 위치는 문제마다 고르게 섞어 주세요.\n" +
        "- 학생이 휴대폰으로 빠르게 읽을 수 있도록 문제는 60자, 선택지는 25자 이내로 짧게 씁니다.\n" +
        "- 사실과 병음·성조 표기가 정확한지 꼭 확인하고, 애매하거나 정답이 둘인 문제는 만들지 않습니다.\n" +
        "- explanation에는 정답인 이유를 한두 문장으로 씁니다.\n" +
        "- answer는 정답 선택지의 번호입니다 (첫 번째 = 0).\n\n" +
        "답은 아래 JSON 형식으로만 주세요:\n" +
        '{"questions":[{"q":"문제","choices":["선택지1","선택지2","선택지3","선택지4"],"answer":0,"explanation":"해설"}]}'
    };
  }

  var SCHEMA = {
    type: "object",
    additionalProperties: false,
    required: ["questions"],
    properties: {
      questions: {
        type: "array",
        items: {
          type: "object",
          additionalProperties: false,
          required: ["q", "choices", "answer", "explanation"],
          properties: {
            q: { type: "string" },
            choices: { type: "array", items: { type: "string" } },
            answer: { type: "integer" },
            explanation: { type: "string" }
          }
        }
      }
    }
  };

  // Claude API 호출 (공식 TypeScript/JavaScript SDK를 브라우저에서 사용)
  async function askClaude(apiKey, prompt) {
    var mod = await import(SDK_URL);
    var Anthropic = mod.default || mod.Anthropic;
    var client = new Anthropic({ apiKey: apiKey, dangerouslyAllowBrowser: true });
    var res = await client.beta.messages.create({
      model: (Q && Q.aiModel) || "claude-opus-5-5",
      max_tokens: 16000,
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default", // 안전 분류기가 거절하면 서버가 다른 모델로 다시 시도
      system: "You write accurate, unambiguous multiple-choice quiz questions for a Korean university course that teaches beginner Mandarin Chinese. Write in Korean, use simplified Chinese characters, and double-check pinyin and tone marks.",
      messages: [{ role: "user", content: prompt }],
      output_config: { effort: "medium", format: { type: "json_schema", schema: SCHEMA } }
    });
    if (res.stop_reason === "refusal") throw new Error("AI가 이 요청에는 답하지 않았습니다. 범위나 추가 요청 문구를 바꿔 보세요.");
    if (res.stop_reason === "max_tokens") throw new Error("답이 너무 길어 잘렸습니다. 문제 수를 줄여 다시 시도해 주세요.");
    var text = res.content.filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("");
    return JSON.parse(text);
  }
  function aiErrorMessage(e) {
    var st = e && e.status;
    if (st === 401) return "API 키가 올바르지 않습니다. 키를 다시 확인해 주세요.";
    if (st === 403) return "이 API 키로는 사용할 수 없는 기능입니다. (권한 확인 필요)";
    if (st === 429) return "요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.";
    if (st === 400) return "요청이 거부되었습니다: " + ((e.error && e.error.error && e.error.error.message) || e.message);
    if (st >= 500) return "Anthropic 서버에 일시적인 문제가 있습니다. 잠시 후 다시 시도해 주세요.";
    if (e instanceof SyntaxError) return "AI 답을 읽지 못했습니다. 다시 시도해 주세요.";
    if (!st && /fetch|network|import|load/i.test(String(e && e.message))) return "인터넷 연결을 확인해 주세요. (AI 기능을 불러오지 못함)";
    return (e && e.message) || "알 수 없는 오류";
  }

  // AI 답을 퀴즈 문제 형식으로 정리 (잘못된 문제는 빼고 개수를 알려 줌)
  function normalize(data) {
    if (typeof data === "string") {
      var t = data.replace(/```(?:json)?/gi, "");
      var a = t.indexOf("{"), b = t.lastIndexOf("}");
      data = JSON.parse(a >= 0 && b > a ? t.slice(a, b + 1) : t);
    }
    var arr = Array.isArray(data) ? data : (data && data.questions) || [];
    var ok = [], bad = 0;
    arr.forEach(function (x) {
      var ch = (x && x.choices || []).map(function (c) { return String(c).trim(); }).filter(Boolean);
      var ans = Math.floor(+x.answer);
      if (!x || !String(x.q || "").trim() || ch.length !== 4 || !(ans >= 0 && ans < 4)) { bad++; return; }
      ok.push({ q: String(x.q).trim(), choices: ch, answer: ans, time: (Q && Q.defaultTime) || 20, explanation: String(x.explanation || "").trim() });
    });
    return { list: ok, bad: bad };
  }

  function readEditor(panel) {
    var s = QA.editing;
    var t = $("#qa-title", panel);
    if (t) s.title = t.value;
    $$(".qa-q", panel).forEach(function (el) {
      var q = s.questions[+el.dataset.i];
      if (!q) return;
      q.q = $('[data-f="q"]', el).value;
      for (var k = 0; k < 4; k++) q.choices[k] = $('[data-f="c' + k + '"]', el).value;
      var r = $('[data-f="answer"]:checked', el);
      q.answer = r ? +r.value : 0;
      q.time = Math.max(5, Math.min(120, +$('[data-f="time"]', el).value || 20));
      q.explanation = $('[data-f="explanation"]', el).value;
    });
  }

  function qaAfter(panel, ctx) {
    var root = $(".qa", panel);
    if (!root) return;
    function rerender() { var y = panel.scrollTop; panel.innerHTML = qaRender(); qaAfter(panel, ctx); panel.scrollTop = y; }
    function status(msg) { QA.status = msg; var p = $(".qa-status", panel); if (p) p.textContent = msg; }
    function addGenerated(res) {
      readEditor(panel);
      QA.editing.questions = QA.editing.questions.filter(function (q) { return q.q.trim() || q.choices.some(Boolean); }).concat(res.list);
      QA.status = res.list.length + "문제를 받았습니다." + (res.bad ? " (형식이 맞지 않는 " + res.bad + "문제는 뺐습니다)" : "") + " 내용을 꼭 확인한 뒤 저장하세요.";
      rerender();
    }

    root.addEventListener("click", function (e) {
      var b = e.target.closest("[data-qa]");
      if (!b || b.disabled) return;
      var a = b.dataset.qa, i = +b.dataset.i;
      if (a === "new") { QA.editing = { _new: true, id: "s" + Date.now().toString(36), title: "", questions: [] }; QA.status = ""; rerender(); }
      else if (a === "edit") {
        var s = sets().filter(function (x) { return x.id === b.dataset.id; })[0];
        QA.editing = JSON.parse(JSON.stringify(s)); QA.status = ""; rerender();
      }
      else if (a === "del") {
        if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "정말 삭제?"; return; }
        var cfg = JSON.parse(JSON.stringify(C));
        cfg.quiz.sets = cfg.quiz.sets.filter(function (x) { return x.id !== b.dataset.id; });
        ctx.saveOverride(cfg, "quiz");
      }
      else if (a === "run") { ctx.close(); setTimeout(function () { hostOpen(b.dataset.id); }, 250); }
      else if (a === "csv") { var r = store.get("quiz:results", [])[i]; if (r) downloadCsv(r); }
      else if (a === "cancel") { QA.editing = null; QA.status = ""; rerender(); }
      else if (a === "addq") { readEditor(panel); QA.editing.questions.push(blankQ()); rerender(); }
      else if (a === "rmq") { readEditor(panel); QA.editing.questions.splice(i, 1); rerender(); }
      else if (a === "up" || a === "down") {
        readEditor(panel);
        var qs = QA.editing.questions, j = a === "up" ? i - 1 : i + 1;
        if (j >= 0 && j < qs.length) { var tmp = qs[i]; qs[i] = qs[j]; qs[j] = tmp; }
        rerender();
      }
      else if (a === "copy") {
        var pr = aiPrompt(panel).text;
        (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(pr) : Promise.reject())
          .then(function () { status("요청문을 복사했습니다. AI 채팅에 붙여넣으세요."); })
          .catch(function () { $("#qa-paste", panel).value = pr; status("자동 복사가 안 되어 아래 칸에 요청문을 넣었습니다. 직접 복사해 주세요."); });
      }
      else if (a === "paste") {
        try {
          var res = normalize($("#qa-paste", panel).value);
          if (!res.list.length) { status("불러올 수 있는 문제가 없습니다. AI 답 전체(JSON)를 붙여넣었는지 확인해 주세요."); return; }
          addGenerated(res);
        } catch (err) { status("붙여넣은 내용을 읽지 못했습니다. AI 답의 { 부터 } 까지 전부 붙여넣어 주세요."); }
      }
      else if (a === "ai") {
        var key = $("#qa-key", panel).value.trim();
        if (!key) { status("API 키를 입력해 주세요. (키가 없으면 방법 2를 쓰세요)"); $("#qa-key", panel).focus(); return; }
        if (window.ApiKeys) window.ApiKeys.set("anthropic", key, { remember: $("#qa-remember", panel).checked });
        var p = aiPrompt(panel);
        QA.busy = true;
        readEditor(panel);
        QA.status = "Claude가 " + p.n + "문제를 만드는 중입니다… (보통 10~40초)";
        rerender();
        askClaude(key, p.text).then(function (data) {
          QA.busy = false;
          var res2 = normalize(data);
          if (!res2.list.length) { QA.status = "쓸 수 있는 문제를 받지 못했습니다. 다시 시도해 주세요."; rerender(); return; }
          addGenerated(res2);
        }).catch(function (err) {
          QA.busy = false;
          QA.status = "⚠️ " + aiErrorMessage(err);
          rerender();
        });
      }
      else if (a === "save") {
        readEditor(panel);
        var s2 = QA.editing, err2 = $(".qa-err", panel);
