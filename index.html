.hdr-pop-title small { font-weight: 500; color: var(--muted); font-size: .8rem; }
.hdr-pop .login-form { gap: 10px; }
.hdr-pop .login-join { margin: 0; text-align: center; }
.hdr-pop-link { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; border: 0; background: none; font: inherit; color: var(--text); text-decoration: none; cursor: pointer; }
.hdr-pop-link:hover, .hdr-pop-link:focus-visible { background: var(--pink-50); }
.hdr-logout { color: var(--highlight); border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; margin-top: 4px; }
.lock-btn:hover { background: var(--pink-50); }
.menu-toggle { background: transparent; }
.menu-toggle span { background: var(--plum-900); }

/* 첫 화면 */
.hero { position: relative; padding: 64px 0 44px; background: #fff; overflow: hidden; }
.hero::before, .hero::after { display: none; }
.hero-visual {
  position: absolute; top: 0; right: 0; bottom: 140px;
  width: min(50vw, 800px);
  border-radius: 50% 0 0 50% / 62% 0 0 62%;
  overflow: hidden;
  background: var(--pink-50);
}
.hero-visual svg, .hero-visual img { display: block; width: 100%; height: 100%; object-fit: cover; }
.hero-grid { position: relative; z-index: 1; display: grid; gap: 36px; }
.hero-text { max-width: 560px; text-align: left; }
.hero-badge { background: #fff; border: 1px solid var(--line); color: var(--lav-600); margin-bottom: 18px; }
.hero h1 {
  display: block;
  font-size: clamp(2rem, 4.1vw, 3.1rem);
  line-height: 1.3;
  letter-spacing: -.035em;
  font-weight: 800;
  color: var(--text);
  margin: 0 0 18px;
}
.hero h1 .hl { font-style: normal; color: var(--highlight); }
.hero-sub { font-size: 1.1rem; color: var(--plum-700); margin: 0 0 8px; }
.hero-sub .zh { color: var(--lav-400); font-size: .95em; margin-left: 4px; }
.hero-desc { margin: 0 0 26px; max-width: 500px; color: var(--muted); font-size: 1rem; }
.hero-actions { justify-content: flex-start; }
.hero-actions .btn { min-width: 0; }

/* 자주 찾는 메뉴 (아이콘 바로가기) */
.hero-quick { display: grid; grid-template-columns: 128px auto; gap: 18px; align-items: start; }
.hq-title {
  margin: 14px 0 0; padding-bottom: 10px;
  font-weight: 800; color: var(--lav-600); font-size: .95rem;
  border-bottom: 2px solid var(--lav-200);
  position: relative;
}
.hq-title::after { content: ""; position: absolute; right: -4px; top: -2px; width: 7px; height: 7px; border-radius: 50%; background: var(--pink-500); }
.hq-grid { display: grid; grid-template-columns: repeat(3, 118px); gap: 14px; }
.hq-tile {
  aspect-ratio: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 26px;
  box-shadow: 0 12px 28px -18px rgba(22, 35, 24, .45);
  color: var(--text); text-decoration: none; text-align: center;
  font-size: .86rem; font-weight: 600; line-height: 1.3; padding: 8px;
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.hq-tile:hover { transform: translateY(-4px); border-color: var(--pink-200); box-shadow: 0 18px 32px -18px rgba(22, 35, 24, .5); }
.hq-tile:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 3px; }
.hq-ic { display: grid; place-items: center; }
.hq-ic.t0 { color: var(--pink-500); }
.hq-ic.t1 { color: var(--lav-600); }

/* 요약 정보 띠 */
.info-strip {
  position: relative; z-index: 1;
  margin: 44px 0 0;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
}
.is-item { display: flex; gap: 12px; align-items: center; padding: 18px 20px; min-width: 0; }
.is-item + .is-item { border-left: 1px solid var(--line); }
.is-icon { font-size: 1.5rem; flex-shrink: 0; }
.is-item dt { font-size: .78rem; font-weight: 700; color: var(--accent); }
.is-item dd { margin: 0; font-weight: 600; font-size: .93rem; line-height: 1.45; }

/* 숫자 카드 */
.stats-section { padding: 48px 0 0; }
.stat-card { box-shadow: none; }
.stat-card strong { background: none; -webkit-background-clip: border-box; background-clip: border-box; color: var(--text); }
.stat-card strong small { color: var(--pink-500); }

/* 공지사항 (소식 카드 + 강조 카드) */
.notices-section { padding: 80px 0 40px; }
.sec-row { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.sec-title { margin: 0; font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 800; letter-spacing: -.03em; }
.sec-count { color: var(--muted); font-size: .9rem; }
.sec-count b { color: var(--accent); }
.plus-btn {
  margin-left: auto; width: 42px; height: 42px; border: 0; border-radius: 50%;
  background: var(--plum-900); color: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer;
}
.plus-btn:hover { background: var(--pink-600); }
.plus-btn:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.news-grid { display: grid; grid-template-columns: 1fr 250px; gap: 18px; align-items: stretch; }
.news-grid.no-promo { grid-template-columns: 1fr; }
.news-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; align-items: start; }
.news-card {
  display: flex; flex-direction: column; gap: 10px;
  min-height: 236px; padding: 24px;
  background: #fff; border: 1px solid var(--line); border-radius: 20px;
  box-shadow: var(--shadow);
}
.news-card.extra { display: none; }
.news-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.news-pager { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
.news-pager button {
  min-width: 38px; height: 38px; padding: 0 10px;
  display: inline-grid; place-items: center;
  border: 1px solid var(--line); border-radius: 999px;
  background: #fff; color: var(--plum-700);
  font: inherit; font-weight: 700; font-size: .92rem; font-variant-numeric: tabular-nums;
  cursor: pointer; transition: background .2s, border-color .2s, color .2s;
}
.news-pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.news-pager .pg-num.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.news-pager button:disabled { opacity: .35; cursor: default; }
.news-pager button:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.news-pager svg { width: 18px; height: 18px; }
.news-card.important { border-color: var(--pink-200); }
.news-meta { display: flex; align-items: baseline; gap: 10px; }
.news-meta time { font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.news-tag { font-size: .78rem; font-weight: 700; color: var(--lav-600); }
.news-card.important .news-tag { color: var(--pink-500); }
.news-year { margin-left: auto; color: var(--muted); font-size: .78rem; }
.news-card h3 { margin: 0; font-size: 1.08rem; line-height: 1.45; letter-spacing: -.02em; }
.news-body {
  margin: 0; color: var(--muted); font-size: .92rem;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.news-card.open .news-body { display: block; -webkit-line-clamp: unset; overflow: visible; }
.news-more {
  margin-top: auto; align-self: flex-start; padding: 0;
  border: 0; background: none; cursor: pointer;
  font: inherit; font-size: .85rem; font-weight: 600; color: var(--plum-700);
  text-decoration: underline; text-underline-offset: 3px;
}
.news-more:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.promo-card {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; gap: 8px;

}

.promo-card:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 3px; }
.promo-badge { align-self: flex-start; padding: 3px 12px; border-radius: 999px; background: rgba(255, 255, 255, .2); border: 1px solid rgba(255, 255, 255, .55); font-size: .78rem; font-weight: 700; }
.promo-card h3 { margin: 6px 0 0; font-size: 1.3rem; line-height: 1.4; letter-spacing: -.02em; }
.promo-card p { margin: 0; opacity: .92; font-weight: 600; }
.promo-btn { position: relative; z-index: 1; margin-top: auto; align-self: flex-start; padding: 9px 16px; border-radius: 999px; background: #fff; color: var(--pink-600); font-weight: 700; font-size: .88rem; }
.promo-deco { position: absolute; right: -16px; bottom: -22px; font-size: 7rem; opacity: .3; transform: rotate(-14deg); pointer-events: none; }

/* 강의 장점: 색 띠 위 카드 넘기기 */
.band-section { padding: 90px 0; overflow: hidden; }
.slider.band-wrap { display: grid; grid-template-columns: 290px minmax(0, 1fr); align-items: center; padding: 0; }
.band-intro { padding-right: 28px; }
.band-kicker { margin: 0; color: var(--accent); font-weight: 800; font-size: 1.15rem; }
.band-intro h2 { margin: 2px 0 12px; font-size: clamp(1.8rem, 3.4vw, 2.5rem); font-weight: 800; letter-spacing: -.035em; color: var(--lav-600); }
.band-lead { margin: 0 0 24px; color: var(--muted); }
.band-ctrl { display: flex; align-items: center; gap: 10px; }
.band-count { display: flex; align-items: center; gap: 8px; margin-right: 8px; color: var(--muted); font-variant-numeric: tabular-nums; }
.band-count b { color: var(--text); }
.band-count i { display: inline-block; width: 32px; height: 2px; background: var(--plum-900); }
.band-ctrl .slider-btn { position: static; width: 46px; height: 46px; border: 1.5px solid var(--line); background: #fff; color: var(--text); box-shadow: none; }
.band-ctrl .slider-btn:hover:not(:disabled) { border-color: var(--plum-900); background: #fff; }
.band {
  position: relative;
  padding: 36px 0 36px 36px;
  margin-right: calc(-1 * (max(0px, (100vw - 1120px) / 2) + 20px));
}
.band::before { content: ""; position: absolute; inset: 0; background: var(--band); border-radius: 170px 0 0 170px; }
.band .slider-track { position: relative; grid-auto-columns: 232px; column-gap: 18px; padding: 4px 36px 6px 0; }
.band .slide {
  min-height: 0; padding: 0; overflow: hidden;
  background: #fff; border: 0; border-radius: 22px;
  box-shadow: 0 14px 28px -18px rgba(22, 35, 24, .5);
}
.slide-img { position: relative; height: 150px; display: grid; place-items: center; }
.slide-img.t0 { background: #e6f3da; }
.slide-img.t1 { background: #e2f1ea; }
.slide-img.t2 { background: #fff1e2; }
.slide-emoji { font-size: 4rem; }
.band .slide-num {
  left: 14px; right: auto; top: 14px;
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--pink-500); color: #fff; font-size: .82rem;
}
.slide-body { padding: 16px 18px 22px; text-align: center; }
.band .slide h3 { margin: 0 0 6px; font-size: 1.05rem; }
.band .slide p { margin: 0; font-size: .9rem; }

/* 하단 안내 배너 (교수자) */
.footer { margin-top: 30px; padding: 20px 0 0; background: transparent; border-top: 0; }
.info-banner {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; align-items: center;
  margin-bottom: 64px; padding: 40px 48px;
  background: var(--beige); border-radius: 30px;
}
.info-banner::before { content: "🌸"; position: absolute; right: 230px; top: 18px; font-size: 2rem; opacity: .35; transform: rotate(18deg); }
.ib-text h2 { margin: 0 0 14px; font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; }
.ib-person { margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.ib-person strong { font-size: 1.2rem; }
.ib-person .zh { color: var(--muted); }
.ib-role { color: #8a5a44; font-weight: 700; font-size: .92rem; }
.ib-bio { margin: 6px 0 14px; max-width: 640px; color: var(--plum-700); }
.ib-en { color: var(--muted); font-size: .95rem; font-weight: 600; letter-spacing: 0; }
.ib-aff { margin: 6px 0 12px; color: #8a5a44; font-weight: 700; font-size: .95rem; line-height: 1.55; }
.ib-pos { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ib-pos li { padding: 5px 12px; border-radius: 999px; background: #fff; border: 1px solid #e3d5c6; color: var(--plum-700); font-size: .85rem; font-weight: 600; }
.ib-pos li::before { content: "★ "; color: var(--accent); }
.ib-res { grid-column: 1 / -1; padding-top: 22px; border-top: 1px dashed #dccbb9; }
.ib-res h3 { margin: 0 0 12px; font-size: 1.05rem; }
.ib-res-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ib-res-list a {
  display: flex; align-items: center; gap: 10px; height: 100%;
  padding: 12px 14px; border-radius: 14px;
  background: #fff; border: 1px solid #eadfd3;
  color: var(--text); text-decoration: none; font-weight: 600; font-size: .92rem;
  transition: border-color .2s, transform .2s;
}
.ib-res-list a:hover { border-color: var(--accent); transform: translateY(-2px); }
.ib-res-list a:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.ib-res-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--plum-900); flex-shrink: 0; }
.ib-res-label { flex: 1; min-width: 0; }
.ib-res-go { color: var(--accent); font-weight: 800; }
.ib-list { margin: 0 0 22px; display: grid; gap: 4px; }
.ib-list div { display: flex; gap: 10px; font-size: .93rem; }
.ib-list dt { min-width: 84px; font-weight: 700; color: #8a5a44; }
.ib-list dt::before { content: "• "; }
.ib-list dd { margin: 0; overflow-wrap: anywhere; }
.ib-list a { color: var(--pink-600); }
.ib-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.ib-visual { display: grid; place-items: center; }
.info-banner .avatar { width: 200px; height: 200px; font-size: 4rem; box-shadow: 0 0 0 10px rgba(255, 255, 255, .7); }

/* 바닥글 */
.footer-main { background: #fff; border-top: 1px solid var(--line); padding: 26px 0 40px; }
.footer-top { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.footer-main .footer-brand { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; }
.footer-links { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.footer-links a { color: var(--plum-700); text-decoration: none; font-size: .88rem; font-weight: 600; }
.footer-links a:first-child { color: var(--lav-600); }
.footer-links a:hover { color: var(--accent); }
.footer-info { padding-top: 16px; font-size: .84rem; color: var(--muted); }
.footer-info p { margin: 2px 0; }
.footer-info .copy { margin: 0 0 6px; color: var(--plum-700); }
.footer-sites a { color: var(--accent); font-weight: 600; text-decoration: none; }
.footer-sites a:hover { text-decoration: underline; text-underline-offset: 3px; }
.footer-sites a:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; border-radius: 4px; }
.dot-sep { color: var(--muted); }

/* 맨 위로 버튼: 흰 원 */
.to-top { background: #fff; color: var(--text); border: 1px solid var(--line); box-shadow: 0 8px 24px -10px rgba(22, 35, 24, .35); }
.to-top:hover { color: var(--accent); }

@media (max-width: 1000px) {
  .hero-visual { width: 44vw; }
  .hq-grid { grid-template-columns: repeat(3, 100px); }
  .hero-quick { grid-template-columns: 1fr; gap: 10px; }
  .hq-title { justify-self: start; margin: 0; }
  .info-strip { grid-template-columns: repeat(2, 1fr); }
  .is-item:nth-child(3) { border-left: 0; }
  .is-item:nth-child(n+3) { border-top: 1px solid var(--line); }
  .news-grid { grid-template-columns: 1fr; }
  .ib-res-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .news-cards { grid-template-columns: repeat(2, 1fr); }
  .promo-card { min-height: 180px; }
  .slider.band-wrap { grid-template-columns: 1fr; gap: 28px; }
  .band-intro { padding-right: 0; }
}
@media (max-width: 860px) {
  .nav a { font-size: 1rem; padding: 13px 16px; border-radius: 12px; }
  .nav a.active { background: var(--pink-50); }
  .nav a.active::after { display: none; }
}
@media (max-width: 640px) {
  .hdr-user-btn { width: 40px; padding: 0; justify-content: center; }
  .hdr-user-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .hdr-pop { position: fixed; top: 112px; left: 16px; right: 16px; width: auto; }
  .util-right span { display: none; }
  .util-links a { padding: 0 8px; }
  .hero { padding: 0 0 32px; }
  .hero-visual { position: relative; inset: auto; width: auto; height: 210px; margin: 0 0 26px; border-radius: 0 0 40px 40px; }
  .hero h1 { font-size: 1.85rem; }
  .hero-actions .btn { flex: 1 1 140px; }
  .hq-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .hq-tile { border-radius: 20px; font-size: .8rem; }
  .hq-tile svg { width: 26px; height: 26px; }
  .info-strip { grid-template-columns: 1fr; margin-top: 30px; }
  .is-item + .is-item { border-left: 0; border-top: 1px solid var(--line); }
  .notices-section { padding: 56px 0 24px; }
  .news-cards { grid-template-columns: 1fr; }
  .news-card { min-height: 0; padding: 20px; }
  .band-section { padding: 60px 0; }
  .band { padding: 26px 0 26px 22px; margin-right: -16px; }
  .band::before { border-radius: 90px 0 0 90px; }
  .band .slider-track { grid-auto-columns: 74%; padding-right: 22px; }
  .info-banner { grid-template-columns: 1fr; padding: 28px 22px; text-align: left; margin-bottom: 40px; }
  .ib-visual { order: -1; justify-self: start; }
  .info-banner .avatar { width: 96px; height: 96px; font-size: 2.2rem; box-shadow: 0 0 0 6px rgba(255, 255, 255, .7); }
  .info-banner::before { right: 22px; }
  .ib-res-list { grid-template-columns: 1fr; }
  .ib-actions .btn { flex: 1 1 auto; white-space: nowrap; padding: 12px 16px; }
  .band-ctrl .slider-btn { display: grid; width: 40px; height: 40px; }
  .footer-top { flex-direction: column; align-items: flex-start; }
}
/* ==========================================================
   주차별 AI 학습 자료
   ========================================================== */
.wk-extra { margin-top: 20px; }
.wk-extra:empty { display: none; }
.wk-admin { display: none; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 12px; border: 1.5px dashed var(--pink-300); border-radius: 14px; background: var(--pink-50); }
body.is-admin .wk-admin { display: flex; }
.wk-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.wk-tabs button { flex-shrink: 0; border: 0; background: none; font: inherit; font-size: .92rem; font-weight: 600; color: var(--muted); padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.wk-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.wk-tabs button:hover { color: var(--text); }
.wk-tabs button:focus-visible { outline: 3px solid var(--lav-400); outline-offset: -3px; border-radius: 8px; }
.wk-panel { padding-top: 16px; }

/* 문장 */
.ws-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.ws-filter, .ws-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ws-filter .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.ws-toggle, .ws-rate { display: inline-flex; align-items: center; gap: 5px; font-size: .88rem; }
.ws-rate select { font: inherit; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
.ws-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 560px; overflow-y: auto; padding-right: 4px; }
.ws-item { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 14px; background: #fff; border: 1px solid var(--line); transition: border-color .2s, background .2s; }
.ws-item.speaking { border-color: var(--accent); background: var(--pink-50); }
.ws-say { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--pink-200); background: #fff; cursor: pointer; font-size: 1rem; }
.ws-say:hover { background: var(--pink-50); }
.ws-say:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.ws-text p { margin: 0; }
.ws-zh { font-size: 1.2rem; font-weight: 600; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
.ws-py { color: var(--accent-2); font-size: .92rem; }
.ws-ko { color: var(--text); font-size: .92rem; }
.ws-note { color: var(--muted); font-size: .8rem; margin-top: 2px !important; }
.no-py .ws-py, .no-ko .ws-ko, .no-ko .ws-note { display: none; }
.ws-cat { font-size: .74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--pink-50); color: var(--accent); white-space: nowrap; }
.ws-cat.c-문법 { background: var(--lav-50); color: var(--lav-600); }
.ws-cat.c-문형 { background: #fff3e6; color: #b35a00; }

/* 이미지 */
.wi-grid, .yt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.wi, .yt { margin: 0; }
.wi-frame, .yt-frame { position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: linear-gradient(120deg, var(--pink-50), var(--lav-50), var(--pink-50)); background-size: 200% 100%; animation: wi-shimmer 1.6s linear infinite; }
.wi-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s; }
.wi-frame.loaded { animation: none; }
.wi-frame.loaded img { opacity: 1; }
.wi-frame.failed { animation: none; }
.wi-frame.failed img { display: none; }
.wi-wait { position: absolute; inset: 0; display: grid; place-items: center; font-size: .85rem; color: var(--muted); }
.wi-frame.loaded .wi-wait { display: none; }
.wi figcaption, .yt figcaption { margin-top: 8px; font-size: .9rem; }
.yt-frame { animation: none; background: #000; }
.yt-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
@keyframes wi-shimmer { to { background-position: -200% 0; } }

/* 온라인 퀴즈 */
.pq-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: pq; }
.pq { padding: 14px 16px; border-radius: 16px; background: #fff; border: 1.5px solid var(--line); counter-increment: pq; }
.pq.right { border-color: var(--pink-300); background: var(--pink-50); }
.pq.wrong { border-color: #f1b3aa; background: #fff6f4; }
.pq-q { margin: 0 0 10px; font-weight: 600; }
.pq-q::before { content: counter(pq) ". "; color: var(--accent); }
.pq-type { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; margin-right: 8px; border-radius: 999px; background: var(--lav-50); color: var(--lav-600); vertical-align: 2px; }
.pq-type.t-ox { background: #fff3e6; color: #b35a00; }
.pq-type.t-blank { background: #eef1ff; color: #4a55c4; }
.pq-type.t-order { background: #fdeef4; color: #b23a6b; }
.pq-blank { display: inline-block; min-width: 3em; border-bottom: 2px solid var(--accent); text-align: center; color: var(--accent); }
.pq-choices, .pq-ox { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pq-opt { position: relative; display: block; cursor: pointer; }
.pq-opt input { position: absolute; opacity: 0; }
.pq-opt span { display: block; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; }
.pq-opt input:checked + span { border-color: var(--accent); background: var(--pink-50); font-weight: 700; }
.pq-opt input:focus-visible + span { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.pq-input { font: inherit; font-size: 1.1rem; width: 9em; padding: 9px 12px; border-radius: 12px; border: 1.5px solid var(--line); }
.pq-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--pink-100); }
.pq-built { min-height: 48px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 8px; margin-bottom: 8px; border-radius: 12px; border: 1.5px dashed var(--pink-300); background: #fff; }
.pq-ph { color: var(--muted); font-size: .85rem; }
.pq-tokens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pq-tok { font: inherit; font-size: 1.05rem; padding: 7px 12px; border-radius: 10px; border: 1.5px solid var(--lav-200); background: var(--lav-50); cursor: pointer; }
.pq-built .pq-tok { background: var(--pink-50); border-color: var(--pink-300); }
.pq-tok:focus-visible { outline: 3px solid var(--lav-400); outline-offset: 2px; }
.pq-fb { margin: 8px 0 0; font-size: .88rem; }
.pq-fb:empty { display: none; }
.pq-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 14px; }
.pq-score { margin: 0 auto 0 0; font-weight: 700; color: var(--accent); }

/* 문화 슬라이드 (모션 그래픽) */
.cs { position: relative; border-radius: 22px; overflow: hidden; background: #10140f; color: #fff; outline: none; }
.cs:focus-visible { box-shadow: 0 0 0 3px var(--lav-400); }
.cs-stage { position: relative; aspect-ratio: 16 / 9; min-height: 300px; }
.cs-slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .8s ease, visibility .8s; }
.cs-slide.on { opacity: 1; visibility: visible; }
.cs-bg { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(135deg, hsl(var(--h1) 70% 38%), hsl(var(--h2) 75% 22%)); }
.cs-slide.on .cs-bg { animation: cs-kenburns 9s ease-out both; }
.cs-orb { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .55; mix-blend-mode: screen; }
.cs-orb.o1 { width: 46%; aspect-ratio: 1; right: -10%; top: -20%; background: radial-gradient(circle, hsl(var(--h2) 90% 70%), transparent 70%); animation: cs-float 9s ease-in-out infinite; }
.cs-orb.o2 { width: 30%; aspect-ratio: 1; left: -6%; bottom: -14%; background: radial-gradient(circle, hsl(var(--h1) 95% 72%), transparent 70%); animation: cs-float 11s ease-in-out infinite reverse; }
.cs-orb.o3 { width: 14%; aspect-ratio: 1; left: 48%; top: 12%; background: radial-gradient(circle, #fff, transparent 70%); opacity: .35; animation: cs-float 7s ease-in-out infinite; }
.cs-ring { position: absolute; width: 60%; aspect-ratio: 1; right: -18%; bottom: -40%; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, .25); animation: cs-spin 40s linear infinite; }
.cs-big { position: absolute; right: 4%; top: 50%; transform: translateY(-50%); font-size: clamp(5rem, 20vw, 13rem); font-weight: 800; line-height: 1; color: rgba(255, 255, 255, .1); font-family: "Noto Serif SC", serif; }
.cs-slide.on .cs-big { animation: cs-big 1.4s cubic-bezier(.2, .8, .2, 1) both; }
.cs-content { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 6% 8% 12%; max-width: 680px; }
.cs-num { font-size: .8rem; letter-spacing: .15em; opacity: .75; }
.cs-emoji { font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1; }
.cs-title { margin: 0; font-size: clamp(1.3rem, 3.4vw, 2rem); font-weight: 800; letter-spacing: -.02em; }
.cs-zh { margin: 0; font-size: 1.1rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

<!-- ============================================================
     ③ 동작 코드 (보통은 고칠 필요가 없습니다)
     ============================================================ -->
<script>
/* 관리자 화면의 'index.html 내려받기'에 쓰려고, 화면을 그리기 전의 페이지 원본을 보관합니다. */
window.__PAGE_SOURCE = "<!doctype html>\n" + document.documentElement.outerHTML;

/* ######################################################## config-loader */
/* ==========================================================
   관리자 편집본 불러오기
   관리자 화면에서 '적용하기'를 누르면 고친 설정이 이 브라우저에 저장되고,
   이 스크립트가 원래 설정 대신 그 편집본을 씁니다.
   (다른 방문자에게는 보이지 않습니다. 모두에게 반영하려면
    관리자 화면 > 설정 파일 > '설정 파일 저장'으로 index.html을 바꿔 올리세요.)
   ========================================================== */
(function () {
  "use strict";
  window.SITE_CONFIG_FILE = window.SITE_CONFIG; // 원래 설정
  try {
    var raw = localStorage.getItem("kcn:configOverride");
    if (raw) {
      var o = JSON.parse(raw);
      if (o && o.site) {
        window.SITE_CONFIG = o;
        window.SITE_CONFIG_OVERRIDDEN = true;
      }
    }
  } catch (e) { /* 저장소를 못 쓰면 원본 사용 */ }
})();

/* ######################################################## sha256 */
/* ==========================================================
   SHA-256 (비밀번호·명단 확인용)
   - 비밀번호 원문을 코드에 두지 않고 해시값만 비교합니다.
   - 서버 없이 file:// 에서도 동작하도록 순수 자바스크립트로 작성했습니다.
   ========================================================== */
(function () {
  "use strict";

  var K = [], H0 = [];
  (function () {
    // 처음 64개 소수의 세제곱근/제곱근 소수부로 상수를 만듭니다 (표준 정의)
    var n = 2, found = 0;
    function isPrime(x) { for (var d = 2; d * d <= x; d++) if (x % d === 0) return false; return true; }
    function frac(x) { return ((x - Math.floor(x)) * 4294967296) | 0; }
    while (found < 64) {
      if (isPrime(n)) {
        if (found < 8) H0[found] = frac(Math.pow(n, 1 / 2));
        K[found] = frac(Math.pow(n, 1 / 3));
        found++;
      }
      n++;
    }
  })();

  function utf8(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
        c = 0x10000 + ((c - 0xd800) << 10) + (str.charCodeAt(++i) - 0xdc00);
      }
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c < 0x10000) out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      else out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

  function sha256(str) {
    var bytes = utf8(String(str));
    var l = bytes.length;
    var nWords = Math.ceil((l + 9) / 64) * 16;
    var w = new Array(nWords);
    for (var i = 0; i < nWords; i++) w[i] = 0;
    for (i = 0; i < l; i++) w[i >> 2] |= bytes[i] << (24 - (i % 4) * 8);
    w[l >> 2] |= 0x80 << (24 - (l % 4) * 8);
    w[nWords - 1] = (l * 8) >>> 0;
    w[nWords - 2] = Math.floor((l * 8) / 4294967296);

    var H = H0.slice();
    var W = new Array(64);
    for (var j = 0; j < nWords; j += 16) {
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (var t = 0; t < 64; t++) {
        if (t < 16) W[t] = w[j + t] | 0;
        else {
          var x = W[t - 15], y = W[t - 2];
          var s0 = rotr(x, 7) ^ rotr(x, 18) ^ (x >>> 3);
          var s1 = rotr(y, 17) ^ rotr(y, 19) ^ (y >>> 10);
          W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0;
        }
        var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K[t] + W[t]) | 0;
        var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    return H.map(function (v) { return ("00000000" + (v >>> 0).toString(16)).slice(-8); }).join("");
  }

  var root = typeof window !== "undefined" ? window : globalThis;
  root.sha256 = sha256;
  if (typeof module !== "undefined") module.exports = sha256;
})();

/* ######################################################## curriculum */
/* ==========================================================
   커리큘럼 · 일정 스크립트
   - 주차별 펼침 목록 (날짜·장소·학습 내용·영상·과제)
   - 과제 마감 카운트다운
   - 월간 수업 달력
   내용은 설정(SITE_CONFIG)의 curriculum.weeks 와 schedule 에서 고칩니다.
   ========================================================== */
(function () {
  "use strict";

  var C = window.SITE_CONFIG || {};
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];

  /* ---------- 도우미 ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function list(arr, fn) { return (arr || []).map(fn).join(""); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  // "2026-03-03" → 그 날 0시 (브라우저 지역 시간)
  function parseDate(s) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  // "2026-03-16T23:59" → 그 시각
  function parseDateTime(s) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2}))?/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 23), +(m[5] || 59)) : null;
  }
  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function fmtDate(d) { return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + DOW[d.getDay()] + ")"; }
  function fmtShort(d) { return (d.getMonth() + 1) + "." + d.getDate() + " (" + DOW[d.getDay()] + ")"; }
  function fmtDue(d) { return fmtDate(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }

  /* ---------- 오늘 (테스트용 날짜 지원) ---------- */
  var S = C.schedule || {};
  var offset = 0;
  if (S.today) {
    var real = new Date();
    var fake = parseDate(S.today);
    if (fake) {
      fake.setHours(real.getHours(), real.getMinutes(), real.getSeconds());
      offset = fake.getTime() - real.getTime();
    }
  }
  function now() { return new Date(Date.now() + offset); }
  function today() { var n = now(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  /* ---------- 주차 날짜 계산 ---------- */
  var holidays = {};
  (S.holidays || []).forEach(function (h) { var d = parseDate(h.date); if (d) holidays[key(d)] = h.label || "휴강"; });

  function buildWeeks() {
    var weeks = (C.curriculum && C.curriculum.weeks) || [];
    var cursor = parseDate(S.startDate) || today();
    // 개강일이 수업 요일이 아니면 다음 수업 요일로 맞춤
    if (typeof S.classWeekday === "number") {
      while (cursor.getDay() !== S.classWeekday) cursor = addDays(cursor, 1);
    }
    return weeks.map(function (w, i) {
      var date;
      if (w.date) {
        date = parseDate(w.date);
      } else {
        var guard = 0;
        while (holidays[key(cursor)] && guard++ < 20) cursor = addDays(cursor, 7);
        date = cursor;
      }
      cursor = addDays(date, 7);
      return {
        n: i + 1,
        data: w,
        date: date,
        time: w.time || S.time || "",
        place: w.place || S.place || "",
        due: w.assignment ? parseDateTime(w.assignment.due) : null
      };
    });
  }
  var WEEKS = buildWeeks();

  // 날짜별 이벤트 (달력용)
  var EVENTS = {};
  function ev(k) { return EVENTS[k] || (EVENTS[k] = { week: null, holiday: null, dues: [] }); }
  WEEKS.forEach(function (w) {
    ev(key(w.date)).week = w;
    if (w.due) ev(key(w.due)).dues.push(w);
  });
  Object.keys(holidays).forEach(function (k) { ev(k).holiday = holidays[k]; });

  /* ---------- 주차별 목록 ---------- */
  function renderWeek(w) {
    var d = w.data;
    var t = today();
    var isToday = key(w.date) === key(t);
    var isPast = w.date < t;
    var badges = "";
    if (d.type === "exam") badges += '<span class="badge badge-exam">시험</span>';
    if (d.assignment) badges += '<span class="badge badge-asg" data-due="' + (w.due ? w.due.getTime() : "") + '">과제</span>';
    if (isToday) badges += '<span class="badge badge-now">오늘 수업</span>';

    var videos = (d.videos || []).length
      ? '<ul class="video-list">' + list(d.videos, function (v) {
          return v.url
            ? '<li><a href="' + esc(v.url) + '" target="_blank" rel="noopener"><span class="play" aria-hidden="true">▶</span>' + esc(v.title) + '<span class="sr-only"> (새 창)</span></a></li>'
            : '<li><span class="play muted" aria-hidden="true">▶</span>' + esc(v.title) + ' <small class="muted">(링크 준비 중)</small></li>';
        }) + "</ul>"
      : '<p class="muted small">이번 주는 참고 영상이 없습니다.</p>';

    var asg = "";
    if (d.assignment) {
      var a = d.assignment;
      asg =
        '<div class="assignment" data-due="' + (w.due ? w.due.getTime() : "") + '">' +
          '<div class="asg-head"><span class="asg-label">과제</span><h4>' + esc(a.title) + "</h4></div>" +
          "<p>" + esc(a.desc) + "</p>" +
          '<div class="asg-foot">' +
            '<div class="asg-time">' +
              '<span class="due">마감 <strong>' + (w.due ? fmtDue(w.due) : "미정") + "</strong></span>" +
              '<span class="countdown" aria-live="off"></span>' +
            "</div>" +
            '<a class="btn btn-primary btn-sm submit" data-url="' + esc(a.submitUrl || "") + '" target="_blank" rel="noopener">제출하기</a>' +
          "</div>" +
        "</div>";
    }

    return (
      '<details class="week card' + (isPast ? " past" : "") + (d.type === "exam" ? " exam" : "") + '" id="week-' + w.n + '" data-week="' + w.n + '">' +
        "<summary>" +
          '<span class="week-no"><strong>' + w.n + "</strong><small>주차</small></span>" +
          '<span class="week-main"><span class="week-date">' + fmtShort(w.date) + "</span><span class=\"week-title\">" + esc(d.title) + "</span></span>" +
          '<span class="week-badges">' + badges + "</span>" +
        "</summary>" +
        '<div class="week-body">' +
          '<dl class="week-meta">' +
            '<div><dt>📅 날짜·시간</dt><dd>' + fmtDate(w.date) + (w.time ? " · " + esc(w.time) : "") + "</dd></div>" +
            '<div><dt>📍 장소</dt><dd>' + esc(w.place) + "</dd></div>" +
          "</dl>" +
          '<div class="week-cols">' +
            '<div><h4>학습 내용</h4><ul class="topic-list">' + list(d.topics, function (t) { return "<li>" + esc(t) + "</li>"; }) + "</ul></div>" +
            "<div><h4>참고 영상</h4>" + videos + "</div>" +
          "</div>" +
          asg +
          '<div class="wk-extra" data-wk="' + w.n + '"></div>' + // 주차별 AI 학습 자료 (week-ai)
        "</div>" +
      "</details>"
    );
  }

  /* ---------- 섹션 전체 ---------- */
  function render(c) {
    var head =
      '<div class="section-head reveal">' +
      (c.eyebrow ? '<span class="eyebrow">' + esc(c.eyebrow) + "</span>" : "") +
      "<h2>" + esc(c.title) + "</h2>" + (c.lead ? "<p>" + esc(c.lead) + "</p>" : "") + "</div>";

    var phases = list(c.phases, function (p, i) {
      return (
        '<article class="card lift phase reveal" data-step="' + pad(i + 1) + '">' +
        '<span class="phase-weeks">' + esc(p.weeks) + "</span>" +
        "<h3>" + esc(p.title) + "</h3><ul>" + list(p.items, function (it) { return "<li>" + esc(it) + "</li>"; }) + "</ul></article>"
      );
    });

    var weeks = WEEKS.length
      ? '<div class="weeks-head reveal">' +
          '<h3 class="sub-title">주차별 강의 계획</h3>' +
          '<div class="weeks-tools">' +
            '<button type="button" class="chip" data-weeks="open">모두 펼치기</button>' +
            '<button type="button" class="chip" data-weeks="close">모두 접기</button>' +
          "</div>" +
        "</div>" +
        '<div class="week-list">' + WEEKS.map(renderWeek).join("") + "</div>"
      : "";

    var calendar = WEEKS.length
      ? '<h3 class="sub-title reveal" id="calendar-title">수업 달력</h3>' +
        '<div class="calendar-wrap reveal">' +
          '<div class="card calendar" aria-labelledby="calendar-title">' +
            '<div class="cal-head">' +
              '<button type="button" class="cal-nav" data-cal="-1" aria-label="이전 달">‹</button>' +
              '<div class="cal-title" aria-live="polite"></div>' +
              '<button type="button" class="cal-nav" data-cal="1" aria-label="다음 달">›</button>' +
            "</div>" +
            '<div class="cal-grid cal-dow">' + DOW.map(function (d, i) { return '<span class="' + (i === 0 ? "sun" : i === 6 ? "sat" : "") + '">' + d + "</span>"; }).join("") + "</div>" +
            '<div class="cal-grid cal-days"></div>' +
            '<div class="cal-legend">' +
              '<span><i class="lg lg-class"></i>수업</span>' +
              '<span><i class="lg lg-due"></i>과제 마감</span>' +
              '<span><i class="lg lg-holiday"></i>휴강</span>' +

      : "";

    return '<section id="curriculum"><div class="container">' + head +
      '<div class="grid grid-4">' + phases + "</div>" + weeks + calendar + "</div></section>";

  /* ---------- 카운트다운 ---------- */
  function remain(ms) {
    var m = Math.floor(ms / 60000);
    var d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
    if (d > 0) return d + "일 " + h + "시간 " + mi + "분";
    if (h > 0) return h + "시간 " + mi + "분";
    return Math.max(mi, 1) + "분";
  }
  function dday(ms) {
    var due = new Date(Date.now() + offset + ms);
    var diff = Math.round((new Date(due.getFullYear(), due.getMonth(), due.getDate()) - today()) / 86400000);
    return diff <= 0 ? "D-day" : "D-" + diff;
  }
  function tick() {
    var n = now().getTime();
    document.querySelectorAll(".assignment").forEach(function (box) {
      var due = +box.dataset.due;
      var cd = box.querySelector(".countdown");
      var btn = box.querySelector(".submit");
      var url = btn.dataset.url;
      var left = due - n;
      var closed = !due || left <= 0;
      box.classList.toggle("closed", !!due && left <= 0);
      box.classList.toggle("urgent", left > 0 && left < 86400000);
      if (!due) cd.textContent = "";
      else if (closed) cd.innerHTML = '<span class="dd dd-closed">마감</span>제출 기간이 끝났습니다';
      else cd.innerHTML = '<span class="dd">' + dday(left) + "</span>마감까지 " + remain(left) + " 남음";

      var allowLate = ((((C.participate || {}).portal || {}).submission) || {}).allowLate;
      var portal = !!document.getElementById("portal");
      if (closed && due && !allowLate) setBtn(btn, false, "제출 마감");
      else if (url) { setBtn(btn, true, "제출하기"); btn.href = url; btn.target = "_blank"; }
      else if (portal) {
        // 제출 주소가 없으면 사이트 안 '수강생 공간'에서 제출
        setBtn(btn, true, closed ? "지각 제출하기" : "사이트에서 제출하기");
        btn.href = "#portal";
        btn.removeAttribute("target");
        btn.dataset.submitWeek = box.closest(".week").dataset.week;
      }
      else setBtn(btn, false, "제출 링크 준비 중");
    });
    document.querySelectorAll(".badge-asg").forEach(function (b) {
      var due = +b.dataset.due;
      if (!due) return;
      var left = due - n;
      b.textContent = left > 0 ? "과제 " + dday(left) : "과제 마감";
      b.classList.toggle("closed", left <= 0);
      b.classList.toggle("urgent", left > 0 && left < 86400000);
    });
  }
  function setBtn(btn, on, label) {
    btn.textContent = label;
    if (on) { btn.removeAttribute("aria-disabled"); btn.removeAttribute("tabindex"); }
    else { btn.removeAttribute("href"); btn.setAttribute("aria-disabled", "true"); btn.setAttribute("tabindex", "-1"); }
  }

  /* ---------- 주차 열기 ---------- */
  function openWeek(n) {
    var el = document.getElementById("week-" + n);
    if (!el) return;
    el.open = true;
    el.classList.add("in");
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.add("flash");
    setTimeout(function () { el.classList.remove("flash"); }, 1600);
  }

  /* ---------- 달력 ---------- */
  var view, selected;
  function renderCalendar() {
    var root = document.querySelector(".calendar");
    if (!root) return;
    var y = view.getFullYear(), m = view.getMonth();
    root.querySelector(".cal-title").textContent = y + "년 " + (m + 1) + "월";

    var first = new Date(y, m, 1);
    var days = new Date(y, m + 1, 0).getDate();
    var tKey = key(today());
    var html = "";
    for (var i = 0; i < first.getDay(); i++) html += '<span class="cal-cell empty" aria-hidden="true"></span>';
    for (var d = 1; d <= days; d++) {
      var date = new Date(y, m, d);
      var k = key(date);
      var e = EVENTS[k];
      var cls = ["cal-cell"];
      var marks = "";
      var label = fmtDate(date);
      if (date.getDay() === 0) cls.push("sun");
      if (date.getDay() === 6) cls.push("sat");
      if (k === tKey) { cls.push("today"); label += ", 오늘"; }
      if (selected && k === key(selected)) cls.push("selected");
      if (e && e.week) { cls.push("has-class"); marks += '<span class="cal-tag">' + e.week.n + "주차</span>"; label += ", " + e.week.n + "주차 수업"; }
      if (e && e.holiday) { cls.push("has-holiday"); marks += '<span class="cal-tag holiday">휴강</span>'; label += ", " + e.holiday; }
      if (e && e.dues.length) { cls.push("has-due"); marks += '<span class="cal-dot" aria-hidden="true"></span>'; label += ", 과제 마감"; }
      html += '<button type="button" class="' + cls.join(" ") + '" data-date="' + k + '" aria-label="' + esc(label) + '"' +
        (selected && k === key(selected) ? ' aria-pressed="true"' : "") + '><span class="cal-num">' + d + "</span>" + marks + "</button>";
    }
    root.querySelector(".cal-days").innerHTML = html;
  }

  function renderDetail() {
    var box = document.querySelector(".cal-detail");
    if (!box || !selected) return;
    var e = EVENTS[key(selected)] || {};
    var html = '<p class="detail-date">' + selected.getFullYear() + "년 " + fmtDate(selected) + "</p>";

    if (e.week) {
      var w = e.week;
      html +=
        '<div class="detail-class">' +
          '<span class="badge badge-week">' + w.n + "주차</span>" +
          (w.data.type === "exam" ? ' <span class="badge badge-exam">시험</span>' : "") +
          "<h4>" + esc(w.data.title) + "</h4>" +
          '<p class="detail-meta">⏰ ' + esc(w.time) + "<br>📍 " + esc(w.place) + "</p>" +
          '<ul class="topic-list">' + list(w.data.topics, function (t) { return "<li>" + esc(t) + "</li>"; }) + "</ul>" +
          '<button type="button" class="btn btn-ghost btn-sm" data-open-week="' + w.n + '">주차 자세히 보기 →</button>' +
        "</div>";
    }
    if (e.holiday) html += '<div class="detail-note holiday">🌷 ' + esc(e.holiday) + "</div>";
    if (e.dues && e.dues.length) {
      html += e.dues.map(function (w) {
        return '<div class="detail-note due">📝 <strong>' + esc(w.data.assignment.title) + "</strong> 마감 " +
          pad(w.due.getHours()) + ":" + pad(w.due.getMinutes()) +
          ' <button type="button" class="link-btn" data-open-week="' + w.n + '">과제 보기</button></div>';
      }).join("");
    }
    if (!e.week && !e.holiday && !(e.dues && e.dues.length)) {
      var next = WEEKS.filter(function (w) { return w.date > selected; })[0];
      html += '<p class="muted">이날은 수업이 없습니다.</p>' +
        (next ? '<p class="small">다음 수업: <button type="button" class="link-btn" data-goto="' + key(next.date) + '">' + fmtDate(next.date) + " · " + next.n + "주차</button></p>" : "");
    }
    box.innerHTML = html;
  }

  function select(date, moveView) {
    selected = date;
    if (moveView) view = new Date(date.getFullYear(), date.getMonth(), 1);
    renderCalendar();
    renderDetail();
  }

  function initCalendar() {
    if (!document.querySelector(".calendar")) return;
    var t = today();
    var firstW = WEEKS[0].date, lastW = WEEKS[WEEKS.length - 1].date;
    var inTerm = t >= new Date(firstW.getFullYear(), firstW.getMonth(), 1) && t <= new Date(lastW.getFullYear(), lastW.getMonth() + 1, 0);
    // 학기 중이면 오늘, 아니면 1주차 날짜를 먼저 보여 줌
    var start = inTerm ? t : firstW;
    if (inTerm) {
      var e = EVENTS[key(t)];
      if (!(e && e.week)) start = (WEEKS.filter(function (w) { return w.date >= t; })[0] || {}).date || t;
    }
    select(start, true);

    var wrap = document.querySelector(".calendar-wrap");
    wrap.addEventListener("click", function (ev) {
      var nav = ev.target.closest("[data-cal]");
      if (nav) {
        view = new Date(view.getFullYear(), view.getMonth() + (+nav.dataset.cal), 1);
        renderCalendar();
        return;
      }
      if (ev.target.closest(".cal-today")) { select(today(), true); return; }
      var cell = ev.target.closest(".cal-cell[data-date]");
      if (cell) { select(parseDate(cell.dataset.date), false); return; }
      var go = ev.target.closest("[data-goto]");
      if (go) { select(parseDate(go.dataset.goto), true); return; }
      var ow = ev.target.closest("[data-open-week]");
      if (ow) openWeek(+ow.dataset.openWeek);
    });
  }

  /* ---------- 시작 ---------- */
  function init() {
    // 모두 펼치기 / 접기
    document.querySelectorAll("[data-weeks]").forEach(function (b) {
      b.addEventListener("click", function () {
        var open = b.dataset.weeks === "open";
        document.querySelectorAll(".week").forEach(function (w) { w.open = open; });
      });
    });
    // 다음 수업 주차를 기본으로 펼쳐 둠 (학기 중일 때)
    var t = today();
    var upcoming = WEEKS.filter(function (w) { return w.date >= t; })[0];
    if (upcoming && WEEKS[0].date <= addDays(t, 14)) {
      var el = document.getElementById("week-" + upcoming.n);
      if (el) {
        el.open = true;
        var b = el.querySelector(".week-badges");
        if (key(upcoming.date) !== key(t)) b.insertAdjacentHTML("beforeend", '<span class="badge badge-now">다음 수업</span>');
      }
    }
    tick();
    setInterval(tick, 30000);
    initCalendar();
  }

  window.Curriculum = {
    render: render, init: init, weeks: WEEKS,
    now: now, today: today, key: key, fmtDate: fmtDate, fmtDue: fmtDue, fmtShort: fmtShort
  };
})();

/* ######################################################## participate */
/* ==========================================================
   수강생 참여 기능
   - 실시간 투표 (막대그래프)
   - 회원가입 (빠진 항목 안내 · 비밀번호 해시 저장)
   - 수강생 로그인 · 출석 체크 · 과제 파일 제출
   내용은 설정(SITE_CONFIG)의 participate 에서 고칩니다.

   ※ 저장 방식: 서버가 없으므로 기본은 브라우저 저장소(localStorage).
     participate.endpoint 에 접수 주소를 넣으면 같은 내용을 그 주소로도 보냅니다.
   ========================================================== */
(function () {
  "use strict";

  var C = window.SITE_CONFIG || {};
  var P = C.participate;
  var CU = window.Curriculum || {};

  /* ---------- 도우미 ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function list(arr, fn) { return (arr || []).map(fn).join(""); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function now() { return CU.now ? CU.now() : new Date(); }
  function today() { return CU.today ? CU.today() : new Date(new Date().toDateString()); }
  function dayKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function fmtStamp(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + hm(d);
  }
  function fmtSize(b) {
    return b >= 1048576 ? (b / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(b / 1024)) + "KB";
  }
  // 받침에 따라 을/를 고르기
  function obj(word) {
    var c = word.charCodeAt(word.length - 1) - 0xac00;
    if (c < 0 || c > 11171) return word + "을(를)";
    return word + (c % 28 ? "을" : "를");
  }

  /* ---------- 브라우저 저장소 (실패해도 사이트는 동작) ---------- */
  var PREFIX = "kcn:";
  var store = {
    get: function (k, d) {
      try { var v = localStorage.getItem(PREFIX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; }
    },
    del: function (k) { try { localStorage.removeItem(PREFIX + k); } catch (e) { /* 무시 */ } }
  };
  window.SiteStore = store;

  /* ---------- 접수 주소로 보내기 (설정된 경우만) ---------- */
  // 일반 폼 형식(urlencoded)으로 보냅니다. 파일은 base64 글자로 바꿔 fileData에 담습니다.
  // (Google Apps Script 의 e.parameter 로 바로 읽을 수 있는 형식 — README의 예시 코드 참고)
  function send(type, data) {
    if (!P || !P.endpoint) return Promise.resolve(false);
    var body = new URLSearchParams();
    body.append("type", type);
    body.append("sentAt", new Date().toISOString());
    var file = null;
    Object.keys(data).forEach(function (k) {
      var v = data[k];
      if (typeof File !== "undefined" && v instanceof File) file = v;
      else body.append(k, typeof v === "object" ? JSON.stringify(v) : v);
    });
    var ready = file
      ? new Promise(function (res) {
          var r = new FileReader();
          r.onload = function () {
            body.append("fileName", file.name);
            body.append("fileType", file.type || "application/octet-stream");
            body.append("fileData", String(r.result).split(",")[1] || "");
            res();
          };
          r.onerror = function () { res(); };
          r.readAsDataURL(file);
        })
      : Promise.resolve();
    return ready
      .then(function () { return fetch(P.endpoint, { method: "POST", body: body, mode: "no-cors" }); })
      .then(function () { return true; })
      .catch(function () { toast("전송에 실패했습니다. 인터넷 연결을 확인해 주세요.", "error"); return false; });
  }

  // 수강생 이름 기록 (관리자 화면의 출석·과제 표에 쓰임)
  function remember(id, name) {
    var people = store.get("people", {});
    people[id] = name;
    store.set("people", people);
  }
  function rosterKey(id, name) {
    var salt = (C.admin && C.admin.salt) || "";
    return window.sha256 ? window.sha256(salt + ":roster:" + id + ":" + name.replace(/\s+/g, "")) : "";
  }
  window.rosterKey = rosterKey;

  /* ---------- 알림 (토스트) ---------- */
  function toast(msg, type) {
    var box = $(".toasts");
    if (!box) {
      box = document.createElement("div");
      box.className = "toasts";
      box.setAttribute("aria-live", "polite");
      document.body.appendChild(box);
    }
    var t = document.createElement("div");
    t.className = "toast" + (type ? " toast-" + type : "");
    t.textContent = msg;
    box.appendChild(t);
    requestAnimationFrame(function () { t.classList.add("show"); });
    setTimeout(function () {
      t.classList.remove("show");
      setTimeout(function () { t.remove(); }, 300);
    }, 3200);
  }
  window.showToast = toast;

  if (!P) {
    window.Participate = { render: function () { return ""; }, init: function () {} };

  /* ==========================================================
     1) 실시간 투표
     ========================================================== */
  var poll = P.poll || { options: [] };

  function tallies() { return store.get("poll:tally", {}); }
  function myVote() { return store.get("poll:mine", null); }
  function counts() {
    var t = tallies();
    return poll.options.map(function (o) { return Math.max(0, (Number(o.count) || 0) + (t[o.id] || 0)); });
  }

  function renderPoll() {
    var opts = list(poll.options, function (o) {
      return (
        '<button type="button" class="poll-opt" data-id="' + esc(o.id) + '" aria-pressed="false">' +
          '<span class="poll-emoji" aria-hidden="true">' + esc(o.emoji) + "</span>" +
          '<span class="poll-label">' + esc(o.label) + "</span>" +
          '<span class="poll-check" aria-hidden="true">✓</span>' +
        "</button>"
      );
    });
    var bars = list(poll.options, function (o) {
      return (
        '<div class="bar-row" data-id="' + esc(o.id) + '">' +
          '<div class="bar-label"><span aria-hidden="true">' + esc(o.emoji) + "</span> " + esc(o.label) + "</div>" +
          '<div class="bar-track"><span class="bar-fill"></span></div>' +
          '<div class="bar-val"><strong>0%</strong><small>0표</small></div>' +
        "</div>"
      );
    });
    return (
      '<article class="card poll reveal" id="poll">' +
        '<div class="poll-head">' +
          '<span class="live"><i></i>LIVE</span>' +
          "<h3>" + esc(poll.title) + "</h3>" +
          '<p class="muted">' + esc(poll.desc) + "</p>" +
        "</div>" +
        '<div class="poll-body">' +
          '<div class="poll-options" role="group" aria-label="' + esc(poll.title) + '">' + opts + "</div>" +
          '<div class="poll-chart">' +
            '<div class="chart-head"><strong>투표 결과</strong><span class="poll-total">총 0표</span></div>' +
            '<div role="img" class="bars" aria-label="투표 결과 막대그래프">' + bars + "</div>" +
            '<p class="sr-only poll-sr" aria-live="polite"></p>' +
          "</div>" +
        "</div>" +
      "</article>"
    );
  }

  function updatePoll() {
    var root = $("#poll");
    if (!root) return;
    var c = counts();
    var total = c.reduce(function (a, b) { return a + b; }, 0);
    var max = Math.max.apply(null, c.concat(0));
    var mine = myVote();
    $(".poll-total", root).textContent = "총 " + total + "표";
    var summary = [];
    poll.options.forEach(function (o, i) {
      var pct = total ? Math.round((c[i] / total) * 100) : 0;
      var row = $('.bar-row[data-id="' + o.id + '"]', root);
      $(".bar-fill", row).style.width = (total ? (c[i] / total) * 100 : 0) + "%";
      $(".bar-val strong", row).textContent = pct + "%";
      $(".bar-val small", row).textContent = c[i] + "표";
      row.classList.toggle("mine", mine === o.id);
      row.classList.toggle("leader", total > 0 && c[i] === max);
      var btn = $('.poll-opt[data-id="' + o.id + '"]', root);
      btn.setAttribute("aria-pressed", mine === o.id ? "true" : "false");
      summary.push(o.label + " " + c[i] + "표 " + pct + "%");
    });
    $(".bars", root).setAttribute("aria-label", "투표 결과: " + summary.join(", "));
    root.classList.toggle("voted", !!mine);
  }

  function vote(id) {
    var prev = myVote();
    if (prev === id) return;
    var t = tallies();
    if (prev) t[prev] = (t[prev] || 0) - 1;
    t[id] = (t[id] || 0) + 1;
    store.set("poll:tally", t);
    store.set("poll:mine", id);
    updatePoll();
    var o = poll.options.filter(function (x) { return x.id === id; })[0];
    $(".poll-sr").textContent = (o ? o.label : "") + "에 투표했습니다.";
    toast(prev ? "투표를 바꿨어요" : "투표 완료! 결과를 확인해 보세요", "ok");
    send("vote", { option: id, previous: prev || "" });
  }

  /* ==========================================================
     2) 회원가입
     ========================================================== */
  var apply = P.apply || { fields: [] };
  var AUTO = { name: "name", email: "email", phone: "tel", studentId: "off", userId: "username", password: "new-password", password2: "new-password" };

  /* ----- 회원 계정 (비밀번호는 해시값만 저장) ----- */
  function fieldByName(n) { return apply.fields.filter(function (x) { return x.name === n; })[0]; }
  function isPw(f) { return f && f.type === "password"; }
  function members() { return store.get("members", {}); }
  function myAccountId() { var s = store.get("apply", null); return s && s.data ? s.data.userId : null; }
  function idTaken(id) { return !!members()[id] && id !== myAccountId(); }
  function randomSalt() {
    var a = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
  }
  function hashPassword(salt, id, pw) { return window.sha256 ? window.sha256(salt + ":" + id + ":" + pw) : ""; }

  function fieldHtml(f) {
    var id = "ap-" + f.name;
    var req = f.required ? ' <span class="req" aria-hidden="true">*</span>' : ' <span class="opt">(선택)</span>';
    var a = ' aria-describedby="' + id + '-err"' + (f.required ? ' aria-required="true"' : "");
    var ctrl, wide = false, wrapTag = "div";
    switch (f.type) {
      case "select":
        ctrl = '<label for="' + id + '">' + esc(f.label) + req + "</label>" +
          '<select id="' + id + '" name="' + esc(f.name) + '"' + a + '><option value="">선택하세요</option>' +
          list(f.options, function (o) { return '<option value="' + esc(o) + '">' + esc(o) + "</option>"; }) + "</select>";
        break;
      case "radio":
        wide = true; wrapTag = "fieldset";
        ctrl = "<legend>" + esc(f.label) + req + "</legend>" +
          '<div class="radio-row">' + list(f.options, function (o, i) {
            return '<label class="radio"><input type="radio" name="' + esc(f.name) + '" value="' + esc(o) + '"' +
              (i === 0 ? ' id="' + id + '"' : "") + a + "><span>" + esc(o) + "</span></label>";
          }) + "</div>";
        break;
      case "textarea":
        wide = true;
        ctrl = '<label for="' + id + '">' + esc(f.label) + req + "</label>" +
          '<textarea id="' + id + '" name="' + esc(f.name) + '" rows="4"' +
          (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : "") + a + "></textarea>" +
          (f.minLength ? '<span class="char-count" aria-hidden="true">0자</span>' : "");
        break;
      case "checkbox":
        wide = true;
        ctrl = '<label class="check"><input type="checkbox" id="' + id + '" name="' + esc(f.name) + '" value="동의"' + a + ">" +
          "<span>" + esc(f.label) + req + "</span></label>";
        break;
      default:
        ctrl = '<label for="' + id + '">' + esc(f.label) + req + "</label>" +
          '<input id="' + id + '" name="' + esc(f.name) + '" type="' + esc(f.type || "text") + '"' +
          (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : "") +
          (f.inputmode ? ' inputmode="' + esc(f.inputmode) + '"' : "") +
          ' autocomplete="' + (AUTO[f.name] || "on") + '"' + a + ">";
    }
    return '<' + wrapTag + ' class="field' + (wide ? " wide" : "") + '" data-field="' + esc(f.name) + '">' +
      ctrl + '<p class="field-err" id="' + id + '-err"></p></' + wrapTag + ">";
  }

  function renderApply() {
    return (
      '<article class="card apply reveal" id="apply">' +
        '<div class="block-head"><span class="block-icon" aria-hidden="true">📝</span><div>' +
          "<h3>" + esc(apply.title) + "</h3>" +
          '<p class="muted small">' + esc(apply.desc) + "</p></div></div>" +
        '<div class="apply-body"></div>' +
      "</article>"
    );
  }

  function applyForm() {
    return (
      '<form class="apply-form" novalidate>' +
        '<div class="form-summary" role="alert" hidden></div>' +
        '<div class="form-grid">' + list(apply.fields, fieldHtml) + "</div>" +
        '<div class="form-actions"><button type="submit" class="btn btn-primary">' + esc(apply.submitLabel || "제출") + "</button></div>" +
      "</form>"
    );
  }

  function fieldValue(form, f) {
    if (f.type === "radio") { var r = $('input[name="' + f.name + '"]:checked', form); return r ? r.value : ""; }
    var el = form.elements[f.name];
    if (!el) return "";
    if (f.type === "checkbox") return el.checked ? el.value : "";
    return el.value.trim();
  }

  function checkField(form, f) {
    var v = fieldValue(form, f), msg = "";
    if (!v) {
      if (f.required) {
        msg = f.type === "checkbox" ? "동의해야 가입할 수 있습니다."
          : (f.type === "select" || f.type === "radio") ? obj(f.label) + " 선택해 주세요."
          : obj(f.label) + " 입력해 주세요.";
      }
    } else if (f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
      msg = f.patternMsg || "이메일 형식이 올바르지 않습니다.";
    } else if (f.pattern && !new RegExp(f.pattern).test(v)) {
      msg = f.patternMsg || "형식이 올바르지 않습니다.";
    } else if (f.minLength && v.length < f.minLength) {
      msg = f.minLength + "자 이상 입력해 주세요. (지금 " + v.length + "자)";
    } else if (f.matches && v !== fieldValue(form, fieldByName(f.matches) || {})) {
      msg = f.matchMsg || "입력한 값이 서로 다릅니다.";
    } else if (f.unique && idTaken(v)) {
      msg = "이미 사용 중인 아이디입니다. 다른 아이디를 입력해 주세요.";
    }
    var wrap = $('[data-field="' + f.name + '"]', form);
    wrap.classList.toggle("invalid", !!msg);
    $(".field-err", wrap).textContent = msg;
    $$("input,select,textarea", wrap).forEach(function (el) {
      if (msg) el.setAttribute("aria-invalid", "true"); else el.removeAttribute("aria-invalid");
    });
    return msg ? { f: f, msg: msg, missing: !v } : null;
  }

  function showApply(state) {
    var body = $("#apply .apply-body");
    if (!body) return;
    var saved = store.get("apply", null);
    if (saved && state !== "edit") {
      var d = saved.data || {};
      var rows = apply.fields.filter(function (f) { return f.type !== "checkbox" && !isPw(f) && d[f.name]; }).slice(0, 6);
      body.innerHTML =
        '<div class="apply-done">' +
          '<div class="done-icon" aria-hidden="true">🌸</div>' +
          "<h4>" + esc(apply.successTitle) + "</h4>" +
          "<p>" + esc(apply.successText) + "</p>" +
          '<dl class="done-list">' + list(rows, function (f) {
            return "<div><dt>" + esc(f.label) + "</dt><dd>" + esc(d[f.name]) + "</dd></div>";
          }) + "<div><dt>가입 시각</dt><dd>" + esc(fmtStamp(saved.at)) + "</dd></div></dl>" +
          (!P.endpoint ? '<p class="demo-note">' + esc(P.demoNotice) + "</p>" : "") +
          '<button type="button" class="btn btn-ghost btn-sm apply-edit">회원 정보 수정</button>' +
        "</div>";
      return;
    }
    body.innerHTML = applyForm();
    var form = $(".apply-form", body);
    // 다시 작성할 때는 이전 내용 채워 넣기
    if (saved && saved.data) {
      apply.fields.forEach(function (f) {
        var v = saved.data[f.name];
        if (!v || isPw(f)) return; // 비밀번호는 다시 입력
        if (f.type === "radio") { var r = $('input[name="' + f.name + '"][value="' + CSS.escape(v) + '"]', form); if (r) r.checked = true; }
        else if (f.type === "checkbox") form.elements[f.name].checked = true;
        else form.elements[f.name].value = v;
      });
    }
    updateCounts(form);
  }

  function updateCounts(form) {
    $$("textarea", form).forEach(function (t) {
      var c = t.parentNode.querySelector(".char-count");
      if (c) c.textContent = t.value.trim().length + "자";
    });
  }

  function submitApply(form) {
    var errs = apply.fields.map(function (f) { return checkField(form, f); }).filter(Boolean);
    var box = $(".form-summary", form);
    if (errs.length) {
      var missing = errs.filter(function (e) { return e.missing; });
      var wrong = errs.filter(function (e) { return !e.missing; });
      box.innerHTML =
        '<strong>⚠️ 확인이 필요한 항목이 ' + errs.length + "개 있어요</strong>" +
        (missing.length ? "<p>빠진 항목: " + missing.map(function (e) {
          return '<button type="button" class="link-btn" data-focus="' + esc(e.f.name) + '">' + esc(e.f.short || e.f.label) + "</button>";
        }).join(", ") + "</p>" : "") +
        (wrong.length ? "<p>다시 확인: " + wrong.map(function (e) {
          return '<button type="button" class="link-btn" data-focus="' + esc(e.f.name) + '">' + esc(e.f.short || e.f.label) + "</button>";
        }).join(", ") + "</p>" : "");
      box.hidden = false;
      focusField(form, errs[0].f.name);
      return;
    }
    box.hidden = true;
    // 비밀번호는 data에 넣지 않음 (저장·전송·관리자 표·엑셀 어디에도 원문이 남지 않게)
    var data = {};
    apply.fields.forEach(function (f) { if (!isPw(f)) data[f.name] = fieldValue(form, f); });
    var at = now().toISOString();
    var pwField = apply.fields.filter(function (f) { return isPw(f) && !f.matches; })[0];
    if (pwField && data.userId) {
      var ms = members();
      var prevId = myAccountId();
      if (prevId && prevId !== data.userId) delete ms[prevId]; // 아이디를 바꾼 경우
      var salt = randomSalt();
      ms[data.userId] = {
        salt: salt, hash: hashPassword(salt, data.userId, fieldValue(form, pwField)), at: at,
        name: data.name || "", studentId: data.studentId || "" // 로그인 후 출석·과제 기록에 쓰임
      };
      store.set("members", ms);
    }
    $$('input[type="password"]', form).forEach(function (el) { el.value = ""; });
    store.set("apply", { data: data, at: at });
    var all = store.get("apply:list", []);
    all.push({ data: data, at: at });
    store.set("apply:list", all);
    send("apply", data);
    showApply();
    $("#apply").scrollIntoView({ behavior: "smooth", block: "start" });
    toast("회원가입이 완료되었어요!", "ok");
    if (window.Welcome) window.Welcome.burst(0.5);
  }

  }
